name: 7.8% GDP growth, decoded
brand: vaq-hq
format: instagram-portrait
caption: |
  India grew 7.8% in April–June. The number beat every forecast. The parts tell a sharper story than the headline.

  What the data says. Real GDP rose 7.8% in Q1 FY27 against 6.9% a year ago, on a consensus near 7.2%. Nominal GDP grew 10.3%, real GVA 8.2%.

  What did the lifting. Investment. Gross fixed capital formation grew 11.9%, its share of GDP up 290 basis points to 34.3%. Exports rose 12% through a West Asia crisis quarter; imports fell 1.1%. Manufacturing grew 9.2% against 8.3% last year; financial and professional services 12.1%.

  The part worth being precise about. Consumption slowed to 7.1% from 7.5% in the previous quarter. Government consumption grew just 4.3%. Mining contracted 2.4%. And the nominal-real gap is a deflator near 2.4%, with higher inflation flattering the nominal print.

  The line that survives the fine print: capex is buying the growth that consumption paused. The 7.8 is real. The mix is the story.

  Sources: MoSPI Q1 FY27 release, 31 Aug 2026, as reported by Forbes India, Business Standard and Business Today. Peg: HT's Number Theory, 1 Sep 2026. Images: Wikimedia Commons, CC BY-SA.

  @vaq_hq
