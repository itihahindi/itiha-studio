- layout: story
  chapter: Chapter 04 · stage one
  headline: |
    Twenty Years
    For One *Generation*
  body: The span is not arbitrary. It is the minimum required to educate and brainwash a single [generation
    of students] — to expose young minds to the ideology while the nation's traditional [moral and patriotic]
    counterweight is eliminated around them.
- layout: numbered-list
  chapter: Chapter 05 · the three levels
  headline: |
    Where the *Attack*
    Actually *Lands*
  items:
  - label: Ideas
    body: Religion commercialised into theatre. Education softened into moral relativity. Media monopolised
      and diverted onto non-issues.
  - label: Structures
    body: Criminals become victims, citizens defenceless. Police and military discredited until the public
      distrusts its own defence. Empty peace treaties breed complacency, then isolation.
  - label: Life
    body: The family replaced by the welfare state. Spectator sport for participation. Racial division
      inflamed. Labour bargaining turned to economic blackmail.
- layout: story
  theme: light
  chapter: Chapter 06 · the lock
  headline: |
    Irreversible for
    One *Generation*
  body: |
    The schooled generation matures into [government], business, media and the security services. Set in their ways, they now direct opinion and policy.
    Objective truth reaches them and does not land. Not even **physical evidence**.
- layout: story
  chapter: Chapter 07 · stage two
  headline: |
    The *Spinal Cord*
    Two to Five *Years*
  body: |
    Ideas no longer need attacking. Power structures do. Caretaker politicians sell artificial security; national institutions are bypassed by committees and boards until [mob-ocracy] rules.
    The economy is centrally planned, the State in cahoots with [monopolies] and unions.
- layout: comparison
  chapter: Chapter 08 · the inversion
  headline: |
    Allies *Abandoned*
    Enemies *Financed*
  left_label: Abroad
  left_headline: 'Defeatism

    And *Isolation*

    '
  left_body: 'Allies are dropped. The subverter expands its military reach while the target''s own politicians
    are brought to believe [their nation] is the one breaking international law.

    '
  right_label: At home
  right_headline: 'Trade With the

    *Subverter*

    '
  right_body: The nation's multinational [monopolies] go on appeasing, trading and extending credit to
    the power dismantling them.
- layout: story
  chapter: Chapter 09 · stage three
  headline: |
    Crisis
    Two to Six *Months*
  body: |
    Sleeper agents and domestic radicals move at once. The population, in complete confusion, welcomes [strong leaders] who promise to end the chaos — and grants them **emergency powers**.
    Power changes hands by revolution, civil war or [foreign intervention].
- layout: closing
  headline: |
    Then the *Radicals*
    Are *Rounded Up*
  body: |
    Normalisation is permanent. Yesterday's [useful idiots] are executed or imprisoned, the press censors itself, and a vanquished country learns [total state control].
