name: polymer-notes-trial
brand: vaq-hq
format: instagram-portrait
caption: |
  India has approved plastic money on trial. It approved the same thing in 2013 and never printed a note.

  What was cleared. The Finance Ministry has approved the RBI's proposal for field trials of polymer banknotes in the Rs 10 and Rs 20 denominations, one billion pieces of each, two billion notes in total. Minister of State for Finance Pankaj Chaudhary confirmed it in a written reply in the Lok Sabha on 27 July.

  Paper is not going anywhere. The government was explicit: polymer notes would circulate alongside paper, and there is no proposal to phase paper out. This is a trial of a substrate, not a currency reform.

  Why these two denominations. Rs 10 and Rs 20 are the notes that die fastest. They change hands constantly, live in pockets and cash boxes, and come back to the RBI limp. If polymer pays for itself anywhere, it pays for itself here. Polymer costs more per note to print and lasts several times longer, so the argument is lifecycle cost, not sticker price.

  The precedent. About 60 countries use polymer notes. Australia was first, in 1988, and has run its entire series on plastic for decades. Canada followed. The technology is not experimental anywhere except here.

  The part worth remembering. This is the second time. The RBI's 2013 annual report recorded a decision to issue one billion Rs 10 notes on polymer substrate for field trials in five cities, Kochi, Mysore, Jaipur, Shimla and Bhubaneswar, picked for their climatic spread. The trial was slated for 2014. It was deferred, then shelved, and not one of those notes reached a counter. So the correct way to read Monday's announcement is not "India is getting plastic notes" but "India has decided, again, to find out."

  One correction to what is circulating. There was no completed 2012 pilot that failed on printing and ATMs. There was an approval that was never executed. Those are different failures, and the second one is the one to watch for.

  What the trial actually has to prove. Whether the notes survive an Indian summer and an Indian monsoon, whether ATMs and cash-counting machines take them without jamming, and whether the public accepts a note that feels like a receipt. The first two are engineering. The third is the one that killed the last attempt before it started.

  Source: Minister of State for Finance Pankaj Chaudhary, written reply in the Lok Sabha, 27 July 2026, as reported by IANS and Business Standard; RBI Annual Report 2013 and the PIB release on the original five-city field trial.

