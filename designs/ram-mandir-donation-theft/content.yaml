name: ram-mandir-donation-theft
brand: vaq-hq
format: instagram-portrait
caption: |
  Eight people have been arrested over the theft of donations at the Ram Mandir in Ayodhya. Every one of them was hired staff. No trustee has been arrested.

  What happened. Allegations of theft from the temple's donation counting became public on 7 June 2026. The Uttar Pradesh government constituted a Special Investigation Team on 13 June, on the temple trust's own recommendation. The FIR was registered on 25 June, based on the SIT's preliminary findings, and eight people were arrested. Police recovered about 80 lakh rupees in cash. Investigators have documented roughly 70 instances of theft across about 40 days.

  Who was held. Among the eight is Tinnu Yadav, the driver of the trust's then general secretary Champat Rai. The rest are staff and contract workers hired to count the offerings.

  The part that raises the question. The joint resignation letters of Champat Rai and trustee Anil Mishra, as reported, claim that 81 lakh rupees was recovered inside the trust. That recovery is described as having happened before any FIR was filed. The trust's resignations were accepted on 6 July, the same day the SIT submitted its preliminary report. Krishna Mohan was appointed interim general secretary.

  What is not established. Investigators have not found that Champat Rai personally handled the money or benefited from it. Former principal secretary Nripendra Misra has vouched for his integrity. Rai has called the allegations against him baseless, has taken a vow of silence, and has said he will answer point by point once the SIT files its final report. The larger figure of 7 to 8 crore rupees is an Opposition allegation, not a confirmed finding.

  Where it stands. On 13 July 2026 a Supreme Court bench led by Chief Justice Surya Kant, with Justices Joymalya Bagchi and V. Mohna, issued notice to the Union government, the Uttar Pradesh government and the trust, and directed the SIT to file a status report. The petitions seek a CBI investigation and an audit of the trust's finances.

  None of this is an attack on the temple. Devotees gave the money. They are owed an accounting of it.

  Sources: The Week, 4 July 2026. ANI and India TV, 6 July 2026. ThePrint. LiveLaw, Business Standard and The Tribune, 13 July 2026. Images via Wikimedia Commons (GODL-India; CC BY-SA 4.0, Subhashish Panigrahi).

