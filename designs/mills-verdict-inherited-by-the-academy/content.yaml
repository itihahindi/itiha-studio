- layout: closing
  headline: |
    The Verdict Is Old.
    The Framework Is
    *Unchanged.*
  body: |
    Mill wrote without ever [seeing] India. His inheritors write from within it. The [reading room] has changed. The [conclusion] the reader is instructed to reach has not. The [subject] of the verdict, a civilisation that must not be permitted to [defend itself], is also the same.
