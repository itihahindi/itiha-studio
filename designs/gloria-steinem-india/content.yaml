  chapter: Chapter 05 · The Transplant
  headline: |
    A Western Version
    Of Walking In *Villages*
  body: |
    That was Steinem's own description of what she became. Back in New York she wrote for magazines, then organised, then never really stopped moving. The [consciousness-raising group] that carried American feminism through the 1970s — women in a circle, speaking in turn, testimony treated as evidence — had the shape of the [village meetings] she had sat in twenty years earlier.
  block_y: bottom
  headline_size: 96
  body_size: 44
