name: nepal-bhote-koshi-flood
brand: vaq-hq
format: instagram-reel
caption: |
  A glacier fell 1,200 metres. This is what arrived downstream. Newly released footage, captured more than 50 km below the collapse site according to the account that posted it, shows the flood wave reaching a settlement on the Trishuli and taking it whole.

  What happened. At about 8:40 AM on Wednesday 26 August, a section of glacier ice and rock broke off at roughly 5,200 metres above the Lhende valley in Tibet, about 20 km north of the Rasuwagadhi crossing, and plunged some 1,200 metres. The debris dammed and then released the river. The surge ran down the Lhende Khola into the Bhote Koshi and the Trishuli, hitting settlements along a 72 km stretch through Rasuwa and Nuwakot. The Trishuli rose as much as 9 metres in 30 minutes.

  The toll, as of 27 August. Nepal: 389 confirmed dead, 910 missing, including more than 500 foreign nationals. Tibet's Gyirong county: 3 dead, 558 missing. At least 19 bridges and about 40 km of road are gone. The Rasuwagadhi to Kerung trade route, Nepal's main land link to China, is cut.

  Not an earthquake. The USGS first logged a magnitude 4.4 quake. After reading the long period seismic waves and the satellite imagery, it revised the event to a magnitude 5.2 signal generated by the collapse itself.

  Why India is watching. The Trishuli becomes the Narayani and enters Bihar as the Gandak. Bihar opened all 36 gates of the Gandak Barrage at Valmikinagar as a precaution, projecting inflows of around 2.5 lakh cusecs against a normal 80,000, and put West Champaran, East Champaran, Gopalganj, Saran, Muzaffarpur and Vaishali on alert. India sent a rescue aircraft with about 10 tonnes of supplies and readied IAF and NDRF teams.

  The context. Hindu Kush Himalayan glaciers lost ice 65 percent faster in 2011 to 2020 than in the previous decade, and Nepal's glaciers have lost about a third of their volume in 30 years. Satellite data showed unusually warm conditions around this glacier before it gave way.

  Footage via @sustainme_in. Sources: Al Jazeera, Time, CNN, 26 and 27 August 2026. The Week, 26 August 2026. USGS.

