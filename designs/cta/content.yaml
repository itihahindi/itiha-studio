  texture: halftone
- layout: stat
  headline: |
    Notified In *1913*
  body: |
    Once a tribe was notified, nobody in it was innocent. [Registration, fingerprinting, roll-call late at night and again at dawn.] A [permit] was needed to visit the next village. Police could arrest on suspicion alone, and [low-paid constables ]used that power to extort money, labour, and worse from settlers.
