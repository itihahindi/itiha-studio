<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kavi Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,600&family=Hanken+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0a0a0a;
    --bg-card:   #141414;
    --bg-card-h: #1a1a1a;
    --border:    #222;
    --fg:        #E8DCC8;
    --fg-mute:   #888;
    --fg-dim:    #555;
    --red:       #C0392B;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }

  /* Wordmark / header */
  header {
    padding: 56px 64px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 32px; flex-wrap: wrap;
  }

  /* Brand switcher — each tab is a mini wordmark in its own identity */
  .brand-tabs {
    display: flex; align-items: stretch;
    border: 1px solid var(--border); background: #0e0e0e;
  }
  .brand-tabs button {
    display: flex; align-items: center; justify-content: center;
    min-width: 110px; padding: 12px 26px;
    background: transparent; border: 0; border-bottom: 3px solid transparent;
    cursor: pointer; letter-spacing: 0; text-transform: none;
    opacity: 0.42; transition: opacity 120ms ease, background 120ms ease;
  }
  .brand-tabs button + button { border-left: 1px solid var(--border); }
  .brand-tabs button:hover { opacity: 0.8; background: #141414; }
  .brand-tabs button.active { opacity: 1; background: #161616; }
  .brand-tabs button.active[data-brand="all"]    { border-bottom-color: #E8DCC8; }
  .brand-tabs button.active[data-brand="itiha"]  { border-bottom-color: #C0392B; }
  .brand-tabs button.active[data-brand="vaq-hq"] { border-bottom-color: #F4631E; }
  .brand-tabs .t-all {
    font: 600 13px 'JetBrains Mono', monospace; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--fg);
  }
  .brand-tabs .t-itiha {
    font-family: 'Bebas Neue', Impact, sans-serif; font-size: 22px;
    letter-spacing: 1.5px; color: var(--fg); line-height: 1;
  }
  .brand-tabs .t-itiha .dot { color: #C0392B; }
  .brand-tabs .t-vaq {
    font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 20px;
    letter-spacing: -0.01em; color: #fff; line-height: 1;
  }
  .brand-tabs .t-vaq .hq { color: #F4631E; }
  /* Search — one box, filters every grid on the page. Because the brand tabs
     and this box compose, it serves Itiha and Vaq HQ alike. */
  .search {
    position: relative; display: flex; align-items: center;
    flex: 1 1 260px; max-width: 420px; min-width: 200px;
  }
  .search .icon {
    position: absolute; left: 13px; pointer-events: none;
    display: flex; color: var(--fg-dim);
  }
  .search input {
    width: 100%; padding: 12px 38px 12px 38px;
    background: #0e0e0e; color: var(--fg);
    border: 1px solid var(--border); border-radius: 0;
    font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px;
    outline: none; transition: border-color 120ms ease, background 120ms ease;
    -webkit-appearance: none; appearance: none;
  }
  /* type=search paints its own clear affordance in WebKit — we ship one that
     matches the theme, so suppress the native pill and avoid a double ×. */
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search input::placeholder { color: var(--fg-dim); }
  .search input:hover { background: #121212; }
  .search input:focus { border-color: #3a3a3a; background: #141414; }
  .search .clear {
    position: absolute; right: 8px;
    background: transparent; border: 0; cursor: pointer;
    color: var(--fg-dim); font-size: 18px; line-height: 1;
    padding: 4px 8px; display: none;
  }
  .search .clear:hover { color: var(--fg); }
  .search.has-query .clear { display: block; }
  /* Keyboard affordance — hidden once the box is in use. */
  .search .kbd {
    position: absolute; right: 12px; pointer-events: none;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--fg-dim); border: 1px solid #262626; padding: 2px 6px;
  }
  .search.has-query .kbd, .search.focused .kbd { display: none; }

  /* Matched substring inside a card title */
  mark {
    background: rgba(192,57,43,0.28); color: inherit;
    padding: 0 1px; border-radius: 1px;
  }
  .card[data-brand="vaq-hq"] mark { background: rgba(244,99,30,0.28); }

  /* "N more matches in another brand" nudge — so a brand tab never hides
     a result without saying so. */
  .cross-hint {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 1.5px; color: var(--fg-mute);
    margin: -6px 0 18px; display: none;
  }
  .cross-hint button {
    background: transparent; border: 0; cursor: pointer; padding: 0 0 0 8px;
    font: inherit; letter-spacing: inherit; color: var(--fg);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .cross-hint button:hover { color: var(--red); }

  .wordmark {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 36px; letter-spacing: 2px;
    color: var(--fg);
  }
  .wordmark .dot { color: var(--red); }
  .wordmark .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 3px; color: var(--fg-mute); margin-left: 18px;
  }

  /* Layout */
  main { padding: 24px 64px 80px; max-width: 1400px; }

  /* Section labels */
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--fg-mute);
    margin: 40px 0 18px;
  }

  /* New-project form */
  .new-card {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 28px 32px;
    display: grid; grid-template-columns: 1fr 160px 1fr auto; gap: 16px; align-items: end;
  }
  label {
    display: block;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--fg-mute);
    margin-bottom: 8px;
  }
  input, select {
    width: 100%;
    background: #0a0a0a; color: var(--fg); border: 1px solid var(--border);
    padding: 12px 14px;
    font: 14px 'DM Sans', system-ui;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--red); }
  button {
    background: var(--red); color: #fff; border: 0;
    padding: 13px 28px; cursor: pointer;
    font: 11px 'DM Sans', system-ui; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
  }
  button:hover { background: #A83225; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Project grid */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 24px 28px;
    text-decoration: none; color: var(--fg);
    transition: background 120ms ease, border-color 120ms ease;
    display: flex; flex-direction: column; gap: 14px;
    position: relative;
  }
  .card:hover { background: var(--bg-card-h); border-color: #333; }
  .card .delete-btn {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px;
    background: transparent; color: var(--fg-dim); border: 1px solid transparent;
    padding: 0; margin: 0;
    font: 16px/1 'DM Sans', system-ui; letter-spacing: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease, background 120ms ease;
    cursor: pointer;
  }
  .card:hover .delete-btn { opacity: 1; }
  .card .delete-btn:hover {
    color: #fff; background: var(--red); border-color: var(--red);
  }
  .card .name {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 30px; letter-spacing: 1px; line-height: 1;
    text-transform: uppercase;
  }
  /* Vaq HQ cards speak Vaq: Hanken Grotesk 800, sentence case */
  .card[data-brand="vaq-hq"] .name {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    font-weight: 800; font-size: 24px; letter-spacing: -0.3px;
    line-height: 1.1; text-transform: none;
  }
  .card .format {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--fg-mute);
  }
  .card .format .badge {
    display: inline-block; padding: 4px 10px;
    background: #0a0a0a; border: 1px solid var(--border); color: var(--fg);
  }

  .empty {
    border: 1px dashed var(--border); padding: 40px 32px;
    color: var(--fg-mute); font-size: 13px; line-height: 1.7;
  }

  /* Backlog cards — slightly different from project cards so they're scannable */
  #backlog-grid .card {
    background: #0e0e0e; border-color: #232323;
  }
  #backlog-grid .card:hover { border-color: var(--red); }
  #backlog-grid .card .name { font-size: 22px; line-height: 1.15; letter-spacing: 0.5px; }
  #backlog-grid .card .meta {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--fg-mute);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  #backlog-grid .status {
    display: inline-block; padding: 3px 9px; font-size: 9.5px;
    border: 1px solid; letter-spacing: 1.6px;
  }
  #backlog-grid .status[data-s="Idea"]              { color: #d4c9b6; border-color: #3a3a3a; }
  #backlog-grid .status[data-s="In Development"]    { color: #8dc0ff; border-color: #2a4060; }
  #backlog-grid .status[data-s="Write Post"]        { color: #ffb070; border-color: #4a3220; }
  #backlog-grid .status[data-s="Write Caption"]     { color: #ffd870; border-color: #4a4020; }
  #backlog-grid .status[data-s="Ready to publish"]  { color: #6cc88e; border-color: #2a4a35; }
  #backlog-grid .tag {
    display: inline-block; padding: 3px 8px; font-size: 9.5px;
    background: #1a1a1a; color: var(--fg); border: 1px solid #2a2a2a;
  }

  /* Outbox — finished hand-made posts (reels, maps, charts) waiting to go out. */
  #outbox-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .post { background: var(--bg-card); border: 1px solid var(--border); display: flex; flex-direction: column; }
  .post.stale { border-color: #5a2a22; }
  .post .media { background: #050505; height: 380px; display: flex; align-items: center; justify-content: center; position: relative; }
  .post .media img { max-width: 100%; max-height: 100%; display: block; }
  .post .media video { height: 100%; max-width: 100%; display: block; background: #000; }
  .post .thumbs { display: flex; gap: 6px; padding: 8px 12px 0; overflow-x: auto; }
  .post .thumbs img { width: 44px; height: 55px; object-fit: cover; opacity: .5; cursor: pointer; border: 1px solid transparent; }
  .post .thumbs img.on { opacity: 1; border-color: var(--fg-mute); }
  .post .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .post .name { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; letter-spacing: .5px; line-height: 1.05; text-transform: uppercase; }
  .post[data-brand="vaq-hq"] .name { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 21px;
    letter-spacing: -0.2px; line-height: 1.15; text-transform: none; }
  .post .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--fg-mute); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .post .badge { display: inline-block; padding: 4px 9px; background: #0a0a0a; border: 1px solid var(--border); color: var(--fg); }
  .post .badge.due { color: #ffd870; border-color: #4a4020; }
  .post .badge.late { color: #ff9c8a; border-color: #5a2a22; }
  .post .badge.done { color: #6cc88e; border-color: #2a4a35; }
  .post .caption { font-size: 13px; line-height: 1.55; color: #cfc5b3; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .post .caption.open { display: block; }
  .post .caption.missing { color: #ff9c8a; cursor: default; }
  .post .notes { font-size: 12px; line-height: 1.5; color: var(--fg-mute); }
  .post .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .post .actions button { padding: 11px 12px; font-size: 10px; }
  .post .actions button[data-a="copy"] { grid-column: 1 / -1; padding: 14px; }
  .post .actions button.ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
  .post .actions button.ghost:hover { border-color: #444; background: #1a1a1a; }
  #outbox-posted summary { cursor: pointer; list-style: none; }
  #outbox-posted summary::-webkit-details-marker { display: none; }
  #outbox-posted .post { opacity: .72; }

  .err {
    background: rgba(192,57,43,0.12); border: 1px solid var(--red);
    color: #fbb; padding: 12px 16px; margin-bottom: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">KAVI<span class="dot">.</span><span class="tag">Studios</span></div>
  <nav class="brand-tabs" id="brand-tabs" aria-label="Brand">
    <button data-brand="all"    type="button"><span class="t-all">All</span></button>
    <button data-brand="itiha"  type="button"><span class="t-itiha">ITIHA<span class="dot">.</span></span></button>
    <button data-brand="vaq-hq" type="button"><span class="t-vaq">Vaq <span class="hq">HQ</span></span></button>
  </nav>
  <div class="search" id="search">
    <span class="icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14.5 14.5" stroke-linecap="round"/></svg></span>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search projects…" aria-label="Search projects" />
    <span class="kbd">/</span>
    <button class="clear" id="q-clear" type="button" title="Clear search" aria-label="Clear search">×</button>
  </div>
</header>

<main>

  <div class="section-label">New project</div>
  <div class="new-card">
    <div>
      <label for="np-name">Project name</label>
      <input id="np-name" placeholder="e.g. somnath-temple" autocomplete="off" />
    </div>
    <div>
      <label for="np-brand">Brand</label>
      <select id="np-brand">
        <option value="itiha">Itiha</option>
        <option value="vaq-hq">VAQ HQ</option>
      </select>
    </div>
    <div>
      <label for="np-format">Format</label>
      <select id="np-format">
        <option value="instagram-portrait">Instagram Carousel · Portrait · 1080×1350</option>
        <option value="instagram-tall">Instagram Carousel · Tall 3:4 · 1080×1440 (post from the app)</option>
        <option value="instagram-square">Instagram Carousel · Square · 1080×1080</option>
        <option value="instagram-reel">Instagram Reel · 1080×1920</option>
        <option value="youtube-thumbnail">YouTube Thumbnail · 1280×720</option>
        <option value="youtube-end-card">YouTube End Card · 1920×1080</option>
      </select>
    </div>
    <button id="np-create">Create &amp; open</button>
  </div>
  <div id="np-err" class="err" style="display:none; margin-top:12px"></div>

  <div id="outbox-wrap">
    <div class="section-label" style="display:flex;align-items:baseline;gap:14px">
      Ready to post
      <span id="outbox-count" style="color:#666;font-size:10px;letter-spacing:2px"></span>
    </div>
    <div id="outbox-grid" class="grid"></div>
    <details id="outbox-posted" style="display:none">
      <summary class="section-label" style="margin:28px 0 18px">Posted <span id="posted-count" style="color:#666"></span> ▾</summary>
      <div id="posted-grid" class="grid"></div>
    </details>
  </div>

  <div id="backlog-wrap" style="display:none">
    <div class="section-label" style="display:flex;align-items:baseline;gap:14px">
      Notion backlog
      <span id="backlog-count" style="color:#666;font-size:10px;letter-spacing:2px">—</span>
    </div>
    <div id="backlog-grid" class="grid"></div>
  </div>

  <div id="backlog-setup" class="empty" style="display:none">
    <b style="color:#E8DCC8">Notion backlog is not configured.</b><br>
    Add <code style="color:#E8DCC8">NOTION_TOKEN</code> and <code style="color:#E8DCC8">NOTION_DB_ID</code> to <code>.env</code> in the repo root and restart Studio. See README for the 5-min setup.
  </div>

  <div class="section-label" style="display:flex;align-items:baseline;gap:14px">
    Your projects
    <span id="project-count" style="color:#666;font-size:10px;letter-spacing:2px"></span>
  </div>
  <div id="cross-hint" class="cross-hint"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No projects yet. Use the form above to create your first one.</div>

</main>

<script>
const FORMAT_LABELS = {
  'instagram-portrait': 'IG Carousel · 4:5',
  'instagram-tall':     'IG Carousel · 3:4',
  'instagram-square':   'IG Carousel · 1:1',
  'instagram-reel':     'IG Reel · 9:16',
  'youtube-thumbnail':  'YT Thumbnail · 16:9',
  'youtube-end-card':   'YT End Card · 16:9',
};

// Keep in sync with src/brands.py (BRANDS).
const BRAND_LABELS = { 'itiha': 'ITIHA', 'vaq-hq': 'VAQ HQ' };
const BRAND_COLORS = { 'itiha': '#C0392B', 'vaq-hq': '#F4631E' };

let allProjects = [];
let brandFilter = (() => {
  try { return localStorage.getItem('kavi:brandFilter') || 'all'; } catch { return 'all'; }
})();

// Search is deliberately NOT persisted to localStorage: coming back to a
// half-empty grid because of a filter you set yesterday reads as data loss.
let searchQuery = '';

// ── Search ──────────────────────────────────────────────────────
// Tokens are AND-ed, so "somnath temple" and "temple somnath" both hit, and
// each token may match the display name, the slug, the brand or the format —
// "vaq reel" is a valid query. Slug matching is what makes a hyphenated
// paste ("somnath-temple") behave the same as typing the words.
function tokenize(q) {
  return String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
}

function projectHaystack(p) {
  const brand = p.brand || 'itiha';
  return [
    p.name || '', p.slug || '',
    brand, BRAND_LABELS[brand] || '',
    p.format || '', FORMAT_LABELS[p.format] || '',
  ].join(' ').toLowerCase();
}

function matchesProject(p, tokens) {
  if (!tokens.length) return true;
  const hay = projectHaystack(p);
  return tokens.every(t => hay.includes(t));
}

// Escape first, then wrap matches — so a project literally named "<b>" can't
// inject markup through the highlighter.
function highlight(text, tokens) {
  const safe = escapeHtml(text);
  if (!tokens.length) return safe;
  // Longest-first stops a short token from splitting a longer one mid-match.
  const pattern = tokens
    .slice().sort((a, b) => b.length - a.length)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('|');
  if (!pattern) return safe;
  return safe.replace(new RegExp(`(${pattern})`, 'gi'), '<mark>$1</mark>');
}

function setSearch(q) {
  searchQuery = q;
  const wrap = document.getElementById('search');
  wrap.classList.toggle('has-query', !!q.trim());
  renderGrid(allProjects);
  renderBacklog();
  renderOutbox();
}

// Header brand switcher: filters the grid, pre-selects the New-project brand,
// and scopes the (Itiha-only) Notion backlog.
function applyBrandTabs() {
  document.querySelectorAll('#brand-tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.brand === brandFilter);
  });
  if (brandFilter !== 'all') {
    document.getElementById('np-brand').value = brandFilter;
  }
  // The Notion backlog feeds Itiha carousels — hide it in Vaq HQ focus.
  const backlogWrap = document.getElementById('backlog-wrap');
  const backlogSetup = document.getElementById('backlog-setup');
  const hideBacklog = brandFilter === 'vaq-hq';
  if (backlogWrap && backlogWrap.dataset.configured === '1') {
    backlogWrap.style.display = hideBacklog ? 'none' : 'block';
  }
  if (backlogSetup && backlogSetup.dataset.unconfigured === '1') {
    backlogSetup.style.display = hideBacklog ? 'none' : 'block';
  }
}

document.querySelectorAll('#brand-tabs button').forEach(btn => {
  btn.onclick = () => {
    brandFilter = btn.dataset.brand;
    try { localStorage.setItem('kavi:brandFilter', brandFilter); } catch {}
    applyBrandTabs();
    renderGrid(allProjects);
    renderBacklog();
    renderOutbox();
  };
});

// ── Search wiring ───────────────────────────────────────────────
const qInput = document.getElementById('q');
const qWrap  = document.getElementById('search');

qInput.addEventListener('input', () => setSearch(qInput.value));
qInput.addEventListener('focus', () => qWrap.classList.add('focused'));
qInput.addEventListener('blur',  () => qWrap.classList.remove('focused'));

document.getElementById('q-clear').onclick = () => {
  qInput.value = '';
  setSearch('');
  qInput.focus();
};

qInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    qInput.value = '';
    setSearch('');
    qInput.blur();
  } else if (e.key === 'Enter') {
    // Enter on a narrowed list opens the top hit — the common case is
    // "type three letters, hit Enter".
    const first = document.querySelector('#grid .card');
    if (first) location.href = first.getAttribute('href');
  }
});

// "/" focuses search from anywhere, as long as you're not already typing.
document.addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  const tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;
  e.preventDefault();
  qInput.focus();
  qInput.select();
});

async function loadProjects() {
  const r = await fetch('api/projects');
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function renderGrid(projects) {
  allProjects = projects;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const counter = document.getElementById('project-count');
  const hint = document.getElementById('cross-hint');
  grid.innerHTML = '';

  const tokens = tokenize(searchQuery);
  const inBrand = brandFilter === 'all'
    ? projects
    : projects.filter(p => (p.brand || 'itiha') === brandFilter);
  const shown = inBrand.filter(p => matchesProject(p, tokens));

  counter.textContent = tokens.length
    ? `(${shown.length} of ${inBrand.length})`
    : (inBrand.length ? `(${inBrand.length})` : '');

  // A brand tab must never silently swallow a hit. If the query matches
  // projects filed under another brand, say so and offer a way through.
  const hiddenElsewhere = tokens.length && brandFilter !== 'all'
    ? projects.filter(p => (p.brand || 'itiha') !== brandFilter && matchesProject(p, tokens)).length
    : 0;
  if (hiddenElsewhere) {
    hint.innerHTML = `${hiddenElsewhere} more match${hiddenElsewhere === 1 ? '' : 'es'} outside ${escapeHtml(BRAND_LABELS[brandFilter] || brandFilter)}<button type="button" id="cross-show">Search all brands</button>`;
    hint.style.display = 'block';
    document.getElementById('cross-show').onclick = () => {
      brandFilter = 'all';
      try { localStorage.setItem('kavi:brandFilter', brandFilter); } catch {}
      applyBrandTabs();
      renderGrid(allProjects);
      renderBacklog();
      renderOutbox();
    };
  } else {
    hint.style.display = 'none';
  }

  if (!shown.length) {
    // "No matches" and "no projects yet" are different problems — the second
    // message tells you to use the create form, which is useless mid-search.
    empty.textContent = tokens.length
      ? `No projects match "${searchQuery.trim()}".`
      : 'No projects yet. Use the form above to create your first one.';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  for (const p of shown) {
    const brand = p.brand || 'itiha';
    const a = document.createElement('a');
    a.className = 'card';
    a.dataset.brand = brand;
    a.href = `d/${encodeURIComponent(p.slug)}/`;
    a.innerHTML = `
      <button class="delete-btn" title="Delete project" aria-label="Delete project">×</button>
      <div class="name">${highlight(p.name || p.slug, tokens)}</div>
      <div class="format">
        <span class="badge" style="color:${BRAND_COLORS[brand] || '#888'};border-color:#2a2a2a">${escapeHtml(BRAND_LABELS[brand] || brand)}</span>
        <span class="badge">${escapeHtml(FORMAT_LABELS[p.format] || p.format || 'unknown')}</span>
      </div>
    `;
    a.querySelector('.delete-btn').onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      deleteProject(p);
    };
    grid.appendChild(a);
  }
}

async function deleteProject(p) {
  const label = p.name || p.slug;
  if (!confirm(`Delete "${label}"?\n\nThis removes designs/${p.slug}/ from disk — content.yaml, images, and rendered PNGs. Cannot be undone.`)) return;
  try {
    const r = await fetch('api/projects/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: p.slug }),
    });
    if (!r.ok) throw new Error(await r.text());
    const projects = await loadProjects();
    renderGrid(projects);
  } catch (e) {
    alert(`delete failed: ${e.message || e}`);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('np-create').onclick = async () => {
  const btn = document.getElementById('np-create');
  const err = document.getElementById('np-err');
  err.style.display = 'none';
  const name = document.getElementById('np-name').value.trim();
  const format = document.getElementById('np-format').value;
  const brand = document.getElementById('np-brand').value;
  if (!name) { err.textContent = 'name is required'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('api/projects/new', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, format, brand }),
    });
    if (!r.ok) throw new Error(await r.text());
    const { slug } = await r.json();
    location.href = `d/${encodeURIComponent(slug)}/`;
  } catch (e) {
    err.textContent = String(e.message || e); err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create & open';
  }
};

applyBrandTabs();
loadProjects().then(renderGrid).catch(e => {
  document.getElementById('grid').innerHTML = `<div class="err">load failed: ${escapeHtml(String(e.message || e))}</div>`;
});

// ── Notion backlog ──────────────────────────────────────────────

const TYPE_LABEL = {
  'carousel':     'IG Carousel',
  'reel (insta)': 'IG Reel',
  'Photo (post)': 'IG Photo',
  'Story':        'IG Story',
};

async function loadBacklog() {
  const r = await fetch('api/notion/backlog');
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// Latest backlog payload, so search / brand changes can re-render without
// re-querying Notion (that call routinely takes 15-30s).
let backlogState = { configured: false, rows: [] };

function matchesBacklog(row, tokens) {
  if (!tokens.length) return true;
  const hay = [
    row.post || '', row.status || '', row.type || '',
    TYPE_LABEL[row.type] || '',
    (row.tags || []).join(' '), (row.topic || []).join(' '),
  ].join(' ').toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function renderBacklog(payload) {
  if (payload) backlogState = payload;
  const { configured, rows } = backlogState;
  const wrap = document.getElementById('backlog-wrap');
  const setup = document.getElementById('backlog-setup');
  const grid = document.getElementById('backlog-grid');
  const counter = document.getElementById('backlog-count');
  // Record configured state so the brand switcher can re-derive visibility.
  setup.dataset.unconfigured = configured ? '0' : '1';
  wrap.dataset.configured = configured ? '1' : '0';
  const hideBacklog = brandFilter === 'vaq-hq';
  if (!configured) {
    setup.style.display = hideBacklog ? 'none' : 'block';
    wrap.style.display = 'none';
    return;
  }
  setup.style.display = 'none';
  wrap.style.display = hideBacklog ? 'none' : 'block';

  const tokens = tokenize(searchQuery);
  const shown = rows.filter(r => matchesBacklog(r, tokens));
  counter.textContent = tokens.length
    ? `(${shown.length} of ${rows.length})`
    : `(${rows.length})`;
  grid.innerHTML = '';
  if (!rows.length) {
    grid.innerHTML = `<div class="empty">No active items. Add ideas in Notion → they'll show up here.</div>`;
    return;
  }
  if (!shown.length) {
    grid.innerHTML = `<div class="empty">No backlog items match "${escapeHtml(searchQuery.trim())}".</div>`;
    return;
  }
  for (const row of shown) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = 'javascript:void(0)';
    card.onclick = () => openFromBacklog(row);
    const status = row.status || 'Idea';
    const typeLabel = TYPE_LABEL[row.type] || row.type || 'unknown';
    const tags = (row.tags || []).slice(0, 3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    const topics = (row.topic || []).slice(0, 2).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    const dateStr = row.publish_date ? `<span>📅 ${escapeHtml(row.publish_date)}</span>` : '';
    card.innerHTML = `
      <div class="name">${highlight(row.post || 'Untitled', tokens)}</div>
      <div class="meta">
        <span class="status" data-s="${escapeHtml(status)}">${escapeHtml(status)}</span>
        <span>${escapeHtml(typeLabel)}</span>
        ${dateStr}
      </div>
      ${topics || tags ? `<div class="meta">${topics}${tags}</div>` : ''}
    `;
    grid.appendChild(card);
  }
}

async function openFromBacklog(row) {
  try {
    const r = await fetch('api/notion/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page_id: row.id }),
    });
    if (!r.ok) throw new Error(await r.text());
    const { slug } = await r.json();
    location.href = `d/${encodeURIComponent(slug)}/`;
  } catch (e) {
    alert(`open failed: ${e.message || e}`);
  }
}

loadBacklog().then(renderBacklog).catch(e => {
  console.error('backlog load failed', e);
});

// ── Outbox ──────────────────────────────────────────────────────
// Finished hand-made posts (HyperFrames reels, maps, charts): src/outbox.py
// reads <outbox>/<slug>/post.yaml + media. Brand tabs and search filter it too.

let outboxState = { root: '', posts: [] };

async function loadOutbox() {
  const r = await fetch('api/outbox');
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function matchesPost(p, tokens) {
  if (!tokens.length) return true;
  const hay = [p.title, p.slug, p.brand, BRAND_LABELS[p.brand] || '', p.kind, p.caption, p.hashtags].join(' ').toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function postCard(p, tokens) {
  const card = document.createElement('div');
  card.className = 'post' + (p.stale ? ' stale' : '');
  card.dataset.brand = p.brand;
  const src = m => `outbox/${encodeURIComponent(p.slug)}/${encodeURIComponent(m.name)}`;
  const mediaEl = m => m.video
    ? `<video src="${src(m)}#t=0.1" controls muted playsinline preload="metadata"></video>`
    : `<img src="${src(m)}" alt="">`;
  const first = p.media[0];
  let due = '';
  if (p.status === 'posted') due = `<span class="badge done">Posted ${escapeHtml(fmtDate(p.posted_at))}</span>`;
  else if (p.stale) due = `<span class="badge late">Stale since ${escapeHtml(fmtDate(p.post_by))}</span>`;
  else if (p.post_by) due = `<span class="badge due">Post by ${escapeHtml(fmtDate(p.post_by))}</span>`;
  card.innerHTML = `
    <div class="media">${first ? mediaEl(first) : '<span class="notes">no media file</span>'}</div>
    ${p.media.length > 1 ? `<div class="thumbs">${p.media.map((m, i) => m.video ? '' :
      `<img src="${src(m)}" data-i="${i}" class="${i ? '' : 'on'}" alt="">`).join('')}</div>` : ''}
    <div class="body">
      <div class="meta">
        <span class="badge" style="color:${BRAND_COLORS[p.brand] || '#888'}">${escapeHtml(BRAND_LABELS[p.brand] || p.brand)}</span>
        <span class="badge">${escapeHtml(p.kind)}${p.media.length > 1 ? ' · ' + p.media.length : ''}</span>
        ${due}
      </div>
      <div class="name">${highlight(p.title, tokens)}</div>
      ${p.error ? `<div class="caption missing">${escapeHtml(p.error)}</div>` : p.caption
        ? `<div class="caption" title="Click to expand">${escapeHtml(p.caption)}</div>`
        : `<div class="caption missing">No caption yet. Add one to post.yaml.</div>`}
      ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
      <div class="actions">
        <button type="button" data-a="copy" ${p.caption ? '' : 'disabled'}>Copy caption</button>
        <button type="button" class="ghost" data-a="reveal">Reveal files</button>
        <button type="button" class="ghost" data-a="status">${p.status === 'posted' ? 'Back to ready' : 'Mark posted'}</button>
      </div>
    </div>`;
  card.querySelectorAll('.thumbs img').forEach(t => t.onclick = () => {
    card.querySelectorAll('.thumbs img').forEach(x => x.classList.toggle('on', x === t));
    card.querySelector('.media').innerHTML = mediaEl(p.media[+t.dataset.i]);
  });
  const cap = card.querySelector('.caption:not(.missing)');
  if (cap) cap.onclick = () => cap.classList.toggle('open');
  card.querySelector('[data-a="copy"]').onclick = async (e) => {
    // Same shape as the editor's Copy caption: caption, blank line, hashtags.
    const full = [p.caption, p.hashtags].filter(Boolean).join('\n\n');
    await navigator.clipboard.writeText(full);
    e.target.textContent = 'Copied ✓';
    setTimeout(() => { e.target.textContent = 'Copy caption'; }, 1600);
  };
  card.querySelector('[data-a="reveal"]').onclick = () => outboxAction('reveal', { slug: p.slug });
  card.querySelector('[data-a="status"]').onclick = async () => {
    await outboxAction('status', { slug: p.slug, status: p.status === 'posted' ? 'ready' : 'posted' });
    renderOutbox(await loadOutbox());
  };
  return card;
}

async function outboxAction(action, body) {
  try {
    const r = await fetch(`api/outbox/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    alert(`${action} failed: ${e.message || e}`);
  }
}

function renderOutbox(payload) {
  if (payload) outboxState = payload;
  const tokens = tokenize(searchQuery);
  const inBrand = outboxState.posts.filter(p => brandFilter === 'all' || p.brand === brandFilter);
  const shown = inBrand.filter(p => matchesPost(p, tokens));
  const ready = shown.filter(p => p.status !== 'posted');
  const posted = shown.filter(p => p.status === 'posted');
  const grid = document.getElementById('outbox-grid');
  const pgrid = document.getElementById('posted-grid');
  grid.innerHTML = ''; pgrid.innerHTML = '';
  const nReady = inBrand.filter(p => p.status !== 'posted').length;
  document.getElementById('outbox-count').textContent = tokens.length ? `(${ready.length} of ${nReady})` : `(${nReady})`;
  if (!ready.length) {
    grid.innerHTML = `<div class="empty">${tokens.length ? 'Nothing ready matches this search.'
      : `Nothing waiting. Finished reels, maps and charts land in <code style="color:#E8DCC8">${escapeHtml(outboxState.root)}</code>, one folder per post with a post.yaml.`}</div>`;
  }
  ready.forEach(p => grid.appendChild(postCard(p, tokens)));
  posted.forEach(p => pgrid.appendChild(postCard(p, tokens)));
  document.getElementById('outbox-posted').style.display = posted.length ? 'block' : 'none';
  document.getElementById('posted-count').textContent = `(${posted.length})`;
}

loadOutbox().then(renderOutbox).catch(e => {
  document.getElementById('outbox-grid').innerHTML = `<div class="err">outbox load failed: ${escapeHtml(String(e.message || e))}</div>`;
});

</script>
