name: mamdani-india-day-parade
brand: vaq-hq
format: instagram-portrait
caption: |
  Forty five years, every New York mayor, one parade. Zohran Mamdani is the first to skip it.

  What happened. On Sunday 16 August, the Federation of Indian Associations held its 44th India Day Parade on Madison Avenue, the city's main India Independence Day event since Ed Koch walked the first one in 1981. Giuliani, Bloomberg, de Blasio and Adams all made a point of attending. The FIA invited Mamdani, per IANS. He did not come. He spent the day at a family day organised by public housing residents in Brooklyn. Governor Kathy Hochul was the political star on Madison Avenue.

  A week earlier, Pakistan Day. On Sunday 9 August, Mamdani spoke at the Brooklyn Pakistan Day Mela at the Allama Iqbal Community Center, a celebration of Pakistan's Independence Day. The transcript is on nyc.gov. He opened with "Salam alaikum," told the crowd it was "such a privilege to be back here with all of you," and posted afterwards that he had gathered "to commemorate Pakistan's Independence Day and honor the contributions Pakistani New Yorkers have made to our city."

  The part worth being precise about. Mamdani did attend a smaller India Independence Day parade in Floral Park, Queens, on Saturday 15 August, and posted that he was there as "the first Indian American mayor of New York City." The Pakistan event was a community mela, not the Manhattan Pakistan Day Parade. Neither changes the record: the one Indian event with a 45 year mayoral tradition is the one he missed.

  The pattern. In May he refused the Israel Day Parade on principle. On 9 August he attended the Pakistan Day celebration. On 16 August he skipped the main India Day Parade. On 26 August he said he opposes RSS chief Mohan Bhagwat's Madison Square Garden address, while conceding the city has no power to cancel it. Which invitations a mayor accepts is a choice, and this is his.

  Sources: IANS, 17 August 2026. The Statesman. nyc.gov transcript, Brooklyn Pakistan Day Mela, 9 August 2026. The Algemeiner, 12 August 2026. Scroll, Business Today, 26 August 2026. Photo: Bloomberg.

