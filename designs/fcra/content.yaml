name: how-the-us-government-runs-conversion
brand: itiha
format: instagram-portrait
caption: |
  The relationship between Christian conversion in India and American foreign policy is not incidental. It is coordinated, institutionalised, and documented in the paper trail of the US government's own agencies. This carousel is the record of how the machinery actually works — from USAID grants to the International Religious Freedom Act to the Joshua Project's intelligence-grade databases on Indian tribal populations.

  Five documented components. First, doctrine: US foreign policy views Western evangelical missions as "flag-bearers of civilisation." Second, funding: USAID routes India aid through World Vision and Catholic Relief Services rather than through the Government of India, with a revolving door of personnel between the two. Third, legislation: the International Religious Freedom Act of 1998 created the US Commission on International Religious Freedom, which threatens sanctions against any country that restricts coercive conversion. Fourth, intelligence: the Denver-based Joshua Project compiles anthropological databases of Indian communities categorised by "market penetration," and field data from evangelical NGOs has been documented flowing to the CIA. Fifth, geopolitics: converting Dalits, tribals, and South Indians decouples them from Indian civilisational identity — creating internal friction inside a rising competitor to American hegemony.

  The conversion is real. But the conversion is not the goal. The conversion is the mechanism.

  @itiha29 · itiha.info
