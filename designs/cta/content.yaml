  chapter: Chapter 04 · The Famine
  headline: |
    *Famine*
    Took The Cattle
  body: 'The [Great Madras Famine of 1876] killed the herds their whole transport depended on. New forest
    laws designed for lumber extraction by [British Corporations],  shut them out of the grazing commons
    in the same years. **Three policies, one ruined community.**  Now, They took help from [Christian
    Missionaries] to civilize the natives. '
  image: famine-bellary.jpg
  image_filter: sepia
  image_position: 50% 45%
  image_overlay: 0.7
  body_y: 31
  body_size: 45
  texture: vignette
- layout: split-story
  chapter: Chapter 05 · The Suspicion
  headline: |
    Ruined Traders
    Became *Suspects*
  body: Officials did not see people wrecked by policy. They saw wanderers outside state control , [hard
    to tax, hard to control], and their tribal customs were offensive to Victorian ideas of settled respectability.
    The same prejudice English officials held against [Romani people] was applied here. The answer was
    a law. Solution was provided by [Salvation Army]
  image: korava-fortune.jpg
  image_filter: archival
  image_position: 42% 40%
  image_zoom: 1.15
  image_overlay: 0.8
