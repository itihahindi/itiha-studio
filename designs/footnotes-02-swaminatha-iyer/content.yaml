  chapter: Chapter 01 · The Gap
  headline: |
    A Literature That
    Existed Only In
    *Copies*
  body: |
    Classical Tamil was written on [palm leaf], and palm leaf rots. Every few decades a text had to be copied out again by hand or it was lost. By the 1880s those copies sat in temple mutts and in private houses whose owners often could not read the script. The old epics and the [Sangam] anthologies were names in a scholar's memory long before they were books on a shelf.
