- layout: split-story
  eyebrow: On The Record
  headline: |
    She Dated Patriarchy
    At *Five Per Cent*
  body: |
    Steinem argued that male domination is recent, not permanent. [Patriarchy] makes only five per cent of human history, she told an Indian interviewer in 2014, and the cultures that came closest to balance were [matrilineal] ones — in India, she said, from [Kerala to the Himalayas], before colonialism arrived. The paradigm there, she added, was the circle.
  source: The Tribune, February 2014
  headline_size: 100
