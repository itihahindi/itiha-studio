  chapter: Chapter 03 · Ramnad, 1957
  headline: |
    Riots, And
    A Team That *Walked*
  body: |
    Violence tore through [Ramnad] in southern Tamil Nadu in the summer of 1957. Steinem joined a team of Gandhian workers walking village to village to counter rumour and discourage revenge. They belonged to the [Bhoodan] movement of [Vinoba Bhave], then crossing India on foot asking landlords to give their land away.
