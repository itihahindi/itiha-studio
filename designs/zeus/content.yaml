name: zeuss-law-and-atithi-devo-bhava
brand: itiha
format: instagram-portrait
caption: |
  Christopher Nolan's The Odyssey opened this week, and the concept at the centre of the film — the sacred law of hospitality between guest and host that the Greeks called xenia and Nolan calls Zeus's Law — is one Indian audiences already know by another name. Long before Homer, the Taittiriya Upanishad had declared: Atithi Devo Bhava. The guest is God. Not merely under God's protection, as the Greeks held — but literally divine. This carousel is the record of two ancient civilisations that arrived, independently, at the same conclusion about the sacred obligation to the stranger at the door.

  Zeus was the god of xenia — guest-host relations. The Odyssey states the principle plainly: "all strangers and beggars are from Zeus." To violate hospitality was to offend the king of the gods. Indra, in the Rig Veda, was the parallel sky king — thunderbolt in hand, ruler of the pantheon, associated with lightning and the storm. The two civilisations shared the archetype. They also shared the ethical instruction: care for the stranger, honour the traveller, feed the wanderer at your door. But where the Greeks framed hospitality as protection under a god's watchful eye, the Vedic tradition went further. The Taittiriya Upanishad's fivefold instruction — Matru Devo Bhava, Pitru Devo Bhava, Acharya Devo Bhava, Atithi Devo Bhava — treated mother, father, teacher, and guest as literally God. The guest was not merely under divine protection. The guest was divine.

  Nolan's Odyssey brings Zeus's Law back to the global cinematic conversation. India has been living the same principle, under a different name, for three thousand years.

