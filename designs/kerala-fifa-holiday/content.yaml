name: Kerala FIFA Holiday
brand: vaq-hq
format: instagram-portrait
caption: |
  Football owns Kerala tonight. Argentina meet Spain in the World Cup final, and the match ends in the early hours of Monday, India time.

  So the state called a holiday. Schools and colleges stay shut, professional colleges included. The Chief Minister signed off after opposition leaders demanded it. One exception: exams already on the timetable go ahead as scheduled.

