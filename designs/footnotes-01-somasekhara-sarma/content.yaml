name: Footnotes 01 — Mallampalli Somasekhara Sarma
brand: itiha
format: instagram-portrait
caption: |
  Warangal fell to Ulugh Khan in 1323, and for the next fifty years the Telugu country all but vanished from written history. Footnotes, No. 1 of 15, is about the man who put those years back: Mallampalli Somasekhara Sarma (1891–1963), the self-taught epigraphist whose A Forgotten Chapter of Andhra History (1945) reconstructed the Musunuri Nayakas from a set of copper plates.

  The only narrative accounts of the period were the Persian court chronicles of Barani and Ferishta, written from Delhi's side; the Telugu memory of the chiefs who won the country back survived in later grants and village records and was treated as legend. Near Pithapuram in East Godavari, diggers cutting earth for a brick kiln had turned up inscribed copper plates that stayed in the family of Hundi Venkata Rao for the better part of a century. Sarma and N. Venkataramanayya read them as the Vilasa grant of Prolaya Nayaka, dated 1330: a Sanskrit account of the Telugu country after the conquest, with Prolaya, ruling from Rekapalle on the Godavari, as its restorer. With the Kaluvacheru grant of 1423 the sequence came clear: Prolaya's cousin Kapaya Nayaka and seventy-five nayakas retook Warangal in 1336 and held it until Kapaya fell at Bhimavaram in 1368.

  Sarma had matriculated at Rajahmundry, could not afford college, and burned the certificate rather than take a village clerkship. He learned epigraphy copying inscriptions for Chilukuri Virabhadra Rao, worked for Desa Mata at twelve rupees a month, and published more than thirty new copper-plate and stone records across ten dynasties. Andhra University hired him in 1940 to teach epigraphy and South Indian history; History of the Reddi Kingdoms (1946) followed, built from inscriptions, literature and the village records other scholars had dismissed.

  Read him: A Forgotten Chapter of Andhra History (1945), then History of the Reddi Kingdoms (1946), both free on archive.org; in Telugu, Reddi Rajyala Charitra and Andhra Desa Charitra Sangrahamu from Emesco. Profile drawn on Jogi's article for itiha.info and the 1976 commemoration volume. Warangal Fort photograph: Wikimedia Commons, CC BY-SA 4.0.

