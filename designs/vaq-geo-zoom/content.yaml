name: vaq-geo-zoom
brand: vaq-hq
format: instagram-portrait
caption: 'Auto-fit + zoom test.'
hashtags: '#VaqHQ'
tweaks:
  vertical: briefing
  showStamp: true
  showPageNum: true
slides:
# 1 — the ask: India + Indonesia, no region set, camera fits itself
- layout: geo
  kicker_meta: Auto-fit
  headline: India *and* Indonesia
  countries:
  - name: India
  - name: Indonesia
  links:
  - from: India
    to: Indonesia
  body: No region set — the crop fitted itself to the two countries.
# 2 — same two, zoomed out to show context
- layout: geo
  kicker_meta: Zoom 0.6
  headline: Pulled *Back*
  zoom: 0.6
  countries:
  - name: India
  - name: Indonesia
  body: Same selection, zoom 0.6.
# 3 — single small country: floors must stop absurd zoom
- layout: geo
  kicker_meta: Small Country
  headline: Singapore *Alone*
  countries:
  - name: Singapore
  body: A single small country hits the minimum-span floor.
# 4 — the trap: France (Réunion/Guiana) + United States (Alaska/Hawaii)
- layout: geo
  kicker_meta: Outlier Test
  headline: France *+* United States
  countries:
  - name: France
  - name: United States
  body: Overseas territories must not blow the crop open.
