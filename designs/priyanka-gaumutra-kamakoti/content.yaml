name: priyanka-gaumutra-kamakoti
origin: watcher
brand: vaq-hq
format: instagram-portrait
caption: |
  Congress MP Priyanka Gandhi Vadra told the Lok Sabha that the government's new exam reform panel contains "one ex-IB chief, one IT company owner and one gaumutra expert." The man she was describing is Prof. V. Kamakoti, Director of IIT Madras, and a former chairman of the JEE.

  What was actually said. Speaking in the debate on the anti-paper-leak legislation on 28 July 2026, she said: "In this new committee, there is one ex-IB chief, one IT company owner and one gaumutra expert." She did not name Kamakoti. The reference was understood immediately, because he is the panel member associated with remarks about cow urine. BJP MP Anurag Thakur objected and the exchange turned into a floor clash.

  Who he is. Kamakoti joined the IIT Madras faculty in 2001 and has been its Director since January 2022. He led the development of Shakti, India's first indigenous microprocessor. He sits on the National Security Advisory Board, has chaired the government's Artificial Intelligence Task Force, and is a former JEE chairman. In January 2026 he was awarded the Padma Shri in the science and engineering category.

  The number being shared is wrong. Posts circulating today credit him personally with 417 patents. That figure is IIT Madras's patent filings for 2025, under the "A Patent a Day" initiative he launched as director. It is an institutional output, not one man's tally. His record does not need the inflation, and using the wrong number is what lets the argument be dismissed.

  The context the jibe reaches for. In January 2025 Kamakoti said cow urine had antibacterial, antifungal and anti-inflammatory properties, citing published studies. The remark drew criticism from scientists and he defended it by pointing to peer reviewed work. That statement is real. It is what the jibe was aiming at, and leaving it out would be dishonest.

  Why it still does not land. The Nilekani task force exists to fix how national exams are run. Its members include a former ISRO chairman, a former IB chief, a former education secretary, a former Bihar chief secretary, and the director of IIT Madras who has chaired the JEE. "What do they know about education" is a question with an answer.

  Sources: The Tribune, Deccan Herald, Outlook India, The News Minute and Business Today on the Lok Sabha exchange of 28 July 2026. Careers360 and ETV Bharat on the Padma Shri 2026 and the patent figure.

  Image: Priyanka Gandhi Vadra speaking in the Lok Sabha, 28 July 2026, as circulated on X.

