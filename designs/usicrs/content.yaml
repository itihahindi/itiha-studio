name: uscirf-targets-india-editorial
brand: vaq-hq
format: instagram-portrait
caption: |
  The US Commission on International Religious Freedom was created in 1998 under the International Religious Freedom Act, pushed through by a Christian-right lobbying campaign behind Republican Frank Wolf's bill and signed by Bill Clinton. Nine commissioners, appointed by both parties, advise Congress, the State Department and the White House, and their sharpest instrument is the recommendation to sanction a country named a "Country of Particular Concern."

  Critics in India read USCIRF as an arm of a global evangelical project. Its reports lean on advocacy groups like the Dalit Freedom Network and evangelist testimony, treat conversion to Christianity as liberation and India's ghar wapsi as regression, and press Washington to gut India's Freedom of Religion Acts and the Foreigners Act that curbs foreign missionaries. Violence by Christian separatist militias like the NLFT and Naga outfits, meanwhile, draws little of its attention.

  In 2026, for the seventh straight year, it urged the CPC tag and went further, demanding sanctions on the RSS and R&AW. The State Department has never acted on it, and India has rejected the report as biased and motivated. @vak_hq · vaqhq.com
