name: congress-overnight-protest
brand: vaq-hq
format: instagram-portrait
caption: |
  Congress has switched to overnight protest mode outside PM Modi's residence at 7 Lok Kalyan Marg. Rahul Gandhi, Mallikarjun Kharge and Priyanka Gandhi sat on the road with nearly 100 Congress MPs, refusing to move until the Prime Minister responds.

  The trigger: the police crackdown on students who marched to Parliament over the NEET-UG paper leak. Congress is demanding a response from PM Modi, action against Delhi Police, and Education Minister Dharmendra Pradhan's resignation.

  "Day or night, we'll stay here," the party says. Delhi has not seen a sit-in at the Prime Minister's doorstep like this in years.

  Follow @vaqhq for Indian politics, decoded live.
