  headline: |
    Alexander Slept
    With The *Iliad.*
  body: |
    The Homeric epics formed the [absolute core] of classical [education]. Their civilisational impact was so profound that [Alexander the Great] was educated on them. [Pagans] read the epics as descriptive storehouses of [wisdom] and [history] , not as [literal] commands. The [myths] were [symbolic], and [mature philosophers] reinterpreted them into deeper [systems] without ever losing their [civilisational hold].
  source: Classical historical tradition
