  headline: |
    Seven Fitted Parts.
    None *Sufficient* Alone.
  body: The [saptanga] defines the state as [seven fitted parts], the sovereign, ministers, territory,
    fortifications, treasury, army, and allies. The metaphor is a [chariot], not a monarch. Two thousand
    years before modern political science defined the state by [population], [territory], and [sovereignty],
    an Indian text had already proposed it.
