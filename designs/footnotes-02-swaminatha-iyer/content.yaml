  chapter: Chapter 08 · His Own Story
  headline: |
    He Wrote His Life
    Down *Last*
  body: |
    From January 1940 he serialised _En Sarithiram_ in the weekly [Ananda Vikatan] — his life told through the villages, mutts and households the manuscripts had taken him to. The last instalment ran in [May 1942]. He had died that April, at eighty-seven, with the account unfinished. The library built around the three thousand manuscripts he had gathered opened in Madras the following year.
