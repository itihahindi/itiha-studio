  headline: |
    Direct Action
    In *Calcutta*
  body: |
    The riots opened in [August 1946]. Bloated corpses and fly-covered dead [holy cows] lay heaped in the streets to the height of two storeys.
    The city had become a place where the dead were **stacked** rather than counted.
