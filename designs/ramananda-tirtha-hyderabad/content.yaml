name: ramananda-tirtha-hyderabad
brand: itiha
format: instagram-portrait
caption: |
  On 15 August 1947, as the rest of India raised the tricolour, the Nizam of Hyderabad refused the Union and declared his own sovereignty. That night Ramananda Tirtha arranged for the Indian flag to be hoisted at Sultan Bazar in the heart of the Nizam's capital. He was arrested at three in the morning. The Hyderabad State Congress he had built across fifteen years was already strangling the Nizam's administration from the inside.

  The regime he fought ran on a precise arithmetic. An eleven per cent minority held full administrative control over the eighty-nine per cent majority. The ruler was Mir Osman Ali Khan, the seventh Nizam, reputed the richest man alive. His enforcer on the ground was Kasim Razvi of the Ittehad-ul-Muslimeen, whose Razakar militia drilled openly and whose leader told followers to march with the Koran in one hand and the sword in the other. Ramananda Tirtha was explicit in his own writings that the fight was not against Islam or Muslims as a community. It was against the Nizam's feudal autocracy, the communal lock on power, and the Razakars.

  He led the boycott of the Ayyangar reforms. He intervened in Chanchalguda Jail when Satyagrahis' sacred threads were cut. He backed students flogged on the tiktiki for singing Vande Mataram. After the Bidar bazaar burned while the District Collector and DSP stood by, he broke the police cordon, walked the ruins, and reported to Mahatma Gandhi, who later endorsed his authorisation of village self-defence as an act of bravery. By the time of the Police Action in September 1948, 21,000 Satyagrahis filled the Nizam's prisons.

  Images: India Post 1999 stamp (GODL-India); LIFE, September 1948; Hyderabad State Congress meeting, 1940s; Wikimedia Commons contributors TheAafi, IM3847 and Adbh266 (CC BY-SA).

