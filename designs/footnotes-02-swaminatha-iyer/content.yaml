  body_size: 38
  body_y: 58
- layout: split-story
  theme: light
  chapter: Chapter 05 · The Book
  headline: |
    Printed In *1887*,
    At Thirty-Two
  body: |
    The _Cīvaka Cintāmaṇi_ came off the press in [1887]. Not a transcription — an edition: the text established by comparing the copies he had gathered, with a commentary set around it and the context of a Jain epic explained for readers who had none. It was the first of the long classical works he put into type.
  headline_size: 96
  body_size: 42
  body_y: 45
