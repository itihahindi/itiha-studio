format: instagram-portrait
caption: |
  Meghalaya has declared Monday, July 21, a holiday for every school and college
  so students can watch the FIFA World Cup 2026 final. Chief Minister Conrad K
  Sangma announced it in a video message, with fan parks set up in Shillong,
  Jowai and Tura for live screenings — celebrations FIFA President Gianni
  Infantino has already shared to a global audience.

  Source: Rediff.

