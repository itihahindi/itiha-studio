name: icc-karim-khan
brand: vaq-hq
format: instagram-portrait
caption: |
  The International Criminal Court has removed its chief prosecutor. Karim Khan was voted out by the court's member states, with 82 of 125 backing his removal at a special session in New York. It is the first time an ICC prosecutor has been ousted from office.

  The vote follows a finding of serious misconduct by the court's oversight body over his conduct with a female aide, allegations first reported nearly two years ago. Khan denies all wrongdoing and has called the case political.

  The prosecutor who sought arrest warrants for Vladimir Putin and Benjamin Netanyahu now leaves the office to his deputies, Nazhat Shameen Khan and Mame Mandiaye Niang.

