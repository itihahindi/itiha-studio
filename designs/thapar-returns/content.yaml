  chapter: Chapter 12 · Composite culture
  headline: |
    Necessity Is Not
    *Consensus*
  body: |
    Thapar isolated instances of [political expediency], such as cross-religious military appointments, tactical trade relations and localized administrative patronage, as proof of a harmonious [composite culture].
    The fallacy treated **operational necessity** as ideological consensus.
  image: man-singh.jpg
  image_position: 50% 15%
  texture: halftone
- layout: story
  headline: Exception as a rule
  body: |
    Pragmatic alliances for political survival became proof that the religious divide was a [colonial construct], while centuries of [Persian chronicles] defining the conflict as Hindu versus Muslim were ignored.
  image: _cache/7d428a73ec33c01a.jpg
  image_bw: false
  theme: dark
  texture: halftone
- layout: story
  chapter: Chapter 13 · Identity
  headline: |
    Hindu Long
    Before The *1800s*
  body: Thapar asserted that a unified Hindu identity did not exist in ancient India and was imagined
    in the [19th century]. Yet _Prithviraja Raso_, _Prithviraja Vijaya_ and _Hammira Mahakavya_, written
    [centuries earlier], explicitly recorded native leaders identifying as [Hindu] in battle against foreign
    invaders.
  image: prithviraj.jpg
  image_position: 50% 30%
  theme: dark
  texture: halftone
- layout: split-story
  theme: dark
  chapter: Chapter 14 · Civilization
  headline: |
    *Bharatavarsha*
    Before Britain
  body: |
    Thapar claimed the idea of an Indian civilization was defined by [British colonial scholarship] and appropriated by 19th-century elites.
    Ancient texts, foreign accounts and [inscriptions] recognized [Bharatavarsha] as a unified geographical and cultural entity millennia before British rule.
  texture: halftone
