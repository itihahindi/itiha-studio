name: jantar-mantar-2873
brand: vaq-hq
format: instagram-portrait
caption: |
  Delhi Police have put a number on who else was standing at Jantar Mantar. Every figure below is theirs.

  What the release says. Police say 2,873 individuals with criminal backgrounds were present during the violence at the CJP protest, identified using a face identification system run against existing databases. Of those, the release places 989 in the heinous-offences category, listing 101 with antecedents in murder, 62 in attempt to murder, 284 in dacoity and robbery, 61 in rape and six under the POCSO Act.

  What we could confirm, and what we could not. Reporting from 25 July independently records Delhi Police claiming the facial recognition system had flagged more than 2,500 people with criminal records in three days, alongside 15 FIRs over the 20 July violence and four FRS units at the entry and exit points. The granular split above, the 2,873 and the offence-wise breakdown, appears in no coverage we can find. It comes from the press release as circulated and nowhere else. Treat it as a police claim, because that is all it is so far.

  The word doing the heavy lifting. An antecedent is a prior case, an FIR, an arrest sitting in a police record. It is not a conviction. Some of those matters ended in acquittal, some never reached a courtroom at all. "101 with antecedents in murder" and "101 murderers" are not the same sentence, and only one of them is defensible.

  The machine. Four face-recognition units, wired to police databases, monitored live. Delhi Police have previously been reported to treat an 80 per cent similarity score as a positive match. At crowd scale, a threshold like that produces both catches and false positives, and neither the catches nor the errors are public.

  The timing. The release followed a CJP press conference alleging that volunteers were being picked up. Two claims inside one news cycle, each answering the other. Worth noting on both counts.

  Both ledgers. Delhi Police put their own injured at 118. Hospital sources counted around 60 protesters hurt, and the CJP claims closer to 150 were hospitalised. An Additional DCP was removed from the Jantar Mantar detail after a widely shared video. Police say a notice circulated in the CJP's name to stoke surveillance panic was forged. The CJP, for its part, says it is compiling its own list of police personnel through public input rather than facial recognition, and plans to publish it. Neither side of this is spotless and both are now building lists.

  And here is the part that changes what the list means. The protest was called off on 25 July after Dharmendra Pradhan's resignation. In the settlement that followed talks with JP Nadda and Jitendra Singh, the Centre agreed to compensate the families of NEET aspirants who died by suicide and to withdraw the FIRs lodged against protesters anywhere in India. Delhi Police say they will act once formal orders arrive. So the 15 FIRs that would have established who actually did what are being dropped as part of a political deal.

  Which leaves this. Presence in a crowd is not a charge and a record is not a verdict, but with the cases going away, nothing on either side gets tested by anyone. A police list of alleged antecedents and a protest movement's list of alleged assaults, both permanent allegations, neither one ever weighed in a courtroom. That is the actual outcome here, and it suits everybody except the people who wanted to know what happened on 20 July.

  Sources: Delhi Police press release as circulated, 27 July 2026; The Statesman, News9, Republic, Aaj Tak and India.com on the FRS claims of 25 July; The Tribune and The Quint on the FIR withdrawal and the settlement terms; The Week on the FIRs and video analysis; ThePrint on the Additional DCP's removal; Organiser on the forged notice; Outlook on the CJP's own list; earlier reporting on Delhi Police's 80 per cent FRS match threshold.

  Images: photographs of the Jantar Mantar protest of 20 July 2026 by Sumita Roy Dutta (CC BY-SA 4.0); Delhi Police bus by juggadery (CC BY-SA 2.0). All via Wikimedia Commons. No photograph here identifies anyone named in the police release, and none is placed to suggest otherwise.

  @vaq_hq · vaqhq.com
