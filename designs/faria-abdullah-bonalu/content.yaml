caption: |
  Telugu actress Faria Abdullah carried a Bonam at the Sri Simhavahini Mahankali Temple in Hyderabad's Old City on 9 August, walking with the Bonalu procession alongside Pothuraju performers. The trolling that followed called her a kafir for taking part.

  On 15 August she answered in a video posted to Instagram, breaking down as she spoke. Her father, Sanjay Abdullah, was born Hindu and converted to Islam. "He got converted to Islam because he liked the religion," she said. "I've always seen the good about Islam. I really wish good things for you bro, actually." Her mother, Kausar Sultana, was born Muslim and later took to Hindu spirituality and meditation.

  Vishwa Hindu Raksha Parishad national mahila president Yamuna Pathak called the trolling "vicious" and told ANI: "Bharat is governed by the Constitution, not by religious policy. Every citizen enjoys equality, dignity and freedom of conscience under Articles 14, 19, 21 and 25." VHP's Vinod Bansal also condemned the trolls, saying they "will not be able to function for long with radical mindset."

  Clip via @RShivshankar. Reporting: ANI, WION.

