name: the-redraw
brand: vaq-hq
format: instagram-portrait
caption: |
  For fifty years the size of the Lok Sabha has been frozen. That freeze ends after 2026, and what replaces it could reshape Indian politics for a generation.

  The math is simple and uncomfortable. Seats have been fixed to the 1971 census since the 1970s, held in place so that states which slowed their population growth would not be punished for it. Since then the northern states have grown far faster than the southern ones. Redraw the map by pure headcount and the north gains seats while the south loses relative weight, even as its economy carries a large share of the country.

  Nothing has been decided. No new map exists, a fresh census has to come first, and Parliament still has to vote. What we are laying out here is the stakes, not the outcome. But the new Lok Sabha chamber was built to seat far more than 543, and that number was not chosen by accident.

  Sources: PRS India, Census of India, Lok Sabha Secretariat.

