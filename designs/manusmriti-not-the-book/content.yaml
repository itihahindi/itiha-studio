name: Manusmriti is a Hindu text, not the book of Hinduism
brand: itiha
format: instagram-portrait
caption: |
  Manusmriti is a Hindu text. It is not "the Hindu book." From Abhishek Iyengar's essay for Stories by Itiha: the decades-old habit of treating one Smriti as the constitution of Hinduism, and why the premise fails at the first step.

  Hinduism did not begin with a book. No single founder, no founding date, no one revelation. Sanatana Dharma grew as a civilisation of practices and libraries: Vedas and Upanishads, the Ramayana, the Mahabharata and the Gita, Puranas, Agamas and Tantras, and a whole Dharmashastra tradition in which Manu's treatise is one voice among many, contested by rival Smritis, overridden by regional custom, and outranked in living practice by Bhakti devotion. No church ever existed to bind every Hindu to a single rulebook. The question "what is the Hindu Bible?" is not hard to answer. It is malformed.

  The essay's sharper point is about convenience: equate Manusmriti with Hinduism and any verse becomes "eternal Hindu commandment," while a thousand years of argument, schools and reform vanish into one quotable page. As Iyengar writes, Sanatana Dharma does not need to become somebody else's version of religion to be understood. It needs to be understood on its own terms.

  Written by Abhishek Iyengar, edited by Pranav MD. Read the full essay at itiha.info, Stories by Itiha. Cover manuscript: Naradasmriti palm-leaf, 1407 CE (Wikimedia Commons, CC BY-SA 4.0).

