caption: |
  Phase one of assembly polls in Pakistan occupied Kashmir descended into chaos. A PPP worker was shot dead during polling in Kotli, a ballot box was seized and destroyed in Bhimber, and rival parties traded rigging allegations across the Mirpur division.

  The Joint Awami Action Committee had called the vote a sham and asked residents to stay home. Booths across PoK ran near empty as 13 constituencies voted under heavy security.

  Watch the ground footage. This is what election day looks like in occupied Kashmir.

