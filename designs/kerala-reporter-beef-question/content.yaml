caption: |
  Malvika Sharma, the Maharashtra-born actress of Red, Nela Ticket and Bhimaa, was in Kerala for her first press interaction for the Malayalam film Khalifa. Asked which Kerala food she liked, she said she had not had time to try much. The follow-up: "Did you like beef?"

  Her answer: "I am vegetarian so I haven't tried beef."

  The clip has drawn heavy criticism online, with users asking why a beef question belonged in a film promotion at all, and whether the same reporter would ask a Muslim guest about pork. Others read it as a clumsy local-food question. Either way, it is the only part of the interaction anyone is talking about.

  Clip: Neelakkuyil Entertainments, via @theskindoctor13.

