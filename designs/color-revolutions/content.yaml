- layout: quote
  chapter: THE REFRAME
  headline: |
    NOT SOFT POWER.
    *WAR.*
  quote: Instead of tanks, bombers and cannons, it solves everything through an uprising.
  attribution: Matija Šerić, Eurasia Review, 2024
  body: 'The thesis refuses [Joseph Nye]''s label of _soft power_. This, it holds, is [hard power], admittedly
    softer than war, but war nonetheless: a modern aggression that [international law] does not yet recognise.'
  image: _cache/08b539fe1cf34ecb.jpg
  image_overlay: 0.6
  texture: halftone
- layout: split-story
  chapter: THE ARCHITECT
  headline: |
    THE THEORIST OF
    THE *UNARMED*
    COUP
  body: The essay names [Gene Sharp] the _father_ of the colour revolutions. His book _From Dictatorship
    to Democracy_ catalogued [198 methods] of non-violent action. In Serbia, the youth group [Otpor] turned
    that manual into the fall of Milošević in 2000, the template later exported, nation to nation.
  image: https://m.media-amazon.com/images/I/81Li5jNBO4L._AC_UF1000,1000_QL80_.jpg
