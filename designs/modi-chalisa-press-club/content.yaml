caption: |
  A "Bhagwaan Shri Narendra Modi Chalisa" was unveiled and recited at the Press Club of India in Delhi on Thursday, 20 August. The clip shows a cutout of the Prime Minister dressed as Lord Ram, crown and bow included, with an aarti performed before it and chants of "Har Har Modi, Jai Jai Modi."

  Who held it. Members of the transgender community, including Dr Rajan Singh and Mahamandaleshwar Vaibhavi Maharaj, per Siasat's report. The recital is modelled on the Hanuman Chalisa.

  What the Press Club says. It did not organise the event. In its clarification on X, the club said the hall was hired by an organisation for a press conference, the terms of the booking were violated, and its authorities "immediately intervened" and stopped the event.

  The reaction has not split on party lines. Much of the sharpest criticism is from Hindu users asking why a sitting politician is being turned into a deity. One widely shared line: "My religion is not a joke."

  Footage via @ShyamMeeraSingh. Reporting: Free Press Journal, Siasat, News18, 20 August 2026.

