caption: |
  Eight years ago today, Atal Bihari Vajpayee passed away. Poet, parliamentarian, three time Prime Minister, Bharat Ratna. The man who took India nuclear at Pokhran, built the Golden Quadrilateral, reached for peace with the Lahore bus and answered Kargil in the same year.

  The Ministry of Information and Broadcasting released this tribute on his death anniversary. His words, in his own voice, still carry.

  Follow @vak_hq for political history, decoded.
