name: born-criminal-the-yerukulas-and-the-cta
brand: itiha
format: instagram-portrait
caption: |
  In 1913 the Yerukulas and Koravas of the Madras Presidency were officially notified as criminal tribes. Every man, woman and child in those communities had to register with the police, submit to fingerprinting, report at night and again at dawn, and get a permit to walk to the next village. A child born into them was a criminal at birth. The revised Criminal Tribes Act of 1911 covered around 1,400,000 people by official figures.

  They had not been criminals. They had been traders. Before the railways, the Yerukulas carried grain and salt between the coast and the interior, handling retail distribution where the Banjaras handled wholesale, and reaching villages nobody else could reach. Three blows destroyed that trade. In 1805 the East India Company made salt a government monopoly and banned private manufacture, forcing traders to buy at up to forty times production cost. From 1856 the railways made mobile intermediaries obsolete. Then the Great Madras Famine of 1876 killed the cattle herds their transport depended on, while new forest laws closed the grazing commons. Ruined traders became, in official eyes, wandering suspects — hard to tax, hard to police, and therefore in need of reform.

  That reform was handed largely to the Salvation Army, in India since 1882 and self-consciously modelled on empire: generals, officers, articles of war, a newspaper called The War Cry, and territory to be occupied. Its settlements at Sitanagaram and Stuartpuram, in Guntur district on the Andhra coast, confined whole families, took attendance up to five times a day, and issued barren land in place of the promised pattas. When agriculture failed, Section 11 was used to send settlers into private factories such as the ILTD Company, where women walked seven miles each way for shifts of twelve to sixteen hours with no labour rights, because they were not legally workers but offenders under reform. Booth Tucker put the advantage plainly: free labour was unreliable, but settlers could not abscond, because absconding was an offence.

  Images, all public domain via Wikimedia Commons unless noted: Yerukala settlement and Korava woman telling fortunes from Edgar Thurston, Castes and Tribes of Southern India, vol. 3 (1909); Deccan bullock carts by William Johnson, c. 1855–62; Igatpuri station, early 1870s; "The Last of the Herd," Bellary district, The Graphic, 6 October 1877; Salvation Army officers in India, 1880s; Commander F. Booth-Tucker, Library of Congress; Political Divisions of the Indian Empire, Imperial Gazetteer of India, 1909, J. G. Bartholomew. Salt pans at Marakkanam by Dey.sandip, CC BY-SA 4.0.

