name: who-won-the-week
brand: vaq-hq
format: instagram-portrait
caption: |
  On paper, this was the government's worst week: a cabinet minister forced out by a student movement. Look again, and it may be the week it played best.

  Read the board. The Education Minister the government let go, Dharmendra Pradhan, was already a spent card, blamed for exam failure after exam failure, wanted gone even by voices on the Right for months. Giving him up cost little and bought a lot: it took the oxygen out of the Jantar Mantar protests overnight, handed the students a "win" that ends the sit-in, and let the Prime Minister post two direct-to-camera videos promising action, arriving as the sympathetic figure rather than the target.

  Meanwhile the machine kept moving. On 24 July the Cabinet cleared a draft Bill to toughen the anti-paper-leak law, answering the students' issue on the government's own terms. And the far larger prize, delimitation, the redraw that could expand the Lok Sabha to 850 seats and tilt the map north, kept advancing through Parliament while the country's attention was fixed on one protest site.

  We are not claiming the government engineered any of this. There is no evidence for that, and we are not asserting it. What we are saying is narrower and defensible: given the hand it was dealt, the government played it well. It cut a loss, defused a crisis, moved its own bills, and came out looking responsive. That is not a masterplan. It is good politics.

  Sources: The Week, Akashvani, PRS India, ANI, PTI (23 to 25 July 2026).

  @vaqhq · vaqhq.com
