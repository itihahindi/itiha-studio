name: how-christianity-digested-the-greek-epics
brand: itiha
format: instagram-portrait
caption: |2


  Before the digestion, the Greek and Roman epics were what the Ramayana and Mahabharata are to India: the sacred cultural stories that unified a civilisation, the core of classical education, the reason Alexander the Great reportedly slept with the Iliad under his pillow. Three methods were then used to break their hold. First, prophetic reinterpretation — taking pagan verses out of context to claim they foretold Christ, as Christians did with Virgil's Eclogue 4. Second, allegorisation — Ovid's Metamorphoses, exiled by Augustus for its sensual content, was rewritten as a Christian moral parable and became a core medieval textbook. Third, the "Egyptian gold" doctrine formalised by St. Augustine: take the useful moral gold from the pagan epics, leave behind the theology, the same way the Israelites took gold from Egypt and left the idols.

  The playbook was ancient. The names of its architects are in the record. Only the target keeps changing.

