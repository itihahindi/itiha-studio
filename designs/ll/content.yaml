name: indian-money-ivy-league-letterhead
brand: vaq-hq
format: instagram-portrait
caption: |
  Over fifteen years, Indian corporate wealth has become a structural funder of South Asia studies in the West. Tata Trusts gave Harvard Business School $50 million in 2010. Lakshmi Mittal gave $25 million in 2017 and the university's South Asia Institute was renamed after him. Anand Mahindra endowed a humanities centre. Rohan Murty put $5.2 million behind a hundred-year translation series at Harvard University Press.

  The same decade saw the money come home. Ashoka University opened in Sonipat in 2014, Krea took its first students in 2019, both built by Indian founders on an American liberal arts template.

  What the gifts mean is where agreement ends. A section of Indian commentary argues this hands foreign scholars the framing of India's past and present. Donors and universities describe it as scholarship, translation and global reach. The 2016 petition against Sheldon Pollock, and Rohan Murty's refusal to act on it, is the sharpest public test of that disagreement so far. The gifts are documented. The reading of them is not.

