name: student-suicide-no-framework
brand: vaq-hq
format: instagram-portrait
caption: |
  If you or someone you know needs support, Tele-MANAS is a free national helpline on 14416, available in multiple languages, 24 hours a day.

  A 20-year-old second-year student at IIT Bombay died on 29 July. Mumbai Police have registered an accidental death report at Powai police station under Section 194 of the Bharatiya Nagarik Suraksha Sanhita and an investigation is under way. We are not publishing the student's name, the hostel, or how they died. Those details serve nobody, and reporting guidelines exist because publishing method and location measurably raises the risk to others reading.

  What is missing, on the Supreme Court's own finding. In March 2025 the Court set up a National Task Force on student mental health in higher educational institutions, headed by former Supreme Court judge Justice S. Ravindra Bhat, with ten members including psychiatrists, academics and senior counsel. It visited institutions across ten states, among them IIT Delhi, AIIMS Delhi, JNU and Jamia Millia Islamia.

  Its interim report, submitted in November 2025, found two things worth holding together. Student suicides are driven by academic, social, economic and institutional pressures, not by mental health alone. And India has no specific statutory, regulatory or institutional framework for preventing them in higher education. Not a weak framework. None.

  Why that is the story. Every one of these deaths is followed by the same sequence: an accidental death report, an internal committee, a statement about counselling services. What does not follow is any binding obligation on an institution, because none exists to enforce. The Task Force has been given until October 2026 to file its final report.

  The context this channel has been covering. The same month, the Centre agreed to compensate families of NEET aspirants who died by suicide, and set up a task force on exam reform. The pressure being examined at the entrance-exam end does not stop once a student is admitted.

  Sources: India TV and Careers360 on the 29 July death and the police report. Deccan Herald, LiveLaw and Tribune India on the Supreme Court's National Task Force of 24 March 2025, its composition, field visits and interim findings.

  Image: main gate, IIT Bombay, Powai.

