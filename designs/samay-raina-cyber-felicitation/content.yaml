caption: |
  Eighteen months ago, Maharashtra Cyber summoned Samay Raina over India's Got Latent. This week, at Maharashtra Cyber's own event, CM Devendra Fadnavis felicitated him.

  The occasion. The launch of "Digital Arrest," Maharashtra Cyber's awareness short film, and the 1930 Maharashtra Cyber Anthem, in Mumbai. Raina contributed to both. Also on stage: Pankaj Tripathi, Ashish Vidyarthi, Sharad Kelkar, Sonali Bendre, Javed Jaffrey and Sunidhi Chauhan.

  What he said, mic in hand. "My association with Maha Cyber has been going on for a very long time. 1930 is really a great number. I have actually saved it because I often get calls from there." And the line that got the room: today was the first time a Cyber Cell officer went to a comedian's house in the morning and picked him up, "aur is baar felicitation hua hai."

  The background. In February 2025, Maharashtra Cyber acted against Raina over allegations of obscene content on India's Got Latent after the Ranveer Allahbadia remark row. Every episode came off YouTube. From that, to a bouquet from the Chief Minister at the cyber cell's own launch.

  Clip via @choga_don. Reporting: India TV, The Tribune, NewsX, 27 August 2026.

