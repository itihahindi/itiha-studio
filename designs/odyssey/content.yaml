  chapter: Method 01 · Prophetic Reinterpretation
  headline: |
    Virgil Became A
    Christian *Prophet.*
  body: 'The Roman poet [Virgil] wrote [Eclogue 4] in [40 BCE] — a poem predicting the birth of a Roman
    boy under [Emperor Augustus]. Four centuries later, Christians reinterpreted it as a [prophecy of
    Jesus]. [Virgil]  was declared a [pre-Christian prophet]. The technique: take a [pagan text], strip
    its [original meaning], and claim it foretold [Christ].'
  theme: light
  image: _cache/cfb53ed7be6d9892.jpg
  body_offset_y: 140
