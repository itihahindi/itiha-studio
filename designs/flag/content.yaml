    In Her Own
    *Words.*
  quote: |
    This flag is of Indian independence.
    Behold, it is born.
    It is already sanctified
    by the blood of martyred Indian youth.
  attribution: Madame Bhikaji Cama, unfurling the flag at Stuttgart, 18 August 1907
