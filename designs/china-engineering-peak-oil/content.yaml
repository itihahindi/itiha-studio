name: china-engineering-peak-oil
brand: vaq-hq
format: instagram-portrait
caption: |
  Peak oil was supposed to arrive when the world ran out, or when growth stopped. China is trying to schedule it.

  The vulnerability. China imports more than 11 million barrels of crude a day and spends roughly 300 billion dollars a year doing it. More than 70% of its oil and over 40% of its gas is imported, and nearly 80% of those energy imports pass through the Strait of Malacca, a channel it does not control. In 2024 its crude imports fell for the first time in two decades outside COVID, to about 11.04 million barrels a day from a 2023 peak of 11.28 million. The IEA expects Chinese oil demand to peak by 2030.

  Pillar one, renewables as industrial policy. In 2025 China added 315 GW of solar and 119 GW of wind, both annual records, on top of 277 GW and 80 GW the year before. Non-fossil sources crossed 60.4% of total installed capacity against 39.6% for thermal, the first time the balance has tipped. It spent close to a trillion dollars on energy in 2025, about half of all global spending, and Chinese firms now file roughly 75% of the world's clean-energy patents, against 5% in 2000.

  Pillar two, nuclear at speed. Sixty reactors are operating. Thirty-six more are under construction, which is more than 49% of everything being built anywhere on earth. Thirty-seven were completed between 2015 and 2024 at an average of 6.3 years each, against a global average of 9.4. Sixteen more are approved, and the pipeline points at about 125 GW.

  Pillar three, the uncomfortable one. In 2024 China converted 276 million tonnes of coal into chemicals, synthetic oil and synthetic gas. Coal-to-liquids output runs past 12 million tonnes a year, coal-to-gas expansions point at 19.5 billion cubic metres, and planned capacity could double within five years. This is worse on carbon than the crude it replaces. It is being built anyway, because the objective is sovereignty rather than emissions.

  Pillar four, electrification. China sold about 13.2 million electric vehicles in 2025, roughly 53% of new car sales. Around one car in ten on its roads is now electric, Chinese manufacturers build more than 70% of the world's EVs, over 90% of the world's electric buses run there, and Shenzhen fully electrified its bus fleet back in 2017. The IEA reckons EVs cut global oil demand by more than 1.3 million barrels a day in 2024, about half of that in China, and puts the 2030 figure past 5 million.

  What it means for India. India imports 88.5% of the crude it burns, a higher dependence than China's. India's answer so far is a fifth of a litre: E20 ethanol blending, hit five years early, real but small. China's answer is to move the demand off oil altogether, onto electrons it generates and coal it digs itself. Both are energy-security strategies. They are not the same size.

  The thesis worth arguing with. Peak oil demand need not wait for economic saturation. It can be engineered, if a state is willing to spend for a decade in one direction. Whether India can or should attempt the same thing at the same scale is the question this raises, and it is not a question about climate.

  Sources: Nisha Holla, "Engineering Peak Oil", ORF Expert Speak, 31 July 2026. China's National Energy Administration on the 2025 solar and wind additions and the non-fossil crossover. China customs via Reuters on the 2024 import decline. World Nuclear Association on reactors operating and under construction. IEA on peak demand and EV oil displacement. PIB factsheet, 5 July 2026, for India's 88.5% import dependence.

  @vaqhq · vaqhq.com
