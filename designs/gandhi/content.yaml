format: instagram-portrait
caption: |
  When Gandhi saw Netaji's victory as his own loss. On 29 January 1939 the Congress delegates re-elected Subhas Chandra Bose president by 1,580 votes to 1,377. Two days later Gandhi issued a statement claiming the defeat as his own.

  As Bose's first term neared its end in late 1938, Gandhi and the Congress Old Guard moved against a second, holding him not at all dependable; Gandhi wrote privately to Rabindranath Tagore, who backed Bose, that Bose needed to be free of presidential work if he was to rid Bengal of corruption. Maulana Abul Kalam Azad was the high command's informal choice but withdrew, and at Gandhi's personal inducement Dr Pattabhi Sitaramayya stood in his place. Seven members of the Working Committee, Vallabhbhai Patel and Rajendra Prasad among them, publicly asked Bose to stand down, calling the presidency an ornamental post like a constitutional monarch. Bose refused, argued the office was closer to a prime minister who nominates his own cabinet, demanded a vote on definite problems and programmes, and charged that the Old Guard wanted a rightist president because it was preparing to compromise with the British over the Federal scheme.

  Gandhi's reply was personal and sarcastic. Because he had induced Sitaramayya not to withdraw, the defeat was more his than his candidate's; the delegates no longer approved the principles and policy for which he stood; Bose was now free to choose a homogeneous cabinet and enforce his programme without let or hindrance. He alleged bogus voters besides. The Bengali monthly Masik Basumati asked why a man who was not even a four-anna member of the Congress should be so perturbed. The public, others observed, had never been told that a ballot against Sitaramayya would be counted as a ballot against Gandhi.

