- layout: story
  chapter: Chapter 08 · Patronage
  headline: |
    The Masterworks
    Of *Vijayanagara*
  body: |
    Thapar credited medieval Islamic rulers for the flourishing of Hindu literature and philosophy. The scholars she cited, [Sayanacharya] and [Madhava], produced their masterworks under the Hindu [Vijayanagara Empire].
    Their patrons were the kings [Bukka I] and [Harihara II], completely independent of Islamic courts.
  image: hampi-virupaksha.jpg
  theme: dark
  texture: halftone
- layout: story
  chapter: Chapter 09 · The Sufi rule
  headline: |
    The Myth Of
    Peaceful *Conversion*
  body: |
    Thapar asserted that the bulk of medieval conversions to Islam occurred peacefully, under the spiritual influence of [Sufi saints] rather than [military force] or state power.
    Sufism was presented as an exclusively peaceful, [syncretic] movement, and peaceful conversion as the norm.
  image: jahangir-sufi.jpg
  image_position: 50% 30%
  theme: dark
  texture: halftone
- layout: story
  chapter: Chapter 10 · The Tazkiras
  headline: |
    Saints Who Rode
    With *Armies*
  body: Thapar ignored the primary Sufi hagiographical accounts, the _Tazkiras_. These explicitly documented
    many Sufis acting as [ghazis], holy warriors, alongside [invading armies].
  image: mahmud-gharchistan.jpg
  theme: dark
  texture: halftone
- layout: comparison
