name: e20-ethanol-question
brand: vaq-hq
format: instagram-portrait
caption: |
  A fifth of every litre you buy is now alcohol. Here is the ledger, both sides of it, built as charts you can check.

  What E20 actually is. Not five litres of petrol with one of ethanol tipped in. One litre, a fifth of it ethanol by volume. Ethanol carries about two thirds of petrol's energy, so a fifth of the litre is neither a fifth off your mileage nor a fifth off the oil bill.

  Why India blends at all. India imports 88.5% of the crude it consumes. That single figure, from the PIB factsheet of 5 July 2026, is the whole case. Petrol is priced by a world market in dollars. Ethanol is fixed in rupees by the Cabinet once a year, which makes it the only component of the litre India actually controls.

  What ethanol costs. For Ethanol Supply Year 2025-26 the ex-mill prices run from ₹57.97 a litre for C-heavy molasses to ₹71.86 for maize, with FCI rice at ₹60.32, B-heavy molasses at ₹60.73, damaged foodgrains at ₹64 and cane juice or syrup at ₹65.61. Including 5% GST and transport, the oil marketing companies' procurement cost is ₹71.18 for IOCL, ₹71.10 for HPCL and ₹71.21 for BPCL. Delhi's pump has been frozen at ₹102.12 since 25 May 2026.

  The shield, priced. At today's $103 a barrel, E0 and E20 land within a rupee of each other, so blending is not a discount. Push crude to $160 and they separate: pure petrol would run about ₹143 a litre at the Delhi pump, E20 about ₹134. The blended litre takes only 80% of the shock, because a fifth of it does not track a barrel at all.

  The mileage fight, honestly. Minister of State for Petroleum Suresh Gopi told the Rajya Sabha on 21 July that any reduction in older E10-designed vehicles is "generally marginal (around 3-5%)". Nitin Gadkari told the same House on 29 July that concerns over engine damage or reduced efficiency "have not been substantiated by any scientific study", while noting that some rubber components and gaskets in BS-III vehicles may need replacing at routine servicing. Maruti Suzuki says that across 2.84 crore vehicles it serviced in FY 2025-26, more than 1.5 crore of them over three years old and not E20-certified, it found no E20-related damage, and puts the effect at roughly 0.6 km on a car doing 20 km a litre. Drivers disagree. A LocalCircles survey has pre-2023 petrol vehicle owners reporting a drop of over 10% rising from 45% in May 2026 to 66% in June. Independent road tests land between 8% and 12%, against ARAI's 1-6%.

  India is not alone. Brazil mandates E27 and is moving to about 35%, with over 80% of new cars sold there flex fuel. The United States runs E10 as its national standard with E15 expanding. Japan has phased in E10. Canada, Thailand and several European countries blend too.

  The catch, in the government's own words. The PIB factsheet states that "ethanol procurement costs have since risen above refined petrol costs, yet the mandate continues because of the energy security, environmental and farm income gains it delivers." Because ethanol holds about two thirds of petrol's energy, a litre at ₹71 costs roughly 40% more per unit of energy than the petrol it displaces. E20 is a premium India has chosen to pay. It is not a discount scheme and the government does not claim it is.

  What it bought. Blending rose from under 1.5% in 2013-14 to 20% in 2025-26, five years ahead of schedule. Ethanol supply went from about 38 crore litres in ESY 2013-14 to over 1,200 crore litres projected for 2025-26, and distillation capacity from 421 crore litres in 2014 to about 2,000 crore litres in 2026. The government puts the return since ESY 2014-15 at over ₹1.90 lakh crore in foreign exchange saved, over ₹1.60 lakh crore in additional farmer earnings, 310 lakh MT of crude substituted and about 930 lakh MT of CO2 cut. Those are cumulative figures over eleven years and they are the government's own claims, not independent audit.

  Sources: PIB factsheet "Ethanol Blending in India", 5 July 2026. Rajya Sabha written replies of 21 and 29 July 2026. Cabinet ethanol pricing for ESY 2025-26. LocalCircles survey, June 2026. Deccan Herald on ARAI and independent road tests. Pump price via Goodreturns and Upstox. The pump decomposition and the crude scenarios are modelled by Polity Policy in "The Ethanol Question" by Tushar Gupta, whose workings we reproduced independently before printing.

  Images: Ganesh Dhamodkar (CC BY-SA 4.0) and Timothy A. Gonsalves (CC BY-SA 4.0), via Wikimedia Commons. Map: Natural Earth, rendered in-house.

