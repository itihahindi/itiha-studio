name: bidadi-ai-city
brand: vaq-hq
format: instagram-portrait
caption: |
  Karnataka is calling it India's first AI City. The land, the villages and the promise are the same ones a Karnataka government cleared in 2006 and never built.

  What is being built. The Greater Bengaluru Integrated Township, GBIT, is a ₹18,133 crore project spanning about 9,600 acres across nine revenue villages and sixteen non-revenue villages at Bidadi, roughly 40 km by road from Bengaluru. It is being run by the Greater Bengaluru Development Authority, created in November 2024, and is marketed as an AI-powered work-live-play township and a second central business district.

  Why the site is familiar. In November 2006 the H.D. Kumaraswamy government cleared five townships, with Bidadi as the flagship. DLF won the mandate and walked away after the 2008 financial crisis. The land then sat under a red-zone notification for close to twenty years. The only thing actually built on it was the KIADB industrial estate, which did draw Toyota, Bosch, Britannia and Coca-Cola.

  Who it affects. The preliminary notification covers about 10,450 landowners, roughly 53,000 people counting families. The first phase is 518.45 acres across three villages, Kempayyanapalya at 384.22 acres, Mandalahalli at 71.13 and Vaderahalli at 63.10, affecting around 754 farmers. Compensation on offer is ₹2.07 to ₹2.14 crore an acre plus a 9,583 square foot developed plot for every acre taken. Farmers at Byramangala have been protesting for more than 400 days and want ₹5 to ₹6 crore an acre. Farmer organisations say the GBDA did not obtain the 80% landowner consent the process requires, and plan to litigate.

  The money. HUDCO has offered a credit line of ₹21,000 crore, more than the entire project cost, with ₹10,000 crore of it earmarked for acquisition alone. About ₹1,109 crore is tied up for the first phase. A ₹26 crore tender went out in June 2026 for a consultant to draw the master plan over twelve months, which means compensation began moving before anyone had drawn the plan.

  The infrastructure that is not there yet. Bidadi sits about 30 km from Vidhana Soudha in a straight line, and about 17 km beyond Challaghatta, where the Purple Line currently ends. The proposed Metro extension to Bidadi is still a feasibility study inside the Comprehensive Mobility Plan 2031. Cauvery Stage 6 was cleared by cabinet in February 2026 at ₹6,939 crore for an extra 500 MLD, but Stage 5 took ten years to commission and still has distribution gaps. The western expressway, finished in 2023, runs past Bidadi towards Mysuru rather than serving it.

  The comparison that matters. Bengaluru's successful expansions put the jobs and the trunk infrastructure in first and let the distance stop mattering. Jayanagar in 1948, Whitefield, Devanahalli after the airport opened in 2008. In 2025 Whitefield, 17 km out with Metro and tech parks, saw values rise 23%. Bidadi fell 15%.

  The precedent nobody should ignore. On the Bangalore-Mysore Infrastructure Corridor, awarded to Nandi Infrastructure Corridor Enterprises in 1997, farmers were paid cash in 2004 and at Thirumalapura and other villages the developed plots they were promised have still not been allotted, twenty-two years on. In 2016 a parliamentary committee recommended returning 1,160 acres.

  This is not an argument against building. It is an argument about sequence. Fund and start the Cauvery main, take the Metro extension to DPR and sanction, settle honestly and quickly with ten thousand families, and an ordinary township at Bidadi would earn a grander name on its own.

  Sources: Adithi Gurkar in Swarajya, 30 July 2026. The News Minute on the project, the phase-one break-up and the consent question. Deccan Herald on the HUDCO offer and the GBDA's expanded jurisdiction. Distances computed straight-line from Vidhana Soudha. Price movement figures as reported by Swarajya.

