  chapter: Chapter 04 · The Early Fathers
  headline: |
    Origen. Eusebius.
    All Said *Parthia.*
  body: The earliest and most reliable Christian historians, [Origen] (ca. 185–254), [Clement of Alexandria]
    (ca. 150–235), and [Eusebius] (ca. 260–339), all explicitly recorded that Saint Thomas's allotted
    region of evangelical work was [Parthia] (the Iranian world). [Not] the [Indian subcontinent]. Later
    historians like [Rufinus of Aquileia] and [Socrates of Constantinople] agreed.
  image: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEX_7PSxkcTlD8WgHorMkZKeY3PsFdEhFNt6Jx4kKEE1J-QbFeWq6hxrP6&s=10
