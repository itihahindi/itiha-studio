  headline: |
    She Hyped Him Before
    He Even *Arrived.*
  body: |
    When Odysseus reached the island of the [Phaeacians], he needed their [king] to send him home. [Athena] disguised herself as a [town herald], [spread rumours] about a [godlike stranger], and by the time Odysseus arrived, the entire [court] was already [primed to be obsessed] with him.
