    His Skeleton Is In
    *Italy.*
  body: |
    Since [1258 CE], the complete [skull] and verified [skeletal remains] of Saint Thomas have been preserved and documented in the [Basilica of Saint Thomas] in [Ortona], [Italy]. This undermines the [Portuguese claim] of [discovering] his skeleton in a seashore tomb in [Mylapore] in [1523]. The Jesuit historian [Father Henry Heras] dismissed the Portuguese [Mylapore relics] as a [barefaced imposture] and a [forgery].
  source: Historical records of the Basilica of Ortona
