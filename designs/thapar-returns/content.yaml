name: romila-thapar-haldighati-flights-of-imagination
brand: itiha
format: instagram-portrait
caption: |
  On 25 October 2026, delivering the Second Sitaram Yechury Memorial Lecture in New Delhi, Romila Thapar again cited the Battle of Haldighati of 1576 as a struggle over territory, not religion. Rana Pratap's army, she noted, included Afghan soldiers under Hakim Khan Suri, while the Mughal army was commanded by the Rajput Raja Man Singh. Author Anurag Sharma traces such arguments to a unilinear Marxist framework that treats history as a political tool.

  The pattern rests on a double standard: hyper-scepticism toward native texts, recorded traumas and traditional continuities, dismissed as fantasies, Brahmanical fabrications or class interests, and zero scepticism toward obscure or heterodox references. On Somanatha, Thapar attributed Mahmud of Ghazni's attack to greed for gold, though Ibnu'l-Athir recorded that Mahmud resolved to smash the idol because Hindus believed it invincible. Over 50,000 Hindus died at the temple gate, and the contemporary Jain text of Dhanapala recorded the destruction. Her portrait of peaceful Sufi conversion ignores the Tazkiras, which record Sufis such as Shaikh Sufi Sarmast and Pir Ma'bari Khandayat fighting as ghazis. Sayanacharya and Madhava wrote under the Vijayanagara kings Bukka I and Harihara II, and Prithviraja Raso, Prithviraja Vijaya and Hammira Mahakavya recorded Hindu identity centuries before the 19th century.

  Political expediency across religious lines was operational necessity, not ideological consensus. Reclaiming a fact-based history requires seeing through these rhetorical distortions.

  Images: Romila Thapar by Mukul Dube (CC BY-SA 4.0); Virupaksha Temple by Ingo Mehling (CC BY-SA 4.0); paintings and archive photos public domain or CC0, via Wikimedia Commons.

