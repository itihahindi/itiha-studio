caption: |
  Parliament's Monsoon Session opens with two fights running in parallel.

  OUTSIDE: the Cockroach Janta Party — the satirical youth movement founded in
  May after CJI Surya Kant called some activists "cockroaches" and "parasites of
  society" — is demanding Education Minister Dharmendra Pradhan resign over the
  NEET 2026 paper leak and CBSE on-screen marking irregularities. Sonam
  Wangchuk, who called himself an "honorary cockroach", was moved to Safdarjung
  Hospital on July 18 on day 21 of an indefinite hunger strike. The hospital says
  he is severely dehydrated and refusing fluids and treatment; supporters say he
  was removed from Jantar Mantar against his wishes. CJP founder Abhijeet Dipke
  has begun a solidarity fast.

  INSIDE: the government is re-introducing the Foreign Contribution (Regulation)
  Amendment Bill, 2026. It creates a Designated Authority that can take over an
  NGO's foreign contributions and assets once its FCRA registration is cancelled,
  surrendered or left unrenewed, and bars foreign funds from being used for
  religious conversion. Congress MP K.C. Venugopal called the move "downright
  undemocratic"; the Kerala Assembly has demanded the Bill's full withdrawal.
  Supporters argue it guards against foreign influence over Indian civil society.

  Sources: Al Jazeera · CNN · PRS India · ANI · India TV.

