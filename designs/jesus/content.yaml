  chapter: Chapter 03 · The Wrong Country
  headline: |
    Desert. Zoroastrians.
    *Persian Names.*
  body: The [Acts of Thomas] never mentions or describes the [Indian subcontinent]. It depicts the apostle
    travelling to a [desert country] where people speak an [Iranian language], practice [Zoroastrianism],
    and bear [Persian names]. This is [Parthia], [Afghanistan], or [Baluchistan], not [tropical South
    India]. In antiquity, [India] was a vague term for [anywhere east] of the Roman frontier.
