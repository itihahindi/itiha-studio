name: drdo-swarm-drones
brand: vaq-hq
format: instagram-portrait
caption: |
  DRDO has put out a tender for a fifty-drone swarm that flies half a metre apart, and it will only take bids from Indian small firms.

  The programme. It is called Development of Close Formation Flying of Multiple Drones, run under DRDO's Technology Development Fund. The Organiser reported the call on 3 August 2026.

  What the machine has to do. Fifty drones in one formation, separated by no more than fifty centimetres. Each one holds its position to within five centimetres across all three axes. It has to do that in winds of twenty metres a second, at altitudes up to five thousand metres, and correct any positional error within five hundred milliseconds. The system is specified as jam-proof, with real-time communication between the drones.

  Who is allowed to build it. Indian MSMEs and startups only. Defence public sector undertakings and other PSUs are excluded from bidding. DRDO funds ninety per cent of the project cost.

  The part that matters most. Over seventy per cent indigenous content is mandatory, and commercial off-the-shelf components from adversary countries are barred outright. The winning firm has to hand over fifty drones, batteries with a hundred per cent spares, the communication and control subsystems, and all algorithms, applications and source code.

  The clock. Prototype and functional testing inside twelve months. Qualification, trials, transfer of technology and project closure inside twenty-four.

  Why this is different from the usual. Most defence indigenisation announcements end at assembly, where the hard parts are still imported and the software belongs to somebody else. This one specifies the source code as a deliverable, bars adversary-country parts, and hands the work to small private firms rather than the PSUs that normally absorb it. If it lands, India owns the stack rather than renting it.

  Sources: Organiser, 3 August 2026. DRDO Technology Development Fund tender documents as reported by Indian Defence Research Wing and Indian Defence News.

  @vak_hq · vaqhq.com
