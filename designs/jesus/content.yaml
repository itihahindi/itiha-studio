  eyebrow: ' The Namboodiri Problem'
  headline: |2+

  body: |
    The South Indian tradition claims that [Saint Thomas] arrived in [Kerala] in [52 CE] and immediately converted [high-caste Namboodiri Brahmins]. Historical and sociological analyses show that [Namboodiri Brahmins] did not migrate to or settle in Kerala until at least the [4th century CE], with some estimates placing their arrival [even later]. The [1st-century conversion] claim is a [chronological impossibility].
  source: Ishwar Sharan’s The Myth of Saint Thomas and the Mylapore Shiva Temple
  body_offset_y: 10
  align_x: center
  texture: grain
