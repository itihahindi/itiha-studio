name: colour-revolutions-warfare-without-armies
brand: itiha
format: instagram-portrait
caption: |
  In January 2024 the analyst Matija Šerić called the colour revolutions "the most sophisticated means of warfare" — regime change disguised as a spontaneous, youthful uprising, and, he argues, impossible without foreign sponsors.

  We lay his thesis over the documented record as a lens, not a verdict: Gene Sharp and his 198 catalogued methods, the three phases from network to overthrow, the reported five billion behind one revolution, and the roll call from Manila 1986 to Kyiv 2014. The events and dates are firm history; the interpretation is his, and we attribute it as such.

  His final counsel is aimed at the crowd itself — that the giveaway is the choreography, the same script across nations with nothing else in common, and that the next one will not announce what it is. Read the shape, not the colour.

  @itiha29 · itiha.info
