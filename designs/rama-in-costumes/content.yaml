    The Blouse Is A
    *British* Invention.
  body: |
    The modern fitted [blouse] , with sleeves, structured necklines, and darts , was popularised in the [19th century] under [British] social influence. Reformers adapted [European] and [Parsi] styles so that Indian women could appear in [Decent clothes] in colonial company. What many call [traditional] today is, in part, a [colonial-era] innovation.
  source: Textile history of the Indian saree
