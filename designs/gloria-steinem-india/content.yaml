- layout: quote
  chapter: Chapter 04 · The Circle
  headline: |
    What She Saw
    After *Dark*
  quote: |
    It was the first time I witnessed the ancient and modern magic of groups in which anyone may speak in turn, everyone must listen, and consensus is more important than time.
  attribution: Gloria Steinem · My Life on the Road, 2015
  body: |
    The meetings ran at night, in village after village. Anyone could speak; nobody presided; the group stayed until it agreed. She would spend the rest of her life reproducing that room.
  quote_size: 40
  body_size: 40
  headline_offset_y: -40
