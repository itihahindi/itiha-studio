  body: |
    When Odysseus finally reached [Ithaca], [Athena] appeared disguised as a young [shepherd]. Instead of revealing his identity, Odysseus spun an elaborate lie about being a [fugitive from Crete]. Rather than punishing him, Athena revealed her [true form] and praised him, saying she admired him because he was a [masterful, unapologetic liar], just like her.
