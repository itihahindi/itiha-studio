name: the-man-who-invented-indian-backwardness
brand: itiha
format: instagram-portrait
caption: |
  In the 1700s, British generals in India knelt before Hindu goddesses. They bathed in the Ganges. They studied Sanskrit and declared it finer than Latin or Greek. Within one generation, all of that vanished. Indians were "savages." Their gods were "monsters." Their civilisation was "stagnant" and required a "civilising mission." India had not changed. One book had.

  That book was _History of British India_, published in 1817 by the British utilitarian James Mill. Mill never visited India. He did not read a single Indian language. He never met a Sanskrit pandit. He wrote his six-volume history from a London reading room and became overnight the leading British authority on a civilisation he had never encountered. The book became the mandatory manual for every East India Company officer trained after 1818. It carved India's past into three artificial periods — Hindu, Muslim, British — the divisions the modern school syllabus still uses. It invented the framework of Indian backwardness that colonial policy then required to justify conquest by force. And its verdict — of stagnation, sterility, and uniform oppression — was inherited by the Encyclopaedia Britannica within a decade and by generations of academic historians in the two centuries that followed.

  Decolonising begins with knowing the architects. James Mill was the first.

