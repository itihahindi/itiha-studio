name: kargil-vijay-diwas
brand: vaq-hq
format: instagram-portrait
caption: |
  Twenty-seven years ago today, Operation Vijay was declared complete. This is what it cost.

  What happened. Through the winter gap of 1998-99, Pakistani troops and irregulars crossed the Line of Control and occupied ridges above Kargil, Drass, Batalik, Mushkoh and Kaksar. India detected them in early May 1999. The intruders were already on the high ground.

  Why those ridges. They looked down on NH1A, the Srinagar to Leh highway. Cut that road and Ladakh is isolated and its garrisons go unsupplied. Every position had to be climbed and taken back, mostly at night, mostly uphill, in places above 16,000 feet.

  The turning points. Tololing was recaptured on 13 June 1999. Tiger Hill on 4 July. Captain Vikram Batra was killed on 7 July on Point 4875, the peak now called Batra Top. On 26 July, Operation Vijay was declared successful.

  The cost. 527 Indian personnel killed. More than 1,363 wounded. Four Param Vir Chakras, two of them posthumous, and eleven Maha Vir Chakras.

  The record. Pakistan spent the war calling the intruders mujahideen and disowning its own soldiers, several of whose bodies it initially refused to accept. Those men were regulars of the Northern Light Infantry, later acknowledged and honoured at home. India put 527 names on a wall at Drass.

  It also remains the only conventional war fought between two nuclear-armed states. That is the part worth remembering after the wreaths are cleared.

  Sources: PM Narendra Modi's statement on X, 26 July 2026 (via IANS, PGurus); Ministry of Defence and PIB figures on Operation Vijay casualties and gallantry awards.

  Images: Kargil War Memorial, Kargil by Shyam.akirala (CC BY-SA 4.0); Drass and Tololing Range by Narender9 (CC BY-SA 3.0); Batalik, a border village, by Baltidiaries (CC BY-SA 4.0), a present-day photograph of the Batalik sector; Kargil War Memorial sculpture at Drass by PhotoholicAbhishek (CC BY-SA 4.0); Kargil Vijay Diwas programme, New Delhi, 27 July 2019, PMO India (GODL-India). All via Wikimedia Commons.

