name: pakistan-us-backstop
brand: vaq-hq
format: instagram-portrait
caption: |
  Pakistan has asked the United States for a $10 billion Exchange Stabilisation Facility, a rare US Treasury backstop for its falling reserves and a sliding rupee. The request went to US Treasury Secretary Scott Bessent and seeks a maturity of up to five years.

  These facilities are almost never granted. Argentina in 2025 was the first new one since Uruguay in 2002, and Mexico's long-standing swap line dates back to the 1940s.

  Pakistan narrowly avoided default in 2023 and its reserves sit near $22 billion. A dollar backstop from Washington would ease the pressure and cut its dependence on IMF tranches. It would also mark a new phase in US Pakistan ties after the Iran war diplomacy.

