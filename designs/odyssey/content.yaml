  headline: "ROME'S LAST \n*PAGAN EMPEROR*\n"
  body: |
    [Julian the Apostate], Rome
    last [pagan emperor] attempted to stop the appropriation of [Pagan] knowledge by issuing a decree that forbade [Christian] educators from teaching classical pagan literature, arguing that they should not profit from texts whose gods they inherently abused & disrespected. He died within [2 years in the Battlefield].
  theme: light
