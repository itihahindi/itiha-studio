name: the-british-invented-the-prostitute-caste
brand: itiha
format: instagram-portrait
caption: |
  In 1868, the British colonial state passed the Contagious Diseases Act in India — a law designed to justify the mass sexual enslavement of Indian women in state-run military brothels called Chaklas. To legitimise the operation, colonial officials fabricated a fiction: they declared that the women trafficked into the Chaklas belonged to a "prostitute caste" — that this was their traditional social role, and the state was merely regulating it. The claim was a lie. Indian society had no such caste. This carousel is the record of what the British actually did — and the myth they invented to hide it.

  The reality on the ground: police walked into villages and took the daughters of poor families "from fourteen years and upwards." In some cases, the mere act of a woman speaking to a man was used as grounds to denounce her as a prostitute and traffic her into a Chakla. Caste, poverty, and chastity were all weaponised as pretexts. Once inside, twelve to fifteen women were forced to serve a cantonment of one thousand soldiers each, at a fixed price of four annas per visit. They were beaten, cut on the arms and breasts, refused payment, and in documented cases set on fire. The colonial state then reclassified them as members of a hereditary "prostitute caste" — a category that did not exist in Indian tradition. When two British women investigators exposed the racket in a letter to higher authorities, the officials denounced the investigators and repeated the caste fiction as justification. In truth, prostitutes in pre-colonial India held recognised social positions that had no equivalent to the outcast status of prostitutes in Victorian Britain. The "prostitute caste" was not a discovered category. It was a manufactured one.

  This carousel is the short-form record. The full story — the Chakla system, the lock hospitals, the escape penalties, the Anglo-Indian orphan pipeline, the surgical rape justified as "medical examination" — is in the full video linked in bio.

