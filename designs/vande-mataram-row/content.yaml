caption: |
  For the first time, the full Vande Mataram was sung at the Congress headquarters on Independence Day, and it still ended in a row. A clip from Indira Bhawan shows Sonia Gandhi gesturing during the rendition. The BJP's Amit Malviya says she was demanding the song be stopped. Congress says she was asking for a chair for 83 year old Mallikarjun Kharge.

  Jairam Ramesh insists the full version was sung with no attempt to interrupt it, and the party has called the allegation baseless. The BJP is running with the clip anyway, in Vande Mataram's 150th anniversary year, with the song's long history between the two parties doing the heavy lifting.

  Watch the clip. Judge the gesture for yourself.

