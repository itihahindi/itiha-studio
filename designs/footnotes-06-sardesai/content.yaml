name: Footnotes 06 · G. S. Sardesai
brand: itiha
format: instagram-portrait
caption: |
  G. S. Sardesai opened the Peshwa archives. Footnotes, No. 6 of 15, is about Govind Sakharam Sardesai (1865–1959), known across Maharashtra as Riyasatkar.

  The records of the Peshwas sat in the Alienation Office at Poona. By Sardesai's own count they held over 27,000 bundles in Marathi, written in the Modi script, and about 8,000 files in English. Old Modi was hard even for trained readers. He wrote that a paper of that age had to be read more than a dozen times, and sometimes shown to other people to see whether they could make out a difficult word.

  He joined the Baroda state service in 1889 and became secretary to Maharaja Sayajirao Gaekwad III, then tutor to the princes. With the royal library open to him he wrote his Riyasats in Marathi: eight volumes on the Marathas, three on the Muslim period and two on the British. In 1904 a letter reached him at Baroda from Jadunath Sarkar, last week's historian, who wanted Maratha papers for his work on Aurangzeb and offered Persian ones in return. Sardesai did not know Persian. They exchanged sources for more than fifty years.

  He retired to Kamshet, near Pune, in 1925. On Sarkar's suggestion the Bombay government asked him to edit the Peshwa Daftar. He examined almost 35,000 documents, 27,332 of them in Modi, and published 45 volumes of selections holding 8,650 of them. At eighty he wrote the three-volume New History of the Marathas in English.

  Read him: New History of the Marathas (3 vols), The Main Currents of Maratha History (Patna lectures of 1926) and Selections from the Peshwa Daftar (45 vols). His own words here are from the 1949 third edition of Main Currents, free on archive.org. Portraits and Modi documents: Wikimedia Commons.

  @itiha29 · itiha.info
