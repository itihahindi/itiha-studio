  image: sardesai-1938.jpg
  image_filter: duotone
  image_position: 50% 12%
  name: 'G. S.

    Sardesai'
  dates: 17 May 1865 – 29 Nov 1959
  role: Schooled in Ratnagiri, with college in Pune and Bombay. Joined the Baroda state service in [1889].
  theme: light
- layout: cover
  headline: |
    The *Nizam*
    who weighed
    his jewels
  image: nizam-osman-ali-1926.jpg
  image_filter: halftone
  image_position: 50% 20%
