name: bjp-social-media-mhaskey
brand: vaq-hq
format: instagram-portrait
caption: |
  After 11 years, the BJP has a new social media head. Deepak Mhaskey replaces Amit Malviya.

  What the party announced. On Monday, 17 August, the BJP named Deepak Mhaskey its Social Media Convenor, with Priti Gandhi, Shivanand Dwivedi, Alok Bhatt and Arun Yadav as Co-Convenors. The list came alongside BJP president Nitin Nabin's new national team.

  Who Mhaskey is. Born 1968. A former chemistry professor in Chhattisgarh, chairman of the Chhattisgarh Medical Services Corporation with minister of state rank, a permanent invitee to the state BJP unit, and a former independent director on the board of Engineers India Limited. In his words, "a huge responsibility" and an honour that "a party worker has been entrusted with it."

  Who Malviya was. He surfaced in 2009 through the Friends of BJP forum and took charge of the party's IT department in 2015. He congratulated his successor and the co-convenors on X, saying he had worked closely with each of them over the last decade, and thanked the BJP's online support base for having "played a decisive role in reshaping India's public discourse."

  Sources: PTI via Rediff and Business Standard, Business Today, 17 August 2026. Photo of Amit Malviya: Naveen Sharma / ANI.

