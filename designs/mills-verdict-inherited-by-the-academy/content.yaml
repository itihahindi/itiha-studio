name: mills-verdict-inherited-by-the-academy
brand: itiha
format: instagram-portrait
caption: |
  James Mill, the British utilitarian who never once visited India, wrote a six-volume History of British India in 1817 arguing that Indian civilisation was stagnant, sterile, and uniformly oppressed. He had no Sanskrit, no Persian, no direct observation, only a European reading room and a conclusion he had reached before he began. His verdict became the foundation on which the East India Company trained its administrators for the next half-century. Within a decade, the Encyclopaedia Britannica had rewritten its India article to match his scathing narrative. Two hundred years later, the framework has not died. It has been inherited by the academy.

  This carousel identifies the pattern documented across a specific school of Indian historiography: the recasting of Indian civilisation as historically stagnant, its invasions as accidental unifications, and its own priesthood as the true villains of its story. Irfan Habib is described as arguing that India was not even "a country" until foreign empires unified it, echoing Mill's original scepticism about Indian civilisational unity. Audrey Truschke plays down the Gupta "Golden Age" and, when confronted with temples destroyed by medieval invaders, attempts to justify the destruction by blaming it on "deviant" Hindu priests. Romila Thapar is characterised as romanticising the medieval Islamic period while presenting ancient India strictly through the lens of caste warfare. The move in each case is Mill's move, translated into modern academic vocabulary: erase the achievement, romanticise the invader, blame the Hindu.

  Mill's verdict was written from a London reading room. Its inheritors write from tenured chairs. The framework is the same. The subject that must not be permitted to defend itself is also the same.

  Images via Wikimedia Commons: James Mill portrait, Mill's "History of British India" (1817) title page, and Rennell's 1782 map of Hindoostan (public domain); Shah Jahan in durbar, c.1650 (British Library, CC0); Martand Sun Temple ruins by Goutam1962 (CC BY-SA 4.0); Maughan Library Round Reading Room by The wub (CC BY-SA 4.0); Bibliothèque Sainte-Geneviève by Marie-Lan Nguyen (CC BY 2.0).

