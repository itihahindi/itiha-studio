    to  rescue
  align_y: top
  body: 'The settlements were operated like [jails, with rigorous discipline and surveillance]. Settlers
    were subjected to hard labor, often under exploitative conditions. . [The Salvation Army,] wielded
    extensive control, including the ability to impose fines, restrict movements, and enforce additional
    labor. '
