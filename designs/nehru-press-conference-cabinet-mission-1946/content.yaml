format: instagram-portrait
caption: |
  In June 1946 Muhammad Ali Jinnah accepted a united India. Six weeks later a press conference in Bombay undid it, and Maulana Azad spent the rest of his life calling his own part in it the greatest blunder of his political career.

  The Cabinet Mission Plan of May 1946 was built to avoid Partition: a weak central Union holding only defence, foreign affairs and communications, with the provinces sorted into three sections, B and C carrying Muslim majorities and free to draft their own constitutions. On 6 June the Muslim League formally accepted it — Jinnah saw lacunas, but also provincial autonomy and the outline of a future Pakistan in the grouping of the six Muslim-majority provinces. On 25 June the Congress Working Committee agreed to contest the Constituent Assembly elections. Then, on 6 July, Nehru took charge as Congress President, and on 10 July he told a press conference in Bombay that the Congress entered the Constituent Assembly unfettered by agreements, bound only to participate — and that the big probability was that there would be no grouping, since the North-West Frontier Province and Assam would object to Sections B and C.

  Jinnah read it as notice that a Hindu-majority Congress would use its numbers to scrap grouping and build a centralised state the moment the British left. On 29–30 July the League withdrew its acceptance and called for Direct Action from 16 August 1946, which opened with the Great Calcutta Killings. Azad, who had stood aside for Nehru over Patel, wrote that Patel would never have committed the mistake that gave Jinnah his opening.

