  chapter: Fact 03 · The Wand
  headline: |
    She Was His Tactical
    *Disguise Artist.*
  body: |
    [Athena] didn't just advise Odysseus, she [altered his appearance] for tactical advantage. To help him infiltrate his palace, she [tapped him with her wand] and disguised him as a [wrinkled, bald, filthy beggar]. Later, to reunite with [Penelope], she made him [taller], more [muscular], with hair flowing [like hyacinth petals].
