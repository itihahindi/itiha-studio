  chapter: Chapter 02 · The Monopoly
  headline: |
    The *Company* Took
    The Salt In 1805
  body: The East India Company seized salt production outright and banned Indians from making it. Traders
    now had to buy from the government at up to [forty times the cost of production]. A working family
    could spend [a month's income] on a year's salt. The trade that defined the [Yerukulas was choked
    off by British policy], Salt became a luxury for common man.
  image: salt-pans.jpg
  image_filter: duotone-ink
  image_position: 50% 60%
  image_overlay: 0.72
  body_y: 37
  body_size: 45
- layout: split-story
  chapter: Chapter 03 · The Railway
  headline: |2
     *Railways*
    Made Them Obsolete
  body: From [1856] the Madras Railway pushed track into the interior and distribution centralised on
    the station yard. Grain that had moved on the backs of cattle now arrived by [rail], in bulk, at a
    fixed point. The mobile trader who reached the villages no road served was made [unnecessary].
  image: railway-plate.jpg
  image_filter: archival
  image_position: 50% 50%
  image_overlay: 0.42
  body_size: 45
  body_y: 60
