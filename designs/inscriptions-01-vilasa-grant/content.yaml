name: History from Inscriptions 01 · The Vilasa grant
brand: itiha
format: instagram-tall
caption: |
  History from Inscriptions, No. 1: the Vilasa grant of Prolaya Nayaka.

  In 1323 the armies of the Delhi Sultanate took Warangal. The Kakatiya king Prataparudra was captured and died on the way to Delhi, and the Telugu country was laid waste. In the Godavari delta, Prolaya Nayaka of the Musunuri family, a minor chieftain, gathered the local Telugu lords into a coalition and rose against the Sultanate.

  Around 1330 he issued a copper-plate grant gifting the village of Vilasa, on the Godavari, to a Brahmin. Its verses also describe what the land had lived through: the rich tortured for money, temples destroyed and idols broken, the agraharas of the learned taken away, cultivators robbed of their harvest. The land of Tilinga, it says, "was in flames like a forest surrounded by wild fire."

  The seven plates were found by brick-kiln diggers at Kandarada, near Pithapuram in East Godavari, and are now in the Government Museum, Madras. The translation quoted here is from M. Somasekhara Sarma, A Forgotten Chapter of Andhra History (Andhra University, 1945). The full text was edited by N. Venkataramanayya and M. Somasekhara Sarma in Epigraphia Indica, Vol. 32.

  Images: Warangal ruins, 1875 photograph, public domain; Warangal Fort by Kavali Chandrakanth (CC BY-SA 4.0); Puvvada plates of Prolaya Vema, public domain, via Wikimedia Commons.

