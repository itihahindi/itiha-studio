caption: |
  Today, 24 July, PM Narendra Modi posted a second video to his @narendramodi Instagram, a follow-up to the one he shared on 23 July about the NEET-UG paper leak. His English caption, verbatim: "Thanks to the youngsters who watched my video yesterday and sent insightful suggestions."

  Hours after that first video, the Union Cabinet met and approved a draft Bill to toughen India's 2024 anti-paper-leak law, the Public Examinations (Prevention of Unfair Means) Act. This is a Cabinet decision, not a new law. The Bill still has to be passed by Parliament, reported for the Monsoon Session around 27 July.

  The penalties being reported, up to 10 years in jail, fines up to 10 crore rupees, a raised minimum term and fast-track courts, come from ministers and news wires, not a confirmed official release. Treat the numbers as reported, not settled.

  None of this meets the students' core demand: the resignation of Education Minister Dharmendra Pradhan, who has not stepped down. The Cockroach Janta Party sit-in at Jantar Mantar continues after weeks of protest and the violence of 20 July. Opposition leaders have called the videos a distraction from accountability.

  Two notes. The Cabinet decision is carried by agency wires (ANI, PTI) and mainstream outlets; we could not open the government's own PIB release to confirm the exact provisions. And the video is in Hindi. We have not translated it and quote only his English caption.

  Sources: ANI, PTI, Business Standard, Outlook, 24 July 2026. Video via @narendramodi.

