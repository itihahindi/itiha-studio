  body: |
    Emperor [Krishnadevaraya] of [Vijayanagara] clashed with Sultan [Ismail Adil Shah] of [Bijapur] over the fertile [Raichur Doab], the land between the [Krishna] and [Tungabhadra] rivers. Bijapur had [superior firepower] and [early artillery]. It changed nothing. Adil Shah broke into [chaotic retreat] and lost the prized [Raichur fort].

    Then his [envoy] arrived. The messenger called the raid [unjust] and demanded the fort back, with the [artillery], [horses] and [elephants] taken in the battle.
