  chapter: Method 03 · The Egyptian Gold
  headline: |
    Augustine Made It
    *Doctrine.*
  quote: |
    Take the gold of pagan literature —
    its useful knowledge and moral precepts —
    and leave behind the superstitious fancies
    and worship of demons.
  attribution: St. Augustine, De Doctrina Christiana — the founding doctrine of Christian appropriation
  body: 'Essence of [St. Augustine] Doctrine that paved way for appropriation '
