  chapter: Chapter 01 · The Gap
  headline: |
    Delhi Wrote
    The Only *Account*
  body: |
    Ulugh Khan took [Warangal] in 1323 and renamed it Sultanpur. What happened next in the Telugu country survived only in the Persian chronicles of Barani and Ferishta: a distant rebellion, then silence until [Vijayanagara]. The Telugu memory of the chiefs who won the land back was filed under [legend/folklore]
