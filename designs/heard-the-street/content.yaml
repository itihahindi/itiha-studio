name: heard-the-street
brand: vaq-hq
format: instagram-portrait
caption: |
  Dharmendra Pradhan is gone. The students at Jantar Mantar got their central demand. But a section of the government's own base is not celebrating, and its complaint is worth stating plainly.

  Their charge is one of sequence. Voices on the Right had wanted the Education Minister to go over the UGC and NEET exam failures for months. Anand Ranganathan put it on the record: "I and many others on the Right had been demanding this for six months." The government did not move then.

  It moved now, after the Cockroach Janta Party's weeks-long sit-in, the march to Parliament, the violence of 20 July, and ten days of national attention. On 25 July, Pradhan resigned.

  So the question from inside the tent is this: why did it take the street, and not its own supporters, to force the change? A government that resisted the demand when it came from its base conceded once the pressure came from outside it.

  A note on language. The graphic that prompted this called the protesters "leftist jihadis." We do not use that framing. No evidence has been produced that the CJP is anything other than what it says it is, a student agitation over a paper leak, and the argument about the government's sequence stands without the slur.

  @vaqhq · vaqhq.com
