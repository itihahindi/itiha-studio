  headline: |
    A History Written
    Without *Seeing* India.
  body: |
    [James Mill] wrote his [History of British India] in [1817]. He had never [visited] India. He had no [Sanskrit]. He had no [Persian]. His conclusion, that Indian civilisation was [stagnant], [sterile], and [uniformly oppressed], became the [foundation] on which the [East India Company] trained its administrators. Within a decade, the [Encyclopaedia Britannica] had rewritten its India article to match.
  image: book.jpg
  image_position: 35% 0%
  image_overlay: 1
  body_size: 42
  body_y: 21
- layout: split-story
  headline: |
    India Was Never
    A *Country.*
  body: |
    The Marxist historian [Irfan Habib] is described as arguing that India was [not even a country] until [foreign empires] unified it. The claim echoes Mill's original scepticism about Indian [civilisational unity]: that the subcontinent was a mere [geographical expression] awaiting an [outside] hand to give it [coherence]. The [Bharat] the [Ramayana], [Mahabharata], and [Puranas] describe across the same landmass, [millennia] earlier, is not [addressed].
  image: _cache/062105572530a723.jpg
  image_position: 62% 42%
  image_bw: true
  image_overlay: 1
  body_size: 41
  align_x: left
  body_y: 23
  align_y: top
- layout: split-story
  headline: |
    Blame The Priests.
    Not The *Invader.*
  body: |
    [Audrey Truschke] plays down the [Gupta Golden Age]. When confronted with [temples destroyed] by [medieval invaders], she attempts to [justify] the destruction by [blaming it on Hindu priests], the so-called [deviants] whose [depraved knowledge] supposedly [invited] the iconoclasm. The move erases the [invader's] agency and puts the responsibility on the [victim].
  image: _cache/3ddfba1f42684354.jpg
  image_position: 68% 55%
  image_overlay: 1
  body_size: 42
  body_y: 24
- layout: split-story
  headline: |
    Romanticise The Invader.
    Reduce The *Past.*
  body: |
    [Romila Thapar] is characterised as romanticising the [medieval Islamic period] while presenting [ancient India] strictly through the lens of [caste warfare]. The [Sultanate] and [Mughal] centuries are read as an era of [syncretism] and [tolerance]. The [ancient] centuries are read as [Brahmanical oppression]. The [Golden Age] of the Guptas disappears. The [reign] of Aurangzeb is [rehabilitated].
  image: _cache/657c061dcad4959c.jpg
  image_position: 63% 28%
  image_overlay: 1
  body_size: 41
  body_y: 18
- layout: split-story
  headline: |2+

  body: |
    The pattern is identical across the three cases: [erase] the [achievement], [romanticise] the [invader], [blame] the [Hindu]. India's past is recast as [historically stagnant], [sterile], and [uniformly oppressed]: the exact verdict [Mill] pronounced from a [London reading room] in [1817]. Only now, the verdict is delivered from a [tenured chair].
