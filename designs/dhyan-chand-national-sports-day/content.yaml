name: dhyan-chand-national-sports-day
brand: vaq-hq
format: instagram-portrait
caption: |
  Major Dhyan Chand was born on 29 August 1905, and India marks his birthday as National Sports Day. Three Olympics, three golds, one goal conceded. This is who he was.

  Why he matters. India won hockey gold at six straight Olympics from 1928 to 1956, scoring 178 goals and conceding seven, and went 30 matches unbeaten at the Games until the 1960 final. Dhyan Chand won the first three of those golds and was the reason the world noticed. In 1928 a Dutch newspaper wrote that this was not a game of hockey but magic, and called him the magician of hockey. Officials reportedly broke open his stick looking for a magnet. This was an India that competed under the British flag, and hockey was the one arena in which it beat the world.

  Amsterdam 1928. His first Games. India scored 29 goals and conceded none. Dhyan Chand scored 14 of them in five matches, the top scorer of the tournament, including two in the 3-0 final against the Netherlands.

  Los Angeles 1932. Two matches, 35 goals. India beat Japan 11-1 and the United States 24-1, a scoreline that stood as an Olympic record for decades. Dhyan Chand scored 12 across the two games, eight of them in the final. His brother Roop Singh scored 13. Between them, the brothers scored 25 of India's 35.

  Berlin 1936. Captain at 30. India scored 38 goals and conceded one, in the 8-1 final against Germany, in front of 40,000 people. Dhyan Chand scored three in that final by his own count, and 11 in the tournament by most tallies. The stories that grew around Berlin, the German offer of citizenship and a colonel's rank, the Dutch officials breaking his stick to look for a magnet, are legend, not record. The scoreline needs no help.

  The career. 185 international matches from 1926 to 1949, more than 400 goals by the traditional count. On the 1935 tour of New Zealand and Australia he scored 201 goals in 23 matches. Don Bradman, watching him in Adelaide, is widely reported to have said he scores goals like runs in cricket.

  After the whistle. Padma Bhushan, 1956. The National Stadium in Delhi renamed for him, 2002. National Sports Day on his birthday since 2012. The Khel Ratna renamed the Major Dhyan Chand Khel Ratna, 2021. The Bharat Ratna, campaigned for since 2011 and considered in 2014, has still not been conferred. He died on 3 December 1979 at AIIMS, New Delhi.

  Photos: 1936 Berlin Olympics, public domain, via Wikimedia Commons. Major Dhyan Chand National Stadium by Sanket Oswal, CC BY-SA 4.0, via Wikimedia Commons. Sources: Olympics.com, Olympedia, Britannica, The Times of India.

