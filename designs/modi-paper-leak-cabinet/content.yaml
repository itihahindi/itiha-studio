caption: |
  Prime Minister Narendra Modi has posted a video to his own Instagram account signalling tougher action on exam paper leaks. His caption, verbatim: "More strict actions against paper leaks to come in tomorrow's Cabinet!" The post went up on the evening of 23 July, which puts that Cabinet meeting on 24 July.

  The timing is the story. The Cockroach Janta Party has held Jantar Mantar since 20 June over the NEET-UG 2026 paper leak, which forced roughly 2.2 million candidates to sit the exam again, and is demanding Education Minister Dharmendra Pradhan's resignation. A march to Parliament on 20 July ended in violence. This is the government's first substantive signal on the students' core demand since then.

  For context, a law already exists. The Public Examinations (Prevention of Unfair Means) Act came into force in 2024, with jail terms and fines for organised cheating and leaks. What the PM is signalling is something stricter on top of it.

  Two honest notes. The specific Cabinet decision was not public when he posted, so what was actually approved is a separate question worth checking against the official briefing. And the remarks in the video are in Hindi; we have not translated them, and quote only his own English caption here.

  Video via @narendramodi.

