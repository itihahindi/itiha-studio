caption: |
  In 1520, after crushing the army of Bijapur at the Battle of Raichur, the Vijayanagara emperor Krishnadevaraya received an envoy from Sultan Ismail Adil Shah demanding the return of the captured fort, artillery, horses, and elephants. Krishnadevaraya's reply became one of the most extraordinary pieces of diplomatic theatre in Indian history. He would return everything, he said — provided Ismail Adil Shah came to him, bowed, and kissed his foot. What followed was a chess match between two rulers over whose sovereignty the ground itself belonged to.

  This carousel reconstructs the exchange. At Raichur, Krishnadevaraya's Vijayanagara forces routed the Bijapur army despite the Sultan's superior firepower and early artillery, capturing the fort and forcing Adil Shah into chaotic retreat. When the Sultan's envoy demanded the return of the captured territory and equipment, Krishnadevaraya made his condition: personal submission at his foot. Adil Shah's counter-move was diplomatic jujitsu — he agreed to "lovingly" kiss the emperor's feet, but as a sovereign king, protocol forbade him from setting foot in Vijayanagara territory to do it. Krishnadevaraya called the bluff without hesitation. If the Sultan would not come to Vijayanagara, he wrote, the emperor would bring his foot to the Sultan. He marched his army north into Bijapur territory and presented himself at the common border for the Sultan to fulfil the promise. Adil Shah did not show up. Krishnadevaraya occupied Bijapur temporarily, pushed further north to raze the fortress of Gulbarga, and returned home — having permanently shifted the balance of power in the Deccan.

  It is one of the sharpest moments in Vijayanagara history. And it is largely absent from the modern textbook, which prefers empires that were conquered to empires that did the conquering.

