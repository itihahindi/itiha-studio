  texture: vignette
- layout: split-story
  chapter: Chapter 07 · The Reformers
  headline: |
    A Church That Called
    Itself An *Army*
  body: The [Salvation Army] arrived in 1882 with generals, officers, articles of war and a paper called
    _The War Cry_. It did not open missions, it [occupied territory]. Madras handed it near-exclusive
    charge of notified itinerant communities, and its leader Booth Tucker collected the [Kaiser-i-Hind
    medal] for the work.
  image: salvation-army-india.jpg
  image_position: 50% 35%
  image_overlay: 0.9
  body_y: 29
