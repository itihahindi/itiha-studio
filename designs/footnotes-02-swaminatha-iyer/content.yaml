- layout: split-story
  chapter: Chapter 04 · The Hunt
  headline: |
    Seven Years Of
    Knocking On *Doors*
  body: |
    He went after the leaves village by village — lofts, unlocked almirahs, households that did not know what they were holding. Copies had been thrown out, ritually disposed of, or eaten. He read through unindexed piles and argued with owners who would not part with them, and he studied under Tamil [Jains] so that he could annotate a Jain epic properly. In his own account the [termites] beat him about half the time.
  image: tholkappiyam-plate.jpg
  image_filter: archival
  image_overlay: 0.55
