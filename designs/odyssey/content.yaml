  headline: |
    The Playbook Is
    Ancient. The Target
    Keeps *Changing.*
  body: |
    [Virgil] as prophet. [Ovid] as allegory. [Augustine's] gold. The three methods that digested [Homer] and the classical epics are the same three methods now applied to the [Ramayana], the [Thirukural], and the [Somaskanda] sculpture. The [names] have changed. The [technique] has not.
