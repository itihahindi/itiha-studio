  chapter: Chapter 07 · The Credit
  headline: |
    The Text Everyone
    Quotes Is *His*
  body: |
    The final volume was released on [22 September 1966], twenty-three years after Sukthankar died. Modern translations, concordances and scholarly argument all run on the constituted text he shaped. His name is rarely on the cover of any of them.
