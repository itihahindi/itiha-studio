name: Footnotes 04 · V. S. Sukthankar
brand: itiha
format: instagram-portrait
caption: |
  There is no single Mahabharata. There are hundreds of them, copied by hand across eight scripts and two thousand years, and no two agree. Footnotes, No. 4 of 15, is about the man who spent his life working out what the oldest recoverable version said: Vishnu Sitaram Sukthankar (1887–1943), general editor of the critical edition at the Bhandarkar Oriental Research Institute in Poona.

  He was not trained for it. Sukthankar read mathematics at St John's College, Cambridge, and passed the Mathematical Tripos, then went to Berlin for a doctorate in Sanskrit under Heinrich Lüders. He joined the Archaeological Survey in 1915. BORI had opened the Mahabharata project in April 1919, when R. G. Bhandarkar inaugurated it by formally collating a single opening mantra. Sukthankar became general editor in 1925.

  The method was collation and subtraction. Every stanza of the received text was written out and the reading of each manuscript recorded against it. Lines present across independent branches were old. Lines found in one region only were marked as later growth and kept in the apparatus rather than thrown away. The first two chapters of the Adiparvan alone were collated from no fewer than sixty manuscripts, in Sarada, Nepali, Maithili, Bengali, Telugu, Grantha and Malayalam besides Devanagari. Work ran at Poona, at Tagore's Visva-Bharati and at the Saraswathi Mahal in Tanjore.

  The Adiparvan appeared in 1933 with his Prolegomena, a hundred pages setting out the manuscripts and the reasoning. He died of cerebral thrombosis on 21 January 1943, aged 55, on the eve of a lecture. Others finished the work. The last volume was released on 22 September 1966 by President Radhakrishnan: 19 volumes, 18 parvans, more than 89,000 verses in the constituted text, drawing on 1,259 manuscripts. Almost every serious translation and study of the Mahabharata since runs on that text.

  Read him: Prolegomena to the Adiparvan (BORI, 1933), Critical Studies in the Mahabharata (1944) and On the Meaning of the Mahabharata (1957), all free on archive.org. Figures from BORI's own account of the edition and from the Prolegomena itself. Portrait: Wikimedia Commons, public domain. Grantha-script Mahabharata folio and the Institute building: Wikimedia Commons, CC BY-SA 4.0 and CC BY 4.0.

