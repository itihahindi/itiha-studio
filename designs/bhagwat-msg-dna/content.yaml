caption: |
  Outside Madison Square Garden: a protest, a mayor's opposition, a federal commission's demand that his visa be revoked. Inside: more than 6,000 people, and this.

  What he said. Addressing the Universal Oneness Celebration at the Infosys Theater on Saturday, RSS chief Mohan Bhagwat set Bharat's idea against America's: "When we say United States of America, one word is often discussed frequently. That is pluralism. And when we say Bharat, another phrase is discussed: unity in diversity. For Bharat, this unity and this diversity, both are in their DNA."

  Citing Swami Vivekananda, "Every nation has a message to deliver. Every nation has a mission to accomplish. Every nation has a destiny to fulfil," he said Bharat's destiny "is to realise and from time to time make the world realise this unity in diversity. We are one, and due to diversity, that oneness is decorated." Diversity, he said, "has to be celebrated, has to be respected, has to be accepted. And at the same time, we must keep in mind this feeling of oneness."

  He asked Bharatiyas abroad to fulfil their duties "in our karma bhumi as well as our janma bhumi," calling that "a boon for the world struggling with all these problems."

  The room. The nearly hour-long address was hosted by the American Hindus for Engagement and Dialogue (AHEAD) Forum and drew attendees from 39 states, 853 cities and 250 organisations, per the organisers. It was the first stop of a US, Canada and UK tour marking the RSS centenary.

  Footage: Republic World, via YouTube. Quotes: ANI, 30 August 2026. Attendance and event details: PTI via OrissaPOST, ANI.

