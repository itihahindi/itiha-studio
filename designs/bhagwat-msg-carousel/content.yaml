name: bhagwat-msg-carousel
brand: vaq-hq
format: instagram-portrait
caption: |
  Six thousand inside Madison Square Garden. A protest, a mayor's opposition and a visa-revocation demand outside. This is what Mohan Bhagwat actually said.

  The room. The Universal Oneness Celebration at the Infosys Theater on Saturday 29 August, hosted by the American Hindus for Engagement and Dialogue (AHEAD) Forum, drew more than 6,000 people from 39 states, 853 cities and 250 organisations, per the organisers. It was the first stop of a US, Canada and UK tour marking the RSS centenary. The address ran close to an hour.

  Pluralism and unity in diversity. "When we say United States of America, one word is often discussed frequently. That is pluralism. And when we say Bharat, another phrase is discussed: unity in diversity. For Bharat, this unity and this diversity, both are in their DNA."

  The Vivekananda line. "Every nation has a message to deliver. Every nation has a mission to accomplish. Every nation has a destiny to fulfil." Bharat's, he said, "is to realise and from time to time make the world realise this unity in diversity. We are one, and due to diversity, that oneness is decorated." And: "Diversity is natural and unity is truth."

  The sharpest line. "One tendency was: live and let live. The other tendency was: live and let only those live who obey us. Those who say, you obey us and we will protect you, are Rakshasas."

  The ask of the diaspora. Be loyal to your karma bhoomi; after that duty, if you want to do something for your janma bhoomi, live by the values Bharat gave you. "How much we earn is not important; how much we distribute is important." The message, he said, goes out "through practice, not through preaching."

  The week outside. On 26 August Mayor Zohran Mamdani said he was not supportive of the rally. On 27 August USCIRF urged the Trump administration to revoke Bhagwat's visa. On 28 August the Hindu American Foundation asked whether city grant money was funding the protest's organisers, and a Times Square billboard carried his portrait. On 29 August Hindus for Human Rights and allied groups protested outside while he spoke inside.
