caption: |
  The fight stopped being about NEET a while ago. This clip is about how the Prime Minister pronounces "friends".

  What the clip is. A Republic Digital short in which Arnab Goswami responds to a CJP-linked figure imitating Narendra Modi's accent, and specifically the way he says "friends". Modi's own line, carried in the same clip, is that they are making fun of him. Goswami's reply runs to the effect that the man they are mocking addressed the US Congress, and that whatever else he is, he is not a fake.

  What we could and could not confirm. The clip is real and the exchange is on Republic. What we could not stand up is the wider claim travelling with it, that CJP leaders spent days running a campaign against Modi's accent. We found no independent reporting of that. What the footage shows is one imitation and one broadcast reply. We are not printing "days" as fact.

  Why it is worth a minute anyway. A movement that began over an exam paper leak is now arguing about a man's vowels. Mocking an Indian accent is not a critique of policy. It is a class signal, and it tells you more about the people making the joke than the man they are aiming at. The Prime Minister of India speaks English the way most Indians speak English. That is the point, and it is not an insult.

  On the footage. The original post is a split-screen reaction video. We cropped away the reactor and kept only the Republic Digital segment, which carries Republic's branding and its own burned-in captions. That footage belongs to Republic. It is credited here, but this is not a licence we hold.

  Clip via @NindaTurtles. Segment: Republic Digital.

