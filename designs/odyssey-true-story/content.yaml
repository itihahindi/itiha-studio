name: odyssey-true-story
brand: vaq-hq
format: instagram-portrait
caption: |
  Christopher Nolan's The Odyssey is in cinemas, and it revives a story almost 2,700
  years old. So how much of it is history?

  The honest answer is layered. No Greek king really sailed home for ten years fighting
  Cyclopes and sirens. But historians increasingly read epics like the Odyssey as
  cultural memory, stories that carry fragments of real events long after the events
  themselves pass into legend. The poem was set down around the late 8th century BC,
  roughly four centuries after the Mycenaean world it describes had collapsed.

  Some of that world was real. A fortified city stood at the site of Troy in the Late
  Bronze Age and was destroyed more than once. Greece really was a patchwork of small
  kingdoms ruled from citadels like Mycenae and Pylos. Ithaca is a real island in the
  Ionian Sea, inhabited to this day. There is no single historical Odysseus, but he may
  be a composite of Mycenaean rulers remembered across generations of oral poets.

  Spoilers for the film from here. Nolan keeps the spine of Homer and rearranges the
  rest. Calypso feeds the lotus to Odysseus himself. Circe turns his men to pigs but is
  not his lover. He proves himself to Penelope by winning the archery contest, not by the
  secret of their olive-tree bed. A new character, Sinon (Elliot Page), talks Troy into
  taking the wooden horse. The film runs 2 hours 52 minutes and was shot entirely on IMAX
  film, with Matt Damon as Odysseus and Anne Hathaway as Penelope.

  Art: J.W. Waterhouse and G.D. Tiepolo (public domain). Photos: Stephen Chappell and Zde
  via Wikimedia Commons, CC BY-SA 4.0.

