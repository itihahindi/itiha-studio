name: Gloria Steinem — The Feminism She Learned In India
brand: itiha
format: instagram-portrait
caption: |
  Gloria Steinem died in Manhattan on 2 September 2026, aged 92. Her final essay ran in The New Yorker the next day, and the first thing it did was point at India: "I learned about feminism greatly from living in India for a couple of years after I had graduated from college in the nineteen-fifties."

  She graduated from Smith in 1956 and went out on a Chester Bowles Asian Fellowship, studying at Miranda House, Delhi University, learning to wear a sari from her classmates, and writing a guidebook, The Thousand Indias, in 1957. That was the smaller half of it. When caste violence broke out in Ramnad, in southern Tamil Nadu, in 1957, she joined a team of Gandhian workers from Vinoba Bhave's Bhoodan movement who walked village to village to counter rumour, discourage revenge and get people talking. The night meetings she sat in are the thing she carried home. In My Life on the Road she called it "the ancient and modern magic of groups in which anyone may speak in turn, everyone must listen, and consensus is more important than time." A decade later that shape reappeared in America as the consciousness-raising group, the engine of second-wave feminism. Her own summary: "My becoming an itinerant feminist organizer was just a Western version of walking in villages."

  The debt was visual too. When Ms. ran its preview issue inside New York magazine in December 1971, Miriam Wosk's cover was a pregnant, many-armed Kali holding a clock, a skillet, a typewriter, a rake, a mirror, a telephone, a steering wheel and an iron. Three hundred thousand copies went in three days. Rajiv Malhotra, in The Myth of Hindu Sameness, uses exactly this episode to make a harder point: the Hindu Goddess became a serious subject for white women revolting against male-centric Abrahamic religion in the 1970s, and the source tradition was seldom acknowledged for it, while the same Goddess was recast in Western scholarship as vulgar and oppressive. Steinem, to her credit, kept naming India. Her last essay named it again.

  Sources: Gloria Steinem's final essay, The New Yorker, 3 September 2026; My Life on the Road (2015); Rajiv Malhotra, "The Myth of Hindu Sameness"; the Wilson Center's "From Toledo to Tamil Nadu"; Live History India. Photographs: Warren K. Leffler, 1972, and Jay Godwin, 1975, both public domain; Gandhi and Vinoba Bhave, public domain; Kali, Kalighat school, late 19th century, public domain — all via Wikimedia Commons.

