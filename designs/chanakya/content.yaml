name: the-arthashastra-not-machiavellis-answer
brand: itiha
format: instagram-portrait
caption: |
  Mention the Arthashastra to most readers and the response arrives before the text does — "the Indian Machiavelli." The label is everywhere. It is also fundamentally wrong. Kautilya wrote roughly six thousand aphorisms across fifteen books, spanning taxation, mining, urban planning, contract law, espionage, welfare, and grand strategy — some eighteen centuries before Machiavelli published a slim political pamphlet from Florentine exile. Max Weber himself, drawing the original comparison, called The Prince "harmless" next to what Kautilya had written.

  This carousel draws on the scholarship of R. Shamasastry, who rediscovered the manuscript on a Mysore library shelf in 1905; on Thomas Trautmann and Patrick Olivelle, who have shown the text was shaped by multiple hands across centuries; and on the political theorists Stuart Gray and Roger Boesche, who argue that Kautilya — not Machiavelli — deserves the title of history's first great political realist. The Arthashastra defines the state through the saptanga model — seven fitted parts, none sufficient alone. Its rajamandala doctrine maps the calculus of neighbouring states across seventy-two elements. Its four upayas describe an escalation ladder that any modern deterrence theorist would recognise. And running through the entire treatise is yogakshema — the doctrine that a king's legitimacy rests on the active welfare of his subjects, a concept Nirmala Sitharaman invoked while framing the 2022 Union Budget.

  As Amartya Sen has argued, introducing a fourth-century BCE Indian analyst through the frame of a European writer born eighteen centuries later says less about Kautilya than about how narrow the reading list of modern political theory still is.

