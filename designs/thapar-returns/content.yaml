  headline: |
    Gold, Or
    The *Idol*
  left_label: The Thapar claim
  left_headline: An insatiable *greed*
  left_body: 'The attack of [Mahmud of Ghazni] on [Somanatha] was driven strictly by greed for gold.

    '
  right_label: The Islamic chronicle
  right_headline: A deity to *smash*
  right_body: '[Ibnu''l-Athir] recorded that Mahmud resolved to smash the deity specifically after hearing
    that Hindus believed the idol [invincible].'
  body_size: 45
