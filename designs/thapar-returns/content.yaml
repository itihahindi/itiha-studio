  headline: |
    The *Ghazi*
    Sufis
  left_label: Shaikh Sufi Sarmast
  left_headline: War in the *Deccan*
  left_body: 'Fought against the Deccan ruler [Kumaram], participating directly in [armed conflict].

    '
  right_label: Pir Ma'bari Khandayat
  right_headline: With *Malik Kafur*
  right_body: Accompanied the military campaign of [Malik Kafur] in South India, taking part in armed
    conflict and [forced conversions].
  body_size: 50
