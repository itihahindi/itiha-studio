  chapter: Chapter 03 · The Plates
  headline: |
    Copper Plates
    From A *Brick Kiln*
  body: |
    Diggers cutting earth for a kiln near [Pithapuram], East Godavari, turned up a set of inscribed copper plates. They stayed in the family of Hundi Venkata Rao for the better part of a century. Sarma and N. Venkataramanayya read them as the [Vilasa grant] of Prolaya Nayaka, a Musunuri chief, issued in [1330], seven years after Warangal fell.
