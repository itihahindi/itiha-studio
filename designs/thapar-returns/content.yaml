- layout: closing
  headline: |
    The *Pushpaka*
    Vimana
  body: |
    As Ravana's [Pushpaka Vimana] flew anywhere his mind willed, Thapar's history writing consisted of "flights of mental imagination" detached from [archaeological], [epigraphic] and textual evidence. Reclaiming a fact-based history requires seeing through these [rhetorical distortions].
