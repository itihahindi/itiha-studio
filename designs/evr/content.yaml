name: evr-nagammai-temple-harassment
brand: itiha
format: instagram-portrait
caption: |
  E. V. Ramasamy could not argue his first wife out of going to the temple. So he arranged for her to be harassed out of it. His own hagiographers record the episode — and hail it as a great rationalist strategy.

  Nagammai wanted to visit the temple, and EVR's reasoning failed to win her over. He went instead to his fellow 'minors' — the feudal playboy set his hagiographers admit he belonged to, brothel visits included — pointed his own wife out to them as a new Dasi in town, and asked them to make her consent to their desires. They began teasing and stalking her away from the temple. Traumatised, she stopped attending. Only later did she learn that the man who had set it up was her rationalist husband.

  The same hagiographic tradition sustains a second story with nothing behind it: that EVR coached Dr Muthulakshmi Reddy on countering Sathyamurthy over the devadasi question in the legislative assembly. There is no archival or documentary evidence for it, and the tale diminishes Reddy, who drew on the Advaitic humanism of Sarada and Sri Ramakrishna and needed no tutoring from EVR. Meanwhile the era's decisive women's rights struggle — the Sarda Act against child marriage, brought by Har Bilas Sarda and backed by Ambedkar and Gandhi — proceeded without him.

  @itiha29 · itiha.info
