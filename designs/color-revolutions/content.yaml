  chapter: THE THESIS
  headline: |
    A COUP IN THE
    SHAPE OF A
    *CROWD*
  body: In a 2024 essay, [Matija Šerić] calls a colour revolution a _technology_ for seizing a country's
    politics from abroad, a government pressured through political blackmail, with the [youth protest
    movement] as its means. Under the guise of a democratic uprising, he argues, the real work is a [coup
    d'état]. Without foreign sponsors, his claim runs, these risings **cannot arise**.
