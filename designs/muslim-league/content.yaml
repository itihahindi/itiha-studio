name: liaquat-poor-mans-budget-1947
brand: itiha
format: instagram-portrait
caption: |
  On 28 February 1947 the Muslim League's finance minister presented a budget for the poor. Within weeks the stock markets had closed, the Congress financiers had turned, and Partition had become the practical option.

  The Congress had handed Liaquat Ali Khan the Finance portfolio in the Interim Government on the assumption that the League lacked the expertise to use it, and would either decline or fail. Aided by able civil servants, Khan drafted a budget that adhered to the Congress party's own socialist declarations, making open opposition politically impossible. A 25 per cent tax on business profits above Rs 1,00,000 struck the industrialist families — the Birlas, Dalmias and Bajajs — who financed the Congress. A Tax Evasion Commission held wartime audits over the same business community. A capital gains tax choked investment until the exchanges at Bombay, Calcutta and Madras crashed and closed indefinitely in protest. And the salt tax, the target of Gandhi's most famous civil disobedience, was abolished outright, handing the League the moral high ground.

  Control of the purse followed. Departments headed by Congress ministers required financial clearance for routine business, and Sardar Patel, the Home Minister, said he could not appoint a peon without Liaquat Ali Khan's prior approval. The financiers, calling the budget murderous, began pressing the Congress leadership to accept Partition to save the economy. For Nehru and Patel it had demonstrated that a shared government with the League meant permanent gridlock. The party moved from resisting Partition to accepting it.

