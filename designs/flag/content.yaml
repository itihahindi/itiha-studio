- layout: document
  chapter: Chapter 04 · The Embellishments
  headline: |
    Vande Mataram.
    Eight *Stars.*
  body: In the very centre, the words [Vande Mataram], [Salutations to the Motherland], were embroidered
    on a [golden band]. The top section featured [eight stars] in a row representing the [different provinces
    of India], directly inspired by the [US flag], where each star represents a state. The middle section
    featured the [Sun] on the left and the [Crescent Moon] on the right, symbolising the [various faiths]
    and [geographical provinces] of India.
