format: instagram-portrait
caption: |
  The Fatawa-i-Alamgiri was the vast legal digest Aurangzeb ordered in the 17th century to settle Sunni Hanafi law across his empire. Because slavery ran through Mughal society, whole chapters set down how enslaved people were bought, returned and freed.

  The rules were exact. A buyer could claim a refund for hidden defects, forfeited that right after abusing the slave, and could not purchase a runaway. A woman who bore her master's child could not be sold and went free at his death.

  These passages sit in the digest's chapters on sale (Kitab al-Biyu) and manumission (Kitab al-Ataq). @vaqhq · vaqhq.com
