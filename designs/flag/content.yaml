name: savarkar-and-the-first-flag-abroad
brand: itiha
format: instagram-portrait
caption: |
  On 18 August 1907, at the International Socialist Congress in Stuttgart, Madame Bhikaji Cama stood before nearly 900 delegates from across the world and unfurled a flag no assembly had ever seen. She was 46. She was Indian. And the flag she raised — three horizontal stripes of green, saffron, and red, with "Vande Mataram" embroidered on a golden band, eight stars for the provinces of India, the sun and crescent for its faiths — had been designed for that moment by a young revolutionary in London named Vinayak Damodar Savarkar. This carousel is the record of how India's first international flag was made, and the woman who carried it into history.

  The context was strategic. In August 1907, the International Socialist Congress at Stuttgart was to bring delegates from across the world to debate colonialism. Savarkar and his revolutionary associates at India House in London saw the platform for what it was — the largest international audience the Indian freedom movement had ever been offered. Madame Bhikaji Cama, later called the Mother of Indian Revolutionaries, and Sardar Singh Rana were sent as delegates. Savarkar designed the flag they would carry. Green at the top for the Muslim community, saffron in the middle for Buddhists and Sikhs, red at the bottom for strength. "Vande Mataram" at the centre in gold. Eight stars for eight provinces — a direct nod to the American flag's convention of one star per state. The sun and the crescent for the faiths of the land. Then, on 18 August 1907, overcoming immense opposition — including a protest walkout by the British Labour politician Ramsay MacDonald — Madame Cama raised the flag before the assembly and delivered a speech that changed the register of the Indian freedom struggle abroad forever.

  The flag Savarkar designed did not become the national flag. What it did was more precise. It announced to the world that India was already a nation, already sovereign in its own reckoning, and already prepared to be recognised as one.

