name: Kundan Singh
brand: itiha
format: instagram-portrait
caption: |
  James Mill never set foot in India. He had no Sanskrit and no Persian. Yet the six volumes of his History of British India (1817) became the text on which the East India Company trained its administrators for half a century, and within a decade the Encyclopaedia Britannica had rewritten its India article to match him.

  Dr. Kundan Singh, writing in Colonial Discourse & the Suffering of Indian American Children, states the method plainly: the aim was not description but demotion. Strip the civilisation of every claim to culture and virtue, put hierarchy and oppression in its place, and what remains is a people who can be governed because they are no longer quite people.

  Portrait of James Mill via Wikimedia Commons (public domain).

