- layout: split-story
  chapter: Chapter 01 · The Problem
  headline: |
    No Two Copies
    Ever *Agreed*
  body: |
    Every region kept its own Mahabharata. The [Northern] and [Southern] recensions parted company early, and inside them the Sarada, Nepali, Maithili, Bengali, Telugu, Grantha and Malayalam manuscripts each carried a different text. Printed editions simply followed whichever copies were nearest to hand.
