- layout: split-story
  chapter: Chapter 04 · What The Plates Said
  headline: |
    A Country Laid Waste,
    And A Chief Who *Restored* It
  body: |
    In Sanskrit verse the grant describes the Telugu country after the conquest and presents [Prolaya Nayaka], ruling from Rekapalle on the Godavari, as the man who set it right. It records his gift of the village of Vilasa to a Brahmin. The Kaluvacheru grant of [1423] supplied the rest: seventy-five nayakas under his cousin [Kapaya], have re-taken Warangal.
