  chapter: Chapter 04 · 1857
  headline: |
    The Argument
    Over *1857*
  body: |
    The Board's Secretary, a Congressman, held that 1857 was a planned war to drive out the British. By Majumdar's account he wanted only the records that backed this, as others would [“thoroughly upset our purpose”]. Majumdar ordered that everything be collected.
