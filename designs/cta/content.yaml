  headline: |
    Not Workers
    *Offenders* Under
    Reform
  body: |
    Section 11 of the act, sent settlers into private factories like the [ILTD Company] near Stuartpuram (Andhra Pradesh). Women walked seven miles each way for shifts of [twelve to sixteen hours]. Because they were not legally workers but criminals under reform, no wage law, hour limit or safety rule applied to them.
  handle: Follow @itiha29 · itiha.info
- layout: story
  headline: |
    *Salvation army:*
    A Saviour of tribes
  body: In 1949, the discriminatory CTA act was finally repealed. The tribes were [de-notified]. Decades
    of separation, indoctrination, and suppression had a profound impact on collective memory.  Yerukula
    nowrefret  their supposed criminal past and celebrate the [Salvation Army's role in 'reforming' them]
