  headline: |
    Flogged For Singing
    *Vande Mataram*
  body: The state banned the song. Students and prisoners sang it anyway. Those caught were tied to a
    wooden frame called the [tiktiki] and flogged until blood ran. Others were held in [solitary dungeon
    confinement]. Ramananda Tirtha backed every one of them and made their punishment public.
  body_offset_y: 40
  body_y: 35
- layout: split-story
  image: bidar-fort.jpg
  image_filter: bw
  headline: |
    The *Bidar* Bazaar
    Burned
  body: Armed mobs set fire to the entire Bidar bazaar. The [District Collector] and the [DSP] supported
    rioting crowds. Ramananda Tirtha breached the police cordon, walked the smoking ruins, and reported
    the atrocity directly to [Mahatma Gandhi], demanding an open judicial inquiry. No help came.
  body_y: 55
