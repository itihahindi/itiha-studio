  chapter: Chapter 07 · The Unpaid Debt
  headline: |
    The Source Was
    Never *Named*
  quote: |
    The Hindu Goddess became the subject of very serious and intense study by many white women in the 1970s when they revolted against the male centric Abrahamic religions.
  attribution: Rajiv Malhotra · The Myth of Hindu Sameness
  body: |
    Malhotra's charge is that the traffic ran one way. The [source tradition] went unacknowledged, he wrote, while the same Goddess was recast by Western scholarship as vulgar, and as a symbol of the oppression of Hindu women.
