name: nasha-mukt-yuva-100-week-campaign
brand: vaq-hq
format: instagram-portrait
caption: |
  Prime Minister Narendra Modi launched the Nasha Mukt Yuva for Viksit Bharat Sankalp Abhiyan by video conferencing on 2 August 2026. The government put the launch-day turnout at over 10 million young people across 10,000 locations, taking a collective pledge against drug use.

  The campaign runs for 100 weeks under the Ministry of Youth Affairs and Sports, driven by MY Bharat volunteers. Every Sunday, local units are to hold sports events, walkathons, meditation sessions, nukkad nataks, art competitions and discussion forums. Schools, colleges, youth bodies, NGOs, industry associations and 125 spiritual organisations have been brought in. Volunteers and organisations will be recognised at the 50th, 75th and 100th week marks.

  Modi framed drug-free youth as a precondition for Viksit Bharat by 2047, and said individual resolve is harder to sustain than collective effort. He pointed to nationwide crackdowns, large seizures and rising arrests of dealers and smugglers as evidence the state is moving alongside the campaign. The test of a 100-week programme is week 60, not week one.

