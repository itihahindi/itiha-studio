- layout: split-story
  chapter: Chapter 06 · The Evidence
  headline: |
    The *Evidence* Was
    Their Own Folklore
  body: Accusations of theft and extortion came without proof. One official claim was that their god [Subramanyam]
    had given them a house-breaking tool, offered seriously as evidence of inborn criminality. Administrators
    argued crime ran in the blood like any caste occupation, and wrote it into the [1911] amendments.
  image: https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Murugan_by_Raja_Ravi_Varma.jpg/960px-Murugan_by_Raja_Ravi_Varma.jpg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail
  body_y: 37
