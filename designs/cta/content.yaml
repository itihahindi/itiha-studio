  chapter: Chapter 01 · The Trade
  headline: |
    Proud *Salt & Grain*
    Traders
  body: Before Modern railways, The [Yerukulas] moved grain and salt between the coast and the interior
    of the Madras Presidency. The Banjaras did wholesale; the Yerukulas did retail, reaching villages
    no one else could reach. They prevented famines, For many places they were [the only source of grain].
    Their cattle carried the loads and grazed on common forest land.
