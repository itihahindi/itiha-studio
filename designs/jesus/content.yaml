name: st-thomas-never-came-to-india
brand: itiha
format: instagram-portrait
caption: |
  On 27 September 2006, Pope Benedict XVI stated categorically that Saint Thomas the Apostle never visited South India. He reached only "western India" — modern-day Pakistan — and Christianity travelled to the south from there. The Pope's statement was in line with what the Catholic Church's own Vatican had communicated to Indian Christians in 1952: that Thomas's landing at Cranganore in 52 CE was "unverified." Yet the Thomas legend continues to be cited as the foundation of a fabricated "Dravidian Christianity" that predates and rivals the Vedic tradition. This carousel is the record of what the primary sources actually say.

  The evidence against the South Indian Thomas legend is overwhelming, and none of it is new. The sole original source is the Acts of Thomas, written in Syriac around 210 CE by the Gnostic poet Bardesanes at Edessa — a text universally recognised by modern biblical scholars as a fictional religious romance, not a historical record. The Acts describes a desert country where people speak an Iranian language, practice Zoroastrianism, and bear Persian names. This is Parthia, Afghanistan, or Baluchistan — not tropical Kerala. The earliest Church Fathers, including Origen, Clement of Alexandria, and Eusebius, all recorded that Thomas's assigned region was Parthia, not the Indian subcontinent. The South Indian claim that Thomas converted Namboodiri Brahmins in 52 CE is chronologically impossible — the Namboodiris did not migrate to Kerala until at least the 4th century. The Portuguese "discovery" of Thomas's skeleton at Mylapore in 1523 was dismissed by the Jesuit historian Father Henry Heras himself as a "barefaced imposture" — because the verified skeletal remains of Saint Thomas have been in the Basilica of Ortona in Italy, documented and continuously preserved, since 1258 CE. And the community claiming apostolic descent in Kerala are the descendants of 400 Syrian refugees who fled Persian persecution in 345 CE, led by a merchant named Thomas of Cana — later conflated with Thomas the Apostle.

  The Pope has said it. The Vatican has said it. The primary sources have always said it. Only the propagandists of "Dravidian Christianity" continue to insist otherwise.

