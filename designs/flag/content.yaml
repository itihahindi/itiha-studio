    Three Stripes.
    One *Nation.*
  items:
  - number: 1
    headline: Green — Muslim community
    body: The top stripe, [green], was chosen as the sacred colour of [Muslims]. Savarkar later explained
      it also suggested the [patriotic spirit] of the [Abhinav Bharat Society].
  - number: 2
    headline: Saffron — Buddhists and Sikhs
    body: The middle stripe, [saffron], represented the sacred colour of the [Buddhists] and [Sikhs],
      symbolising [glory] and [victory].
  - number: 3
    headline: Red — strength
    body: The bottom stripe, [red], symbolised the [strength] of the people who would carry the flag [forward].
  body_offset_y: -130
  number_size: 40
