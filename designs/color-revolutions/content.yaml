- layout: split-story
  headline: |
    THE NEXT ONE
    WON'T CALL ITSELF
    A *REVOLUTION*
  body: 'Where people sensed the [choreography], the script fell apart, [Beijing, 1989], [Tehran, 2009],
    [Moscow, 2012]. As Šerić wrote, "People would not be so rampant if they knew they were tools." The
    giveaway was never the colour, it was the [striking similarity] across nations that shared nothing
    else. The real question is: Who wrote the script, and who pays for the show?'
