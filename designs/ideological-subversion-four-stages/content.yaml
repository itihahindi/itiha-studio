name: ideological-subversion-four-stages
brand: itiha
format: instagram-portrait
caption: |
  The KGB called it Active Measures. Not espionage, not sabotage — a structured, decades-long campaign to change a nation's perception of reality, until the society dismantles itself and calls the result progress.

  This carousel walks the four chronological stages and their timetables. Demoralisation takes fifteen to twenty years, the minimum needed to school one generation while its inherited moral and patriotic counterweight is stripped away — religion commercialised, education softened into relativism, media diverted onto non-issues, the judiciary turned legalistic, security forces mocked until the public distrusts its own defence, the family replaced by dependence on the welfare state. Destabilisation runs two to five years and strikes the spinal cord: caretaker politicians promising artificial security, institutions bypassed by committees and mob-ocracy, a planned economy run with monopolies and unions, allies abandoned. Crisis takes two to six months — sleeper agents activate, the population welcomes strong leaders, emergency powers are granted, power changes hands by revolution, civil war or foreign intervention. Normalisation is permanent, and its first casualties are the radicals who cheered the whole thing on.

  Yesterday's useful idiots are rounded up, executed or imprisoned. The new regime has no use for disturbers. The press censors itself, and the population adapts.

  Where this comes from. The four-stage model and its timetables are the framework set out by Yuri Bezmenov, a Novosti press officer and KGB defector, in lectures and interviews from 1983 to 1984. "Active measures" — aktivnye meropriyatiya — is genuine Soviet tradecraft vocabulary for influence operations. The four named stages and their spans are Bezmenov's own schema rather than a published KGB manual, and are best read as one defector's account of method.

  Images, in order: Red Square parade, Moscow, 1936 · KGB headquarters at Lubyanka Square, 1983 · a Young Pioneer, Rostov-on-Don, 1986 · Viktor Deni's "Stalin's Pipe", 1930 · Moscow, 1941 · a T-72 on the streets of Moscow during the August 1991 coup attempt · the perimeter fence at Perm-36. Via Wikimedia Commons, public domain and Creative Commons.

  @itiha29 · itiha.info
