name: ramayana-trailer-costume-critique
brand: itiha
format: instagram-portrait
caption: |
  Nitesh Tiwari's Ramayana: Part One has released its first trailer — and while the VFX, scale, and star casting (Ranbir Kapoor as Rama, Sai Pallavi as Sita, Lara Dutta as Kaikeyi, Yash as Ravana) have generated real excitement, the costumes have drawn sharp criticism for looking jarringly contemporary. This carousel is the record of why they get it wrong — and what the women of the Ramayana actually wore.

  The dress of the Vedic period and the Ramayana era was fundamentally unstitched. Men and women wore lengths of cloth wrapped, pleated, and draped. The core ensemble was three pieces: the antariya (a rectangular lower cloth), the uttariya (an upper shawl), and the stanapatta (a simple breast band). Stitched, tailored blouses with sleeves, necklines, and darts did not exist. The modern blouse — with fitted sleeves, structured necks, and Victorian-era shape — is a 19th-century colonial innovation popularised under British social influence. Valmiki's own Ramayana describes Sita as pitakausheya-vasini — clad in yellow silk. Nowhere in the text do we find contrast-coloured tailored blouses, half-sleeves, salon-styled side-combed hair, or heavy modern chokers. Yet the trailer dresses Kaikeyi in a designer saree with a green contrast half-sleeve blouse — a look critics have called closer to an Ekta Kapoor serial than to Treta Yuga royalty. Sai Pallavi's Sita is styled with modern wedding-fashion drapes and heavy contemporary jewellery. Clothing is culture made visible. When a film adapts the foundational text of a civilisation, the drape matters as much as the dialogue.

  Ramanand Sagar's 1987 Ramayan was not archaeologically perfect either. But it kept the drape simple, the silhouette traditional, and the aesthetic recognisable. This trailer replaces that with something the Treta Yuga never wore.

