name: Footnotes 02 — U. V. Swaminatha Iyer
brand: itiha
format: instagram-portrait
caption: |
  Classical Tamil survived on palm leaf. Leaves rot, so every few decades somebody had to copy the whole text out again by hand or it was gone — and by the 1880s the copies sat in temple mutts and in private houses whose owners often could not read them. Footnotes, No. 2 of 15, is about the man who put that literature into print: U. V. Swaminatha Iyer (1855–1942), the Tamil professor at Kumbakonam who spent sixty years chasing manuscripts and died with the work unfinished.

  The turn came in 1880. At Government Arts College, Kumbakonam, Iyer met Salem Ramaswami Mudaliar, a civil munsif and a reader of Tamil, who asked what he knew of the old classics and whether he could annotate the Cīvaka Cintāmaṇi. Iyer — a pandit trained from 1870 under Meenakshi Sundaram Pillai and at the Thiruvavaduthurai Saiva mutt — had not heard of it. Mudaliar handed him a copy. What followed was a seven-year hunt through the villages of the Tamil country: lofts, unlocked almirahs, families who did not know what they were holding, copies already thrown out or eaten. He studied under Tamil Jains so that he could read a Jain epic properly, and in 1887, at thirty-two, he printed it.

  Then he kept going: Pattuppāṭṭu in 1889, Silappadikāram in 1891, Purananūru in 1894, Manimekalai in 1898, Kuṟuntokai as late as 1937. Over ninety books, more than three thousand manuscripts and notes. What he produced were editions, not transcriptions — the poem, a prose paraphrase, a note on who is speaking, and at the foot of the page the variant readings, the places where his copies disagreed. From January 1940 to May 1942 he serialised his own life as En Sarithiram in Ananda Vikatan; he died that April with it incomplete, and the library built around his manuscripts opened in Madras the next year.

  Read him: Cīvaka Cintāmaṇi (1887) and the classical editions; En Sarithiram, in book form from 1950, and in English as The Story of My Life. Photographs and the 1937 Kuṟuntokai page, public domain via Wikimedia Commons; palm-leaf Tevaram manuscript by Ms Sarah Welch, CC0; Government Arts College, Kumbakonam, CC BY 3.0.

