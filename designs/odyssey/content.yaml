- layout: split-story
  chapter: Method 02 · Allegorisation
  headline: |
    Ovid Was Exiled.
    Then *Christianised.*
  body: '[Ovid''s] epic [Metamorphoses] was so sensual that [Augustus] exiled the poet for writing it.
    A thousand years later, it had become a [core text] of [medieval Christian education]. Ovid''s [love]
    was re-read as [Christian truth]. His [myths] were re-read as [parables] of the soul''s need for [Christ].
    The technique: allegorise the [pagan story] into a [Christian lesson].'
