name: how-turkey-and-pakistan-coordinate-anti-india-propaganda
brand: itiha
format: instagram-portrait
caption: |
  A report by Mediterranean Asian Investigative Journalists documents a coordinated propaganda operation against India, jointly run by Turkey's intelligence agency MIT and Pakistan's ISI, with Turkey's state media outlets TRT World and Anadolu Agency as the focal points. The operation employs Kashmiri journalists, many with close ties to separatist leaders and to figures facing trial in terror-funding cases. Turkey supplies the platform. Pakistan supplies the manpower. The target is Indian public opinion, at home and abroad.

  This carousel documents the four documented components of the coordination. First, media coordination: TRT World and Anadolu Agency serve as the international broadcasting arms of Pakistan's Kashmir narrative, giving separatist voices the reach of a NATO member state's state media apparatus. Second, the student pipeline: Turkey offers lucrative scholarships and exchange programmes for Indian Kashmiri and Muslim students, funded through state-sponsored NGOs. Once the students land in Turkey, they are approached and cultivated by Pakistan proxies operating there. Third, the strategic shift: Erdogan's Islamist project deliberately ignores sectarian differences between Shias, Sunnis, and the various schools within them, aiming to rally South Asian Muslims across the ideological spectrum behind Ankara. Fourth, the political staging: Turkish television gives wide platform to Kashmiri separatists, and Turkey and Pakistan jointly organised a "Combating Hate Speech" event on the sidelines of a UN meeting, borrowing human rights language for a bilateral information war.

  Non-Kashmiri Indian Muslims have, historically, remained largely unconcerned about Kashmir. That is precisely the audience the operation is designed to change.

  @itiha29 · itiha.info
