name: Footnotes 07 · R. C. Majumdar
brand: itiha
format: instagram-portrait
caption: |
  The Government of India shelved R. C. Majumdar's history of the freedom movement. Footnotes, No. 7 of 15, is about Ramesh Chandra Majumdar (1888–1980).

  He had spent forty years on ancient India when, in 1948, he asked the Government of India to commission a history of the freedom movement. In December 1952 the Ministry of Education set up a Board of Editors. Nilakanta Sastri was one of its nine members. In 1953 the Board made Majumdar its Director, to collect the records and write the draft.

  He circulated the first volume at the end of 1954. At Ahmedabad in January 1955 the Board generally approved its lay-out, and on 22 March 1955 the government told Parliament the volume was "practically ready". Maulana Azad, the Education Minister, told him the draft looked very satisfactory, but that he had received complaints that Bengal's role had been exaggerated. A week after the Parliament answer, Tara Chand, a former Education Secretary who was not on the Board, brought a new plan to it and said the draft "could not be regarded as a historical text at all."

  Majumdar left the Board in October 1955. The government dissolved it at the end of the year, and the official history went to Tara Chand. Its first volume came out on 26 January 1961, and its preface did not mention the Board. Majumdar wrote his own: The Sepoy Mutiny and the Revolt of 1857 in 1957, and the three-volume History of the Freedom Movement in India in 1962–63, worked on single-handed. In its preface he wrote that his labours "were lost by the unceremonious rejection of my draft, not by the Board … but by the Government of India", and that "it is an ominous sign of the time that Indian history is being viewed in official circles in the perspective of recent politics."

  Read him: History of the Freedom Movement in India (3 vols), The Sepoy Mutiny and the Revolt of 1857, and The History and Culture of the Indian People (11 vols, general editor). His own words here are from the 1957 and 1962 prefaces and the 1962 appendix. Book pages: archive.org. Portrait: Wikimedia Commons. Secundra Bagh, Lucknow, by Felice Beato, 1858: Cleveland Museum of Art (CC0). National Archives of India reading room: DiplomatTesterMan, CC BY-SA 4.0.

