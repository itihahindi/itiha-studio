name: private-orbit-club
brand: vaq-hq
format: instagram-portrait
caption: |
  For 35 years, only two countries had a private company reach orbit with its own
  rocket. This month, a third arrived.

  The list starts in 1990, when Orbital Sciences flew the Pegasus, the first privately
  developed orbital rocket. SpaceX followed in 2008, then Rocket Lab in 2018. From 2019
  a wave of Chinese firms broke through, iSpace first, then Galactic Energy, Space
  Pioneer, LandSpace and Orienspace. The United States added Virgin Orbit, Astra,
  Firefly and, in 2025, Blue Origin.

  On July 18, 2026, Skyroot Aerospace launched Vikram-1 from Sriharikota and reached a
  450 km orbit, making India the third country, after the United States and China, with
  a private rocket in orbit.

  The list counts independent private companies. State-linked commercial spinoffs, such
  as China's CAS Space, are debated and left off.

  @vaqhq · vaqhq.com
