  chapter: Fact 02 · The Ten-Year Silence
  headline: |
    She Ghosted Him
    For A *Decade.*
  body: |
    Despite being Odysseus' greatest protector, [Athena] completely [ghosted] him for the [first ten years] after the [Trojan War]. The reason? Odysseus had blinded the [Cyclops Polyphemus], son of [Poseidon]. Helping him would have sparked a [direct war] with her [uncle], so Athena stayed away until Poseidon left for [Ethiopia].
