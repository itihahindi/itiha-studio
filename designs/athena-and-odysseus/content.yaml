name: athena-and-odysseus-a-partnership-of-cunning
brand: itiha
format: instagram-portrait
caption: |
  In Homer's Odyssey — the ancient text at the centre of Christopher Nolan's new blockbuster film — the relationship between the goddess Athena and the mortal Odysseus is unlike any other in Greek mythology. Most gods demanded submission from mortals. Athena treated Odysseus as a peer. The reason was simple: they shared the same core trait, metis, the Greek word for cunning and strategic intelligence. Two masterful liars, two brilliant tacticians, one partnership. This carousel is the record of five lesser-known moments in that partnership, drawn from the Odyssey itself.

  When Odysseus finally wakes on the shores of Ithaca, Athena approaches him disguised as a young shepherd. Instead of telling the truth, Odysseus spins an elaborate lie about being a fugitive from Crete. Athena shifts to her true form, smiles, and praises him — she loves him precisely because he is an unapologetic liar just like her. Yet for the first ten years of his journey after the Trojan War, she abandoned him completely. Odysseus had blinded the Cyclops Polyphemus, son of Poseidon, and Athena knew that helping him openly would spark a war between her and Poseidon. She stayed out of it until Poseidon was distracted on a trip to Ethiopia. She was also his tactical disguise artist — tapping him with her wand to turn him into a bald, filthy beggar to infiltrate his own palace, and later making him taller and muscular with hair "like hyacinth petals" to impress Penelope. She was his advance PR agent on the island of the Phaeacians, disguising herself as a herald and walking the city streets hyping the arrival of a "godlike stranger" before Odysseus ever entered the court. And at the very end of the Odyssey, after Odysseus slaughtered the 108 suitors of Penelope, Athena had to forcibly stop him from starting a civil war — dropping out of the sky, ordering him to stand down, and wiping the memories of the dead men's families to prevent Ithaca from tearing itself apart.

  It is one of literature's oldest partnerships — a goddess and a mortal, bonded not by piety but by metis. The Odyssey survives because they do.

  @itiha29 · itiha.info

