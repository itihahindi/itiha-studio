name: partition-violence-calcutta-to-punjab
brand: itiha
format: instagram-portrait
caption: |
  In August 1946 the corpses in Calcutta were piled two storeys high. The photographer Margaret Bourke-White, who had walked through Buchenwald, said the streets of the city reminded her of the camp.

  This carousel records what the Partition years did to ordinary people, from Direct Action Day to the Punjab crossings of 1947. In Calcutta a fourteen-year-old boy was stripped so that his body could be examined for circumcision and his religion established, then held under the water of a pond with bamboo poles until he drowned, while a Bengali onlooker is said to have timed the death on his Rolex. In the Punjab mobs bound whole families together, poured oil over them and lit them as a single torch; survivors, children among them, came out with their hands hacked off. At Hasilpur a passer-by took the heaps at the roadside for manure and found instead the contorted bodies of 350 Hindu and Sikh men, women and children killed by a Pathan mob.

  Rape was used consciously and systematically as a weapon. Women were held down and cut, tattooed or branded with their attackers' names and the dates of the assaults. In Amritsar a Sikh mob stripped and paraded Muslim women through the streets; those not hidden by rescuers were burned alive. At Thoa Khalsa, ninety Sikh women went into a well rather than wait for the men coming for them, and their bodies rose later to the surface, some with infants still at the breast.

