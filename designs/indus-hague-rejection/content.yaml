name: India rejects the Hague on the Indus treaty
brand: vaq-hq
format: instagram-portrait
caption: |
  The Hague ordered India to treat the Indus Waters Treaty as fully in force. Delhi's answer: the court does not exist in law, and the treaty stays in abeyance.

  What the court said. On 31 August the Court of Arbitration ruled unanimously that the 1960 treaty "remains fully in force," found India's April 2025 suspension had "insufficient justification," and imposed interim limits on concreting at the Ratle project until roughly July 2027, when a World Bank-appointed neutral expert is due to decide.

  What Delhi said. The Ministry of External Affairs: "This so-called Court of Arbitration has no jurisdiction whatsoever to pronounce on India's sovereign decisions." Its pronouncements "will have no effect on India's actions." This is the third award India has binned from a body it has never recognised: the supplemental award of June 2025 and the pondage award of May 2026 were both rejected as the work of an "illegally constituted" tribunal whose decisions are "null and void."

  The part worth being precise about. Abeyance is conditional, not eternal: India has tied restoration to Pakistan "credibly and irrevocably" ending support for cross-border terrorism, the condition set after Pahalgam, 22 April 2025, 26 dead. And the leverage is structural: the Indus system feeds about 80 percent of Pakistan's farmland.

  Sources: Al Jazeera, 31 Aug 2026; Free Press Journal, 1 Sep 2026; MEA statements via Akashvani, Jun 2025 and May 2026.

  @vaq_hq
