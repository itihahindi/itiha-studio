  image_zoom: 1.5
  quote: |
    Two facts emerge rather clearly out of the chaos: firstly, the text was originally committed to memory and recited freely; secondly, different rhapsodists recited differently.
  attribution: Sukthankar, Prolegomena to the Adiparvan · Bhandarkar Oriental Research Institute, Poona,
    1933
  quote_size: 40
