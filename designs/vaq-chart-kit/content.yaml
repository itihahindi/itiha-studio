name: vaq-chart-kit
brand: vaq-hq
format: instagram-portrait
caption: |
  Reference deck for the Vaq HQ chart system. Every plot here is real, sourced data from the E20 ethanol reporting, so the kit can be judged on the numbers it will actually carry.

  The rule behind the look. Vaq HQ is a two-tone system: paper, hero orange, navy. That leaves no second accent to spend on telling series apart, so these charts encode by emphasis instead. The subject is orange, the field is slate. That pair separates on lightness rather than hue, which means it survives colour blindness better than any two-colour scheme would.

  Every value is printed on the plot. A slide has no tooltip and no table view, so a number that is not on the chart is a number the reader cannot get.

  @vaq_hq · vaqhq.com
hashtags: |
  #VaqHQ #DataViz #Charts #DesignSystem
tweaks:
