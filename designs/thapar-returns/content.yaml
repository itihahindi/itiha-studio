  chapter: Chapter 01 · The lecture
  headline: |
    The Yechury
    Memorial *Lecture*
  body: |
    On [25 October 2026], Romila Thapar delivered the [Second Sitaram Yechury Memorial Lecture] in New Delhi, on historiography and early Indian history.
    She held that conflicts between Hindu and Muslim rulers could not be explained solely through religion, and named [Haldighati] as her example.
  image: yechury.jpg
  image_position: 50% 18%
  theme: dark
  texture: halftone
- layout: comparison
  chapter: Chapter 02 · Haldighati
  headline: |
    A Battle Reduced
    To *Territory*
  left_label: The Thapar reading
  left_headline: A *territorial* contest
  left_body: 'Rana Pratap''s army included [Afghan soldiers] under Hakim Khan Suri. The Mughal army was
    commanded by the [Rajput] Raja Man Singh.

    '
  right_label: The erased conflict
  right_headline: A *civilizational* war
  right_body: The logic used tactical [battlefield alliances] to erase the deeper conflict between [native
    kingdoms] and foreign expansionism.
  image: haldighati-chokha.jpg
  image_overlay: 0.86
  theme: dark
  texture: halftone
- layout: story
  chapter: Chapter 03 · The framework
  headline: |
    History As A
    Political *Tool*
  body: |
    Author [Anurag Sharma] identified a [unilinear Marxist framework] in Thapar's work. Historical facts were forced into pre-determined molds of [class struggle] and [economic determinism].
    The result was a political project, not an objective quest for **truth**.
  texture: halftone
- layout: comparison
  headline: |
    Two Standards
    Of *Proof*
  left_headline: 'Native evidence

    *Hyper*-scepticism'
  left_body: 'Native texts, recorded traumas and traditional continuities met an impossibly high threshold
    of proof. They were labelled [fantasies], [Brahmanical fabrications] or [class interests].

    '
  right_headline: Convenient evidence
  right_body: Obscure, minor or heterodox references, and sometimes the [absence of text], were accepted
    outright. A single alternative story or an [atypical decree] became the definitive key to history.
  headline_offset_y: -50
  body_size: 45
  body_offset_y: -240
  texture: halftone
- layout: story
  chapter: Chapter 05 · Motive erased
  headline: |
    Zeal Rewritten
    As *Economics*
  body: |
    Thapar systematically argued that medieval foreign Muslim rulers acted purely from [political] or [economic] considerations, not religious zeal.
    Under this framework, any critical examination or recollection of medieval religious atrocities was labelled [un-secular].
  image: mahmud-bhatiya.jpg
  theme: dark
  texture: halftone
- layout: comparison
