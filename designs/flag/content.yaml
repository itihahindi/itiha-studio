  headline: |
    A British Politician
    *Walked Out.*
  body: |
    Cama's unfurling of the flag was met with [immense opposition]. The British Labour politician [Ramsay MacDonald], who would later become the [Prime Minister] of Britain, led a [protest walkout] from the assembly. Cama stood her ground. She held the flag [high]. She [thundered] her appeal to the [lovers of freedom] across the world to cooperate in [freeing one-fifth of the human race].
  source: 'Savarkar: Echoes from the Forgotten Past by Vikram Sampath '
