    He Wrote To The *Nizam*
    In His Own Words
  body: In his formal communication to the Nizam's government, Ramananda Tirtha set the terms of the struggle.
    The fight for responsible government, he wrote, had [no place for ill will in it], and it was a fight
    [for all irrespective of caste or religion]. He named the autocracy as the target.
