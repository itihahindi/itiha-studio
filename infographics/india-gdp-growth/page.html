<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="@kit/poster.css"></head>
<body><div id="canvas"></div>
<script src="@kit/poster.js"></script>
<script>
// Real GDP growth, 2011-12 base, 2010-11 to 2025-26. Data: .claude/skills/india-economy/data/india_macro.csv.
window.POST = {
  ground: 'coal', hSize: 90,
  tag: 'India · GDP growth',
  headline: 'Since 2010, India\'s economy shrank only <em>once</em>',
  dek: 'Real GDP growth each year. The one fall: 2020-21, the Covid year.',
  source: '<b>Source:</b> MoSPI national accounts (2011-12 base) via eSankhyiki and NSO press notes; 2024-25 provisional, 2025-26 first advance estimate. The new 2022-23 series starts in 2022-23, so the long run stays on the old base.',
  data: [{"y": "2010-11", "v": 8.5}, {"y": "2011-12", "v": 5.2}, {"y": "2012-13", "v": 5.4}, {"y": "2013-14", "v": 6.3}, {"y": "2014-15", "v": 7.4}, {"y": "2015-16", "v": 7.9}, {"y": "2016-17", "v": 8.3}, {"y": "2017-18", "v": 6.7}, {"y": "2018-19", "v": 6.4}, {"y": "2019-20", "v": 3.8}, {"y": "2020-21", "v": -5.7}, {"y": "2021-22", "v": 9.6}, {"y": "2022-23", "v": 7.6}, {"y": "2023-24", "v": 9.2}, {"y": "2024-25", "v": 6.5}, {"y": "2025-26", "v": 7.4}],
  checks(d, PK) {
    const neg = d.filter((r) => r.v < 0);
    PK.check(neg.length === 1 && neg[0].y === '2020-21' && neg[0].v === -5.7, 'negative years');
    PK.check(d[0].y === '2010-11' && d[d.length - 1].v === 7.4, 'ends');
  },
};

// shared: one column per fiscal year, labels every third year + the last
function columns(svg, box, PK, rows, opt) {
  const L = 96, top = opt.top || 60, base = box.h - 52;
  const y = PK.scale(opt.min, opt.max, base, top), slot = (box.w - L) / rows.length, bw = slot * 0.66;
  const cx = (i) => L + slot * (i + 0.5), zero = y(Math.max(0, opt.min));
  opt.ticks.forEach((t) => {
    PK.el(svg, 'line', { x1: L, x2: box.w, y1: y(t), y2: y(t), stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 2 });
    PK.el(svg, 'text', { x: L - 14, y: y(t) + 12, 'text-anchor': 'end', class: 'pk-axis' }, opt.tick(t));
  });
  rows.forEach((r, i) => {
    const v = r.v, hot = opt.hot(r, i);
    PK.el(svg, 'rect', { x: cx(i) - bw / 2, y: Math.min(y(v), zero), width: bw, height: Math.abs(y(v) - zero),
      fill: hot ? 'var(--orange-2)' : 'var(--orange)', opacity: opt.dim && opt.dim(r) ? 0.55 : 1 });
    if ((i % 5 === 0 && i < rows.length - 3) || i === rows.length - 1) PK.el(svg, 'text', { x: cx(i), y: base + 44, 'text-anchor': 'middle', class: 'pk-axis' },
      "'" + r.y.slice(2, 4) + '-' + r.y.slice(5));
    if (opt.label(r, i)) PK.el(svg, 'text', { x: cx(i), y: v < 0 ? y(v) + 46 : y(v) - 14, 'text-anchor': 'middle', class: 'pk-value' }, opt.label(r, i));
  });
  return { y, cx, base, bw };
}

function draw(svg, box, PK) {
  columns(svg, box, PK, POST.data, { min: -7, max: 11, ticks: [-5, 0, 5, 10], tick: (t) => (t > 0 ? '' : '') + t + '%',
    hot: (r) => r.v < 0, dim: (r) => r.y === '2025-26',
    label: (r) => (r.y === '2020-21' || r.y === '2025-26') ? PK.num(r.v, 1).replace('-', '−') : '' });
}

PK.run();
</script></body></html>
