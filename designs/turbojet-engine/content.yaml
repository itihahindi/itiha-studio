format: instagram-portrait
caption: |
  India has built its first fully indigenous expendable turbojet engine in the 350 kg thrust class. Developed by DRDO's Gas Turbine Research Establishment and manufactured with Azad Engineering, the engine was handed over to the Ministry of Defence this week.

  Expendable turbojets power cruise missiles and one way attack drones, and jet engine technology is regarded as one of the most sophisticated engineering disciplines in the world. Very few countries can build one end to end. India has just joined that club in the small engine tier.

