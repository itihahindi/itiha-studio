caption: |
  DRDO has flight tested Kusha for the first time. The long range surface to air missile lifted off from APJ Abdul Kalam Island off Odisha and intercepted a high speed, high altitude aerial target.

  Project Kusha is India's indigenous answer to the Russian S-400, a layered air defence shield with three interceptor variants built to take down fighter jets, drones, cruise missiles and large aircraft at long range. The Air Force variant comes first, and a naval version is planned next.

