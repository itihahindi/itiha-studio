name: how-bose-broke-the-british-army
brand: itiha
format: instagram-portrait
caption: |
  In March 1941, Britain's Special Operations Executive — a covert unit created by Winston Churchill himself and headed by his close associate — issued a direct order to assassinate Subhas Chandra Bose. The British Foreign Office consented to Bose being "liquidated" on neutral Turkish territory. This was not standard wartime protocol. This was an empire terrified of one man. This carousel is the record of what Bose understood about the British Raj that made his elimination worth a direct kill order — and how, even in defeat, his prediction came true.

  Bose escaped house arrest in Calcutta in January 1941, disguised first as a Muslim insurance agent and later in a flowing turban, trekking across frozen mountain passes into Afghanistan and eventually to Berlin. His goal was to secure Axis military aid to liberate India. What terrified the British was not his politics but his diagnosis of their weakness — Bose understood that if a foreign force of just 50,000 men reached India's borders, the British Indian Army would desert its colonisers and the masses would rise. This was the vulnerability Churchill lost sleep over. Sixty percent of educated Indian officers already expected independence as a reward for fighting the war. Churchill refused to equip Indian troops with modern tanks, asking his commanders, "how do you know they wouldn't turn and fire the wrong way?" After failing to get substantial help from Hitler, Bose took a three-month submarine journey to Southeast Asia in 1943, took command of the Indian National Army, and at Imphal in 1944 marched his under-equipped soldiers toward India shouting "Jai Hind! Chalo Delhi!" The march was defeated. Bose reportedly died in a plane crash in Taiwan in August 1945 — though SOE agents were operational across Southeast Asia at the time, and the original assassination order still seemed to be in effect. Then came the payoff. In late 1945, the British foolishly put surviving INA commanders on public trial for treason at Delhi's Red Fort. The trial outraged the country, sparked the Royal Indian Navy mutiny of 1946, and forced the British Commander-in-Chief to admit that any further prosecution would dissolve the Indian Army entirely.

  For the first time since 1857, the British realised they could no longer use their own army to hold India. Which meant they could no longer hold it at all. Bose lost the battle. He won the war he was actually fighting.

