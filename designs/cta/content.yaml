  chapter: Chapter 08 · The Settlement
  headline: |
    Whole Families
    Inside The *Settlement*
  body: Jails held individuals; settlements like [Sitanagaram] and [Stuartpuram] held grandparents, parents
    and children were separated for [Missionary education}. Attendance was taken up to five times a day.
    The Salvation Army was police, landlord and employer at once. The promised farmland was barren, and
    the promised _pattas_ never came.
