name: indian-money-ivy-league-letterhead
brand: vaq-hq
format: instagram-portrait
caption: |
  Over fifteen years, Indian industrial wealth quietly became a structural funder of how India is studied in the West. The amounts are public. What they bought is the fight.

  The ledger. Tata Trusts and Tata companies put about $50 million into Harvard Business School from 2010, building Tata Hall, an executive education block dedicated in 2013 and underwritten by Ratan Tata, who took the Advanced Management Programme there in 1975. Lakshmi Mittal and family gave $25 million in 2017, and Harvard's South Asia Institute, running since 2003, was renamed for them. Anand Mahindra gave $10 million in October 2010, the largest gift in Harvard's history earmarked solely for the humanities, and the Humanities Center was renamed for his mother Indira. Rohan Murty endowed the Murty Classical Library of India with $5.2 million. Four gifts, a little over $90 million, one university.

  The hundred-year one. The Murty Classical Library publishes dual-language editions of Indian classics through Harvard University Press: 500 volumes planned, roughly five a year, running for a century. It began in 2015, which makes it eleven years into a hundred. Its general editor is Sheldon Pollock, whose scholarship argues Sanskrit was bound up with the expression of political power, a reading many Indian scholars reject.

  The one test on record. In 2016, 132 scholars and intellectuals petitioned for Pollock's removal as general editor, after he signed statements on the JNU arrests, and asked that the library be aligned with Make in India and its board reconstituted. Rohan Murty refused. Pollock stayed. A counter-petition backed him. It is the only occasion where Indian donors were publicly asked to steer the scholarship they fund, and it went the other way.

  Then the model came home. Ashoka University opened at Sonipat in 2014, raised on ₹1,547 crore from 170 founders and 45 donors, the largest collective philanthropy project in the country. Krea took its first students in 2019. Both are private liberal arts universities built by Indian founders on an American template.

  Two readings. One side calls this outsourcing the story of India to people who are not accountable to anyone here. The other calls it scholarship, translation and global reach, and points out that the classics being translated had no comparable English edition before. The amounts are not in dispute. The meaning is the whole argument.

  Sources: Harvard Crimson and Harvard Gazette on the Mittal and Mahindra gifts; Harvard Magazine and HBS on Tata Hall; Harvard University Press on the Murty Classical Library; Scroll, Time and Publishing Perspectives on the 2016 petition and Rohan Murty's response; Forbes India and Ashoka University on the founding raise.

  @vaqhq · vaqhq.com
