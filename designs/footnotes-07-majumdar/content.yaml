    Majumdar's
    *Explanation*
  image: preface-1957-p6.jpg
  image_filter: archival
  image_position: 50% 20%
  quote: |
    A theme round which strong emotions have gathered for years, and which involves … a judgment on the views and actions of persons who occupy, for the time being, high places … this seems to me to be the main reason why the draft prepared by me was not destined to see the light of the day.
  attribution: Majumdar, preface to The Sepoy Mutiny and the Revolt of 1857, 1957
  quote_size: 36
  texture: halftone
- layout: quote
  chapter: Chapter 07 · His Own History
  headline: |
    He Wrote It
    *Himself*
  quote: |
    Real history, on the other hand, teaches us that the major part of India lost independence about five centuries before, and merely changed masters in the eighteenth century.
  attribution: Majumdar, preface to History of the Freedom Movement in India, Vol. I, 1962
  body: |
    Working alone, he published his own [History of the Freedom Movement in India] in three volumes, 1962–63. The official version, he wrote, assumed India lost its independence only in the 18th century.
