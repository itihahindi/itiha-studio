name: noor-inayat-khan-indias-daughter-who-fought-hitler
brand: itiha
format: instagram-portrait
caption: |
  In 1943, in a Nazi concentration camp in Germany, a young Indian woman named Noor Inayat Khan was executed by firing squad. She had been starved, chained, and beaten for months. She had refused, throughout the interrogations, to give up a single name. The last word she spoke before the bullets was "Liberté" — freedom. She was 30 years old. She is buried in a country she never called home, for a fight she chose because it was hers to make. This carousel is her record.

  Noor was born in Moscow in 1914 and raised in Paris, playing the piano and the veena, writing music and stories for French radio. When Hitler's forces overran France in 1940, her family fled to Britain. She saw with her own eyes what the Nazis were and something inside her hardened. She applied to the British army — an Indian woman, born in Moscow, fresh off the boat from Paris. They turned her down flat. She wrote back citing her British passport. Her fluent French, her quiet confidence, and her spirit got her in. They trained her as a wireless operator with the Special Operations Executive and dropped her into Nazi-occupied Paris as a secret agent under the code name Madeleine. Within weeks the Gestapo had rounded up nearly every British agent in the city and knew a spy called Madeleine was somewhere in Paris. London ordered her home. She refused. She was the last operator still transmitting intelligence out of Paris and she was not leaving. She dyed her hair, changed her appearance, and kept working under the Nazis' noses for months — moving her transmitter to a new location after every message because German detection vans could trace any signal that ran longer than fifteen minutes. She was finally betrayed by a friend jealous of her, who sold her to the Gestapo for a reward.

  Years earlier, in her British army interview, someone had asked her about India. Her answer was direct — her duty right now was to fight fascism. If that fight was won, she would stand behind India's freedom too. She won her fight. She did not live to fight the second one.

