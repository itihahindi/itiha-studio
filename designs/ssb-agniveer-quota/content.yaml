name: ssb-agniveer-quota
brand: vaq-hq
format: instagram-portrait
caption: |
  SSB Recruitment Rules 2026: the Ministry of Home Affairs has reserved 50% of Sashastra Seema Bal Constable (General Duty) vacancies for former Agniveers, every recruitment year, and waived the tests they would normally have to clear. This is the clearest after-service pathway the Agniveer scheme has been given so far.

  What the new SSB Constable GD rules change, in plain terms. Ex-Agniveers are exempted from the written examination, the Physical Standards Test (PST) and the Physical Efficiency Test (PET), on the logic that four years of army service already screens for fitness and discipline. The upper age limit is relaxed by three years for ex-Agniveers, and by five years for the very first batch leaving service. Hiring runs in two phases: the first fills the reserved ex-Agniveer quota, the second opens to all candidates by open competition. Direct recruitment eligibility stays at 18 to 23 years with a matriculation qualification.

  Why it matters. Agniveers serve a four-year term and most exit without a pension. A guaranteed 50% route into the SSB, with the exams removed, is the kind of landing the scheme was criticised for lacking. It also signals how the CAPF forces are being reshaped around a steady flow of short-service veterans.

  Sources: Ministry of Home Affairs notification via ANI, India Today, Asianet Newsable (28 July 2026).

