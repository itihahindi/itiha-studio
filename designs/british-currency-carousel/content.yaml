name: the-great-education-myth
brand: itiha
format: instagram-portrait
caption: |
  For nearly two hundred years, the story of Indian education has been told through one man and one date — Thomas Babington Macaulay and his 1835 Minute. The story says the British gave modern education to a country that was stuck in darkness. The research of historian Parimala V. Rao proves this story wrong. India had a working school system long before the British arrived. It was written, not oral. It was mostly non-Brahmin, not caste-restricted. It was funded by families and communities. The British did not build it. They broke it.

  Rao's work draws on colonial-era school surveys in the Bombay, Madras, and Bengal Presidencies. In Madras, out of 142,369 Hindu boys in school, 111,890 were non-Brahmin. In Bengal, out of 1,463 Hindu teachers, 1,255 were non-Brahmin. In Tirhut, students from the "untouchable" Sunri caste were ahead of upper-caste students in some subjects. Children of "good caste" families were taught by teachers of "inferior caste" without complaint. The classroom used sandboards, wooden writing tablets, and clay pencils, then moved to palm leaves, plantain leaves, and paper. It was a written culture, not an oral one. For the first 95 years of British rule — from 1757 to 1852 — the colonial state opened zero English schools. The Orientalist officials kept Indians on Sanskrit and Arabic sacred texts on purpose, to keep them away from the political ideas coming out of Europe. Modern schooling in India was actually built by Indians like Rammohan Roy, who fought the colonial state to open the Vidyalaya in Calcutta. Macaulay himself wrote 42 Education Minutes, not one. In the 41 forgotten ones, he asked for Indian teachers to be paid 30 to 50 rupees. The colonial state paid 5. When Macaulay left India, the state closed every school he had opened.

  Macaulay is not the man who built Indian education. He is the mask hiding a state that refused to build it.

