name: internal-hierarchy-indian-muslim-biradiris
brand: itiha
format: instagram-portrait
caption: |
  Source - ‘Caste’ Among Muslims: Ethnographic Account from a Karnataka Village By Sobin George & Shrinidhi Adiga

  It is called biradiri, and it behaves like caste. Across Indian Muslim settlements, sub-groups are placed in a hierarchy that governs whom a family may marry, whose food may be eaten, which mosque may be entered, and which trade a man's sons will inherit.

  At the top sit the Hanafis — Syeds, Sheikhs, Mughals and Pathans — Urdu-speaking and claiming noble descent. Below them are the Shaffis of Kerala and the Malikis or Labbes of Tamil Nadu, migrants whose ancestral claims local upper-status families often distrust. At the base are the occupational biradiris: Baigs, Darvesus, Ladafs, Nadafs, Pinjaras, Pakzades, Phulharas, Mochis, Chapparbandhs. Marriage is endogamous by preference and by prohibition: Syeds and Sheikhs intermarry, avoid the Pathans over cultural difference, and refuse proposals from below entirely. The Pinjara, Ladaf, Nadaf and Baig are branded not clean. Where inter-group marriage occurs it is hypergamous and exceptional — a high-status man of advanced age or physical disability taking a lower-status woman, who then holds a position equivalent to a servant.

  Purity rules follow into the kitchen and the mosque. Upper-status families avoid food cooked in Ladaf, Nadaf and Pinjara homes; at feasts the lower groups sit as subordinates because they are the recipients of Zakat. Pinjaras and Nadafs, accused of ancestral ritual and of not praying five times, maintain separate mosques. Occupation is inherited along biradiri lines — Qassabs butcher, Pakzades wash, Mochis work leather, Chapparbandhs build huts — and low entitlements in education and land keep the cycle closed. Leadership in local self-government is captured by Syeds and Sheikhs; welfare information is withheld; the roads and drains of forward-class settlements are maintained while the lower quarters are left unpaved and stagnant.

  On the terms. The stratification described here is the subject of a substantial sociological literature, beginning with Imtiaz Ahmad's Caste and Social Stratification among Muslims in India (1973). The framework most often used in that literature is Ashraf, Ajlaf and Arzal — a top tier claiming foreign descent, and indigenous occupational groups below it. Pasmanda is the term the lower groups increasingly use for themselves. The biradiri names above are drawn from local ethnography and the ordering varies by region; this is a description of specific settlements, not a single national ranking.

