name: nathu-la-reopens
brand: vaq-hq
format: instagram-portrait
caption: |
  On 1 August, a gate at 4,300 metres opens for the first time in six years.

  What is happening. Border trade through the Nathu La pass in Sikkim resumes on 1 August 2026, ending a suspension of more than six years. Around 600 registered Indian traders work this route.

  Where it sits in the sequence. Nathu La is not a one-off. India and China agreed to reopen three traditional trading passes: Shipki La in Himachal Pradesh, Lipulekh in Uttarakhand and Nathu La in Sikkim. Shipki La went first, with trade commencing on 1 June. Nathu La completes the set.

  The paper trail. The decision traces to the 24th round of the India-China Special Representatives' dialogue in August 2025, and followed Chinese Foreign Minister Wang Yi's visit to New Delhi. Disengagement on the ground came first. The passes came after.

  The history, which is the interesting part. Nathu La carried traffic on a spur of the old Silk Road. It was closed after the 1962 war and stayed closed for 44 years, reopening on 6 July 2006 in what both governments called the Year of India-China Friendship. The original agreement was narrow: 29 categories of goods permitted out of India, 15 in. Then the pandemic shut it in 2020, and the Galwan Valley clash that June ensured it stayed shut.

  Do not confuse this with an economic event. The volumes through Nathu La have always been small, and the permitted lists have long read like a museum inventory. That is not the point. An open pass is the cheapest available signal that a border is calm, which is exactly why it is also the cheapest available signal when one side decides it is not. Border trade has been switched off twice in living memory, and both times the reason was written on the border, not in a ledger.

  What to watch. Whether Lipulekh follows on a published date, whether the permitted-item lists are modernised or left as they are, and whether the trading season runs its full length this year rather than being cut short.

  Source: reporting on the Nathu La resumption of 27 to 28 July 2026, including Northeast Now and The Tribune; newsonair on the Shipki La resumption of 1 June 2026; Al Jazeera and IPCS on the 2006 reopening and the permitted-item lists.

  Maps: Natural Earth, rendered in-house.

